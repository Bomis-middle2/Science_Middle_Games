<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>G8 Pressure Lab Escape</title>

<style>
:root {
  --bg-main: #0b1329;
  --panel-bg: rgba(23, 37, 84, 0.6);
  --panel-border: rgba(56, 189, 248, 0.25);
  --accent-cyan: #38bdf8;
  --accent-glow: rgba(56, 189, 248, 0.4);
  --success-color: #10b981;
  --danger-color: #f43f5e;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
}

* {
  box-sizing: border-box;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  background: var(--bg-main);
  background-image: 
    radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%);
  color: var(--text-main);
  text-align: center;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Glass Panels */
.glass-panel {
  background: var(--panel-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--panel-border);
  border-radius: 16px;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}

/* Fullscreen Overlay Screens */
.screen {
  position: fixed;
  inset: 0;
  background: rgba(11, 19, 41, 0.95);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 24px;
}

/* Primary Button Design */
button.primary-btn {
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
  color: white;
  font-size: 16px;
  font-weight: 700;
  padding: 14px 28px;
  cursor: pointer;
  min-height: 48px;
  box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
  transition: all 0.2s ease;
  touch-action: manipulation;
  margin-top: 16px;
  letter-spacing: 0.5px;
}

button.primary-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
}

button.primary-btn:active {
  transform: translateY(1px);
}

/* HUD Top Header */
#hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  max-width: 600px;
  height: 52px;
  padding: 0 16px;
  font-size: 14px;
  font-weight: 700;
  flex-shrink: 0;
  border-radius: 0 0 16px 16px;
  border-top: none;
  background: rgba(15, 23, 42, 0.8);
}

.hud-item {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 255, 255, 0.05);
  padding: 6px 12px;
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

/* Flexible Main Stage Container */
#mainStage {
  flex: 1;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 600px;
  padding: 12px;
  gap: 10px;
  overflow: hidden;
}

/* Question Box */
#questionBox {
  width: 100%;
  padding: 12px 16px;
  font-size: clamp(13px, 3.5vw, 15px);
  font-weight: 600;
  line-height: 1.4;
  flex-shrink: 0;
  color: var(--text-main);
  background: rgba(15, 23, 42, 0.7);
  border-color: rgba(56, 189, 248, 0.4);
  box-shadow: 0 0 15px rgba(56, 189, 248, 0.1);
}

/* Status Message Line */
#msg {
  font-size: 13px;
  font-weight: 700;
  height: 20px;
  line-height: 20px;
  flex-shrink: 0;
  transition: all 0.2s ease;
}

/* Interactive Panes */
.pane {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--panel-border) transparent;
}

#targetArea {
  flex: 1;
  min-height: 35%;
  padding: 10px;
}

#sourceArea {
  flex: 1.2;
  min-height: 40%;
  padding: 10px;
  background: rgba(15, 23, 42, 0.5);
}

/* Interactive Cards, Tiles, and Slots */
.card, .tile, .zone, .slot, .object, .seqCard {
  background: rgba(30, 41, 59, 0.8);
  color: var(--text-main);
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  padding: 8px 12px;
  width: 100%;
  min-height: 44px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  touch-action: manipulation;
  transition: all 0.15s ease;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.card:hover, .tile:hover, .object:hover, .seqCard:hover {
  border-color: var(--accent-cyan);
  background: rgba(30, 41, 59, 1);
}

.card:active, .tile:active, .object:active, .seqCard:active {
  transform: scale(0.98);
}

.card.selected, .tile.selected {
  background: rgba(56, 189, 248, 0.2);
  border-color: var(--accent-cyan);
  box-shadow: 0 0 12px var(--accent-glow);
  color: #ffffff;
}

.zone, .slot {
  background: rgba(15, 23, 42, 0.4);
  border-style: dashed;
  border-color: rgba(255, 255, 255, 0.2);
  min-height: 48px;
}

.placed {
  background: rgba(16, 185, 129, 0.2);
  border: 1px solid var(--success-color);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 12px;
  color: #a7f3d0;
  width: 100%;
}

.correctFlash {
  background: rgba(16, 185, 129, 0.3) !important;
  border-color: var(--success-color) !important;
  color: #ffffff !important;
  box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
}

.wrongFlash {
  background: rgba(244, 63, 94, 0.3) !important;
  border-color: var(--danger-color) !important;
  animation: shake 0.35s cubic-bezier(.36,.07,.19,.97) both;
}

/* Hydrostatic Tank Simulator */
.tank {
  width: 150px;
  height: 100%;
  max-height: 190px;
  border: 2px solid rgba(255, 255, 255, 0.4);
  border-radius: 12px;
  margin: auto;
  position: relative;
  background: linear-gradient(to bottom, rgba(56, 189, 248, 0.2), rgba(2, 132, 199, 0.6));
  box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
}

.hole {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 90px;
  height: 34px;
  background: rgba(15, 23, 42, 0.9);
  color: var(--text-main);
  border: 1px solid var(--accent-cyan);
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

.hole:hover {
  background: var(--accent-cyan);
  color: #000;
}

.h1 { top: 10%; }
.h2 { top: 40%; }
.h3 { top: 70%; }

@keyframes shake {
  10%, 90% { transform: translate3d(-1px, 0, 0); }
  20%, 80% { transform: translate3d(2px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
  40%, 60% { transform: translate3d(4px, 0, 0); }
}
</style>
</head>

<body>

<div id="loader" class="screen">
  <div style="font-size:48px; margin-bottom:12px; filter: drop-shadow(0 0 10px var(--accent-glow));">🧪</div>
  <h3 style="letter-spacing: 1px;">Loading Pressure Lab...</h3>
</div>

<div id="instructions" class="screen" style="display:none">
  <h2 style="margin-bottom:12px; color: var(--accent-cyan);">🧪 Pressure Lab Escape</h2>
  <div class="glass-panel" style="padding:16px; text-align:left; font-size:14px; line-height:1.5; max-width:340px; margin-bottom: 8px;">
    <p style="margin: 6px 0;">• <b>Upper Zone:</b> Targets & Answer Slots.</p>
    <p style="margin: 6px 0;">• <b>Lower Zone:</b> Interactive Items & Cards.</p>
    <p style="margin: 6px 0;">• Tap an item below to select, then tap its corresponding target above.</p>
  </div>
  <button class="primary-btn" onclick="startGame()">Start Lab</button>
</div>

<div id="endScreen" class="screen" style="display:none">
  <h2 style="color: var(--accent-cyan); margin-bottom: 8px;">🏆 Lab Complete!</h2>
  <h3 style="font-size: 20px;">Score: <span id="finalScore" style="color: var(--success-color);"></span> / 100</h3>
  <button class="primary-btn" onclick="location.reload()">Play Again</button>
</div>

<div id="hud" class="glass-panel">
  <div class="hud-item"><span style="color: #f59e0b;">⭐</span> <span id="score">0</span></div>
  <div class="hud-item"><span style="color: #f43f5e;">❤️</span> <span id="chances">2</span></div>
  <div class="hud-item"><span style="color: var(--accent-cyan);">🧪</span> Lvl <span id="levelNo">1</span>/10</div>
</div>

<div id="mainStage">
  <div id="questionBox" class="glass-panel">Lab challenge loading...</div>
  
  <!-- Upper Drop Zone -->
  <div id="targetArea" class="pane glass-panel"></div>
  
  <div id="msg"></div>
  
  <!-- Lower Choice Items -->
  <div id="sourceArea" class="pane glass-panel"></div>
</div>

<script>
const audioCorrect = new Audio('assets/correct.mp3');
const audioWrong = new Audio('assets/wrong.mp3');

function playSound(aud) {
  aud.currentTime = 0;
  aud.play().catch(e => {});
}

const levels = [
  {type:"formula",q:"Build formula: Tap item below, then matching slot above.",slots:["Pressure","=","Force","÷","Area"],tiles:["Area","Force","Pressure","÷","="],answer:"Pressure = Force ÷ Area"},
  {type:"formula",q:"Build relation: Tap item below, then matching slot above.",slots:["1 Pa","=","1 N","/","m²"],tiles:["m²","1 N","=","1 Pa","/"],answer:"1 Pa = 1 N / m²"},
  {type:"sort",q:"Tap item below, then target zone above.",cards:[["Sharp knife cuts easily","High Pressure"],["Camel has broad feet","Low Pressure"],["Needle pierces cloth","High Pressure"],["Flat shoes on sand","Low Pressure"]],zones:["High Pressure","Low Pressure"]},
  {type:"tank",q:"Tap hole where hydrostatic fluid pressure is greatest.",answer:"Bottom"},
  {type:"sequence",q:"Tap steps in correct physical sequence.",steps:["Pull plunger","Volume increases","Pressure decreases","Liquid enters"]},
  {type:"sort",q:"Tap statement below, then True/False above.",cards:[["Liquids & gases are fluids","True"],["Pressure grows with depth","True"],["Liquids push down only","False"],["Denser liquids give less P","False"]],zones:["True","False"]},
  {type:"balance",q:"Tap floating condition.",answer:"Buoyant force > Weight"},
  {type:"sort",q:"Classify pressure effects into target zones.",cards:[["Truck multi-tyres","Area Increased"],["Sharp blade cuts","Area Reduced"],["Tank crawler tracks","Area Increased"],["Nail pierces wood","Area Reduced"]],zones:["Area Increased","Area Reduced"]},
  {type:"sequence",q:"Order crushing can experiment steps.",steps:["Heat can","Air escapes","Invert in cold water","Pressure crushes can"]},
  {type:"sort",q:"Classify pressure source type.",cards:[["Suction cup on wall","Atmospheric Pressure"],["Dam thicker at bottom","Liquid Pressure"],["Barometer reads air","Atmospheric Pressure"],["Diver feels depth P","Liquid Pressure"]],zones:["Atmospheric Pressure","Liquid Pressure"]}
];

let level = 0, score = 0, chances = 2, locked = false, selected = null, placed = 0, seqIndex = 0, formulaBuilt = [];

const targetArea = document.getElementById("targetArea");
const sourceArea = document.getElementById("sourceArea");

window.onload = () => setTimeout(() => {
  document.getElementById("loader").style.display = "none";
  document.getElementById("instructions").style.display = "flex";
}, 600);

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function startGame() {
  document.getElementById("instructions").style.display = "none";
  shuffleArray(levels);
  level = 0; score = 0;
  updateScore();
  loadLevel();
}

function loadLevel() {
  locked = false; selected = null; placed = 0; seqIndex = 0; formulaBuilt = []; chances = 2;
  updateChances(); msg("");
  targetArea.innerHTML = ""; sourceArea.innerHTML = "";
  targetArea.style.display = "flex"; sourceArea.style.display = "flex";

  if (level >= levels.length) { endGame(); return; }
  const item = levels[level];
  document.getElementById("levelNo").textContent = level + 1;
  document.getElementById("questionBox").textContent = item.q;

  if (item.type === "formula") buildFormula(item);
  if (item.type === "sort") buildSort(item);
  if (item.type === "tank") buildTank(item);
  if (item.type === "sequence") buildSequence(item);
  if (item.type === "balance") buildBalance(item);
}

function buildFormula(item) {
  item.slots.forEach((s, i) => {
    let slot = document.createElement("div"); slot.className = "slot"; slot.dataset.expected = s; slot.textContent = "Step " + (i + 1);
    slot.onclick = () => placeFormula(slot);
    targetArea.appendChild(slot);
  });

  let tilesCopy = [...item.tiles]; shuffleArray(tilesCopy);
  tilesCopy.forEach(t => {
    let tile = document.createElement("div"); tile.className = "tile"; tile.textContent = t;
    tile.onclick = () => {
      if (locked) return;
      selected = tile;
      document.querySelectorAll(".tile").forEach(x => x.classList.remove("selected"));
      tile.classList.add("selected");
      msg("Item selected! Tap target slot above.", "var(--accent-cyan)");
    };
    sourceArea.appendChild(tile);
  });
}

function placeFormula(slot) {
  if (!selected || locked || slot.dataset.filled) return;
  if (selected.textContent === slot.dataset.expected) {
    slot.textContent = selected.textContent;
    slot.dataset.filled = "yes";
    slot.classList.add("correctFlash");
    formulaBuilt.push(selected.textContent);
    selected.remove(); selected = null;
    score += 2; updateScore(); playSound(audioCorrect);
    if (formulaBuilt.length === levels[level].slots.length) correctNext();
  } else {
    wrong(levels[level].answer);
  }
}

function buildSort(item) {
  item.zones.forEach(z => {
    let zone = document.createElement("div"); zone.className = "zone"; zone.dataset.zone = z;
    zone.innerHTML = "<b>" + z + "</b>";
    zone.onclick = () => checkZone(zone, item.cards.length);
    targetArea.appendChild(zone);
  });

  let cardsCopy = [...item.cards]; shuffleArray(cardsCopy);
  cardsCopy.forEach(c => {
    let card = document.createElement("div"); card.className = "card"; card.textContent = c[0]; card.dataset.answer = c[1];
    card.onclick = () => {
      if (locked) return;
      selected = card;
      document.querySelectorAll(".card").forEach(x => x.classList.remove("selected"));
      card.classList.add("selected");
      msg("Card selected! Tap target zone above.", "var(--accent-cyan)");
    };
    sourceArea.appendChild(card);
  });
}

function checkZone(zone, total) {
  if (!selected || locked) return;
  if (selected.dataset.answer === zone.dataset.zone) {
    let p = document.createElement("div"); p.className = "placed"; p.textContent = selected.textContent;
    zone.appendChild(p);
    selected.remove(); selected = null;
    placed++; score += 2; updateScore();
    playSound(audioCorrect);
    msg("✅ Placed!", "var(--success-color)");
    if (placed === total) correctNext();
  } else {
    zone.classList.add("wrongFlash");
    setTimeout(() => zone.classList.remove("wrongFlash"), 500);
    wrong(selected.dataset.answer);
  }
}

function buildTank(item) {
  sourceArea.style.display = "none";
  let tank = document.createElement("div"); tank.className = "tank";
  [["Top", "h1"], ["Middle", "h2"], ["Bottom", "h3"]].forEach(x => {
    let h = document.createElement("div"); h.className = "hole " + x[1]; h.textContent = x[0];
    h.onclick = () => {
      if (locked) return;
      if (x[0] === item.answer) correctNext();
      else wrong(item.answer + " hole");
    };
    tank.appendChild(h);
  });
  targetArea.appendChild(tank);
}

function buildSequence(item) {
  targetArea.style.display = "none";
  let stepsCopy = [...item.steps]; shuffleArray(stepsCopy);
  stepsCopy.forEach(step => {
    let c = document.createElement("div"); c.className = "seqCard"; c.textContent = step;
    c.onclick = () => {
      if (locked) return;
      if (step === item.steps[seqIndex]) {
        c.classList.add("correctFlash");
        c.style.pointerEvents = "none";
        seqIndex++; score += 2; updateScore(); playSound(audioCorrect);
        if (seqIndex === item.steps.length) correctNext();
      } else {
        c.classList.add("wrongFlash");
        setTimeout(() => c.classList.remove("wrongFlash"), 500);
        wrong(item.steps.join(" → "));
      }
    };
    sourceArea.appendChild(c);
  });
}

function buildBalance(item) {
  targetArea.style.display = "none";
  let choices = ["Buoyant force > Weight", "Buoyant force < Weight", "Buoyant force = 0"];
  shuffleArray(choices);
  choices.forEach(x => {
    let b = document.createElement("div"); b.className = "object"; b.textContent = x;
    b.onclick = () => {
      if (locked) return;
      if (x === item.answer) correctNext();
      else wrong(item.answer);
    };
    sourceArea.appendChild(b);
  });
}

function wrong(ans) {
  playSound(audioWrong);
  chances--; updateChances();
  if (chances > 0) {
    msg("❌ Try again!", "var(--danger-color)");
  } else {
    locked = true;
    msg("Ans: " + ans, "var(--danger-color)");
    level++; setTimeout(loadLevel, 2200);
  }
}

function correctNext() {
  score += 10; updateScore(); playSound(audioCorrect);
  locked = true;
  msg("✅ Correct!", "var(--success-color)");
  level++; setTimeout(loadLevel, 1200);
}

function updateScore() { document.getElementById("score").textContent = score; }
function updateChances() { document.getElementById("chances").textContent = chances; }
function msg(t, c) { 
  let m = document.getElementById("msg"); 
  m.textContent = t || ""; 
  m.style.color = c || "var(--text-main)"; 
}

function endGame() {
  playSound(audioCorrect);
  document.getElementById("finalScore").textContent = score;
  document.getElementById("endScreen").style.display = "flex";
}
</script>

</body>
</html>
