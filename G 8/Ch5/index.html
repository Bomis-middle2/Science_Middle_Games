<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>G8 Pressure Lab Escape - Mobile Optimized</title>

<style>
* {
  box-sizing: border-box;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0f172a;
  color: white;
  text-align: center;
}

body {
  display: flex;
  flex-direction: column;
}

.screen {
  position: fixed;
  inset: 0;
  background: linear-gradient(#eaf9ff, #ffffff);
  color: #0f172a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 16px;
}

button.primary-btn {
  border: 0;
  border-radius: 10px;
  background: #0ea5e9;
  color: white;
  font-size: 16px;
  font-weight: bold;
  padding: 12px 24px;
  cursor: pointer;
  min-height: 44px;
  box-shadow: 0 3px 0 #0369a1;
  touch-action: manipulation;
  margin-top: 12px;
}

button.primary-btn:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #0369a1;
}

/* HUD Top Header */
#hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  height: 40px;
  background: #020617;
  padding: 0 12px;
  font-size: 13px;
  font-weight: bold;
  flex-shrink: 0;
  border-bottom: 1px solid #1e293b;
}

/* Flexible Main Stage Container */
#mainStage {
  flex: 1;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding: 8px;
  gap: 8px;
  overflow: hidden;
}

/* Compact Question Box */
#questionBox {
  width: 100%;
  background: white;
  color: #0f172a;
  border: 2px solid #38bdf8;
  border-radius: 8px;
  padding: 8px;
  font-size: 13px;
  font-weight: bold;
  line-height: 1.3;
  flex-shrink: 0;
}

/* Status Message Line */
#msg {
  font-size: 12px;
  font-weight: bold;
  height: 18px;
  line-height: 18px;
  flex-shrink: 0;
}

/* Interactive Panes */
.pane {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

#targetArea {
  flex: 1;
  min-height: 35%;
  background: rgba(30, 41, 59, 0.5);
  border-radius: 8px;
  padding: 6px;
}

#sourceArea {
  flex: 1.2;
  min-height: 40%;
  background: rgba(15, 23, 42, 0.8);
  border-radius: 8px;
  padding: 6px;
}

/* Tap Targets and Cards */
.card, .tile, .zone, .slot, .object, .seqCard {
  background: white;
  color: #0f172a;
  border: 2px solid #38bdf8;
  border-radius: 8px;
  padding: 6px 8px;
  width: 100%;
  min-height: 42px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  touch-action: manipulation;
}

.card:active, .tile:active, .object:active, .seqCard:active {
  transform: scale(0.97);
}

.card.selected, .tile.selected {
  background: #fef08a;
  border-color: #f59e0b;
}

.zone, .slot {
  background: #e0f2fe;
  border-style: dashed;
  min-height: 46px;
}

.placed {
  background: #dcfce7;
  border: 1px solid #22c55e;
  border-radius: 4px;
  padding: 2px 4px;
  font-size: 11px;
  color: #111;
  width: 100%;
}

.correctFlash {
  background: #dcfce7 !important;
  border-color: #22c55e !important;
  color: #111 !important;
}

.wrongFlash {
  background: #fee2e2 !important;
  border-color: #ef4444 !important;
  animation: shake .35s;
}

/* Hydrostatic Tank */
.tank {
  width: 140px;
  height: 100%;
  max-height: 180px;
  border: 3px solid white;
  border-radius: 10px;
  margin: auto;
  position: relative;
  background: linear-gradient(to bottom, #38bdf888, #0284c7bb);
}

.hole {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 80px;
  height: 32px;
  background: white;
  color: #111;
  border: 2px solid #111;
  border-radius: 6px;
  font-size: 12px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
}

.h1 { top: 8%; }
.h2 { top: 38%; }
.h3 { top: 68%; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}
</style>
</head>

<body>

<div id="loader" class="screen">
  <div style="font-size:40px; margin-bottom:8px;">🧪</div>
  <h3>Loading Pressure Lab...</h3>
</div>

<div id="instructions" class="screen" style="display:none">
  <h2 style="margin-bottom:8px;">🧪 Pressure Lab Escape</h2>
  <div style="text-align:left; font-size:13px; line-height:1.4; max-width:320px;">
    <p>• <b>Top Zone:</b> Task Targets / Slots.</p>
    <p>• <b>Bottom Zone:</b> Choices / Items.</p>
    <p>• Tap an item below to select, then tap target slot above.</p>
  </div>
  <button class="primary-btn" onclick="startGame()">Start Lab</button>
</div>

<div id="endScreen" class="screen" style="display:none">
  <h2>🏆 Lab Complete!</h2>
  <h3>Score: <span id="finalScore"></span> / 100</h3>
  <button class="primary-btn" onclick="location.reload()">Play Again</button>
</div>

<div id="hud">
  <div>⭐ <span id="score">0</span></div>
  <div>❤️ <span id="chances">2</span></div>
  <div>🧪 Lvl <span id="levelNo">1</span>/10</div>
</div>

<div id="mainStage">
  <div id="questionBox">Lab challenge loading...</div>
  
  <!-- Upper Drop Zone -->
  <div id="targetArea" class="pane"></div>
  
  <div id="msg"></div>
  
  <!-- Lower Choice Items -->
  <div id="sourceArea" class="pane"></div>
</div>

<script>
const audioCorrect = new Audio('assets/correct.mp3');
const audioWrong = new Audio('assets/wrong.mp3');

function playSound(aud) {
  aud.currentTime = 0;
  aud.play().catch(e => {});
}

const levels = [
  {type:"formula",q:"Build formula: Tap item below, then matching slot above.",slots:["Pressure","=","Force","÷","Area"],tiles:["Area","Force","Pressure","÷","="],answer:"Pressure = Force ÷ Area"},
  {type:"formula",q:"Build relation: Tap item below, then matching slot above.",slots:["1 Pa","=","1 N","/","m²"],tiles:["m²","1 N","=","1 Pa","/"],answer:"1 Pa = 1 N / m²"},
  {type:"sort",q:"Tap item below, then target zone above.",cards:[["Sharp knife cuts easily","High Pressure"],["Camel has broad feet","Low Pressure"],["Needle pierces cloth","High Pressure"],["Flat shoes on sand","Low Pressure"]],zones:["High Pressure","Low Pressure"]},
  {type:"tank",q:"Tap hole where hydrostatic fluid pressure is greatest.",answer:"Bottom"},
  {type:"sequence",q:"Tap steps in correct physical sequence.",steps:["Pull plunger","Volume increases","Pressure decreases","Liquid enters"]},
  {type:"sort",q:"Tap statement below, then True/False above.",cards:[["Liquids & gases are fluids","True"],["Pressure grows with depth","True"],["Liquids push down only","False"],["Denser liquids give less P","False"]],zones:["True","False"]},
  {type:"balance",q:"Tap floating condition.",answer:"Buoyant force > Weight"},
  {type:"sort",q:"Classify pressure effects into target zones.",cards:[["Truck multi-tyres","Area Increased"],["Sharp blade cuts","Area Reduced"],["Tank crawler tracks","Area Increased"],["Nail pierces wood","Area Reduced"]],zones:["Area Increased","Area Reduced"]},
  {type:"sequence",q:"Order crushing can experiment steps.",steps:["Heat can","Air escapes","Invert in cold water","Pressure crushes can"]},
  {type:"sort",q:"Classify pressure source type.",cards:[["Suction cup on wall","Atmospheric Pressure"],["Dam thicker at bottom","Liquid Pressure"],["Barometer reads air","Atmospheric Pressure"],["Diver feels depth P","Liquid Pressure"]],zones:["Atmospheric Pressure","Liquid Pressure"]}
];

let level = 0, score = 0, chances = 2, locked = false, selected = null, placed = 0, seqIndex = 0, formulaBuilt = [];

const targetArea = document.getElementById("targetArea");
const sourceArea = document.getElementById("sourceArea");

window.onload = () => setTimeout(() => {
  document.getElementById("loader").style.display = "none";
  document.getElementById("instructions").style.display = "flex";
}, 600);

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function startGame() {
  document.getElementById("instructions").style.display = "none";
  shuffleArray(levels);
  level = 0; score = 0;
  updateScore();
  loadLevel();
}

function loadLevel() {
  locked = false; selected = null; placed = 0; seqIndex = 0; formulaBuilt = []; chances = 2;
  updateChances(); msg("");
  targetArea.innerHTML = ""; sourceArea.innerHTML = "";
  targetArea.style.display = "flex"; sourceArea.style.display = "flex";

  if (level >= levels.length) { endGame(); return; }
  const item = levels[level];
  document.getElementById("levelNo").textContent = level + 1;
  document.getElementById("questionBox").textContent = item.q;

  if (item.type === "formula") buildFormula(item);
  if (item.type === "sort") buildSort(item);
  if (item.type === "tank") buildTank(item);
  if (item.type === "sequence") buildSequence(item);
  if (item.type === "balance") buildBalance(item);
}

function buildFormula(item) {
  item.slots.forEach((s, i) => {
    let slot = document.createElement("div"); slot.className = "slot"; slot.dataset.expected = s; slot.textContent = "Step " + (i + 1);
    slot.onclick = () => placeFormula(slot);
    targetArea.appendChild(slot);
  });

  let tilesCopy = [...item.tiles]; shuffleArray(tilesCopy);
  tilesCopy.forEach(t => {
    let tile = document.createElement("div"); tile.className = "tile"; tile.textContent = t;
    tile.onclick = () => {
      if (locked) return;
      selected = tile;
      document.querySelectorAll(".tile").forEach(x => x.classList.remove("selected"));
      tile.classList.add("selected");
      msg("Item selected! Tap target slot above.", "#38bdf8");
    };
    sourceArea.appendChild(tile);
  });
}

function placeFormula(slot) {
  if (!selected || locked || slot.dataset.filled) return;
  if (selected.textContent === slot.dataset.expected) {
    slot.textContent = selected.textContent;
    slot.dataset.filled = "yes";
    slot.classList.add("correctFlash");
    formulaBuilt.push(selected.textContent);
    selected.remove(); selected = null;
    score += 2; updateScore(); playSound(audioCorrect);
    if (formulaBuilt.length === levels[level].slots.length) correctNext();
  } else {
    wrong(levels[level].answer);
  }
}

function buildSort(item) {
  item.zones.forEach(z => {
    let zone = document.createElement("div"); zone.className = "zone"; zone.dataset.zone = z;
    zone.innerHTML = "<b>" + z + "</b>";
    zone.onclick = () => checkZone(zone, item.cards.length);
    targetArea.appendChild(zone);
  });

  let cardsCopy = [...item.cards]; shuffleArray(cardsCopy);
  cardsCopy.forEach(c => {
    let card = document.createElement("div"); card.className = "card"; card.textContent = c[0]; card.dataset.answer = c[1];
    card.onclick = () => {
      if (locked) return;
      selected = card;
      document.querySelectorAll(".card").forEach(x => x.classList.remove("selected"));
      card.classList.add("selected");
      msg("Card selected! Tap target zone above.", "#38bdf8");
    };
    sourceArea.appendChild(card);
  });
}

function checkZone(zone, total) {
  if (!selected || locked) return;
  if (selected.dataset.answer === zone.dataset.zone) {
    let p = document.createElement("div"); p.className = "placed"; p.textContent = selected.textContent;
    zone.appendChild(p);
    selected.remove(); selected = null;
    placed++; score += 2; updateScore();
    playSound(audioCorrect);
    msg("✅ Placed!", "#22c55e");
    if (placed === total) correctNext();
  } else {
    zone.classList.add("wrongFlash");
    setTimeout(() => zone.classList.remove("wrongFlash"), 500);
    wrong(selected.dataset.answer);
  }
}

function buildTank(item) {
  sourceArea.style.display = "none";
  let tank = document.createElement("div"); tank.className = "tank";
  [["Top", "h1"], ["Middle", "h2"], ["Bottom", "h3"]].forEach(x => {
    let h = document.createElement("div"); h.className = "hole " + x[1]; h.textContent = x[0];
    h.onclick = () => {
      if (locked) return;
      if (x[0] === item.answer) correctNext();
      else wrong(item.answer + " hole");
    };
    tank.appendChild(h);
  });
  targetArea.appendChild(tank);
}

function buildSequence(item) {
  targetArea.style.display = "none";
  let stepsCopy = [...item.steps]; shuffleArray(stepsCopy);
  stepsCopy.forEach(step => {
    let c = document.createElement("div"); c.className = "seqCard"; c.textContent = step;
    c.onclick = () => {
      if (locked) return;
      if (step === item.steps[seqIndex]) {
        c.classList.add("correctFlash");
        c.style.pointerEvents = "none";
        seqIndex++; score += 2; updateScore(); playSound(audioCorrect);
        if (seqIndex === item.steps.length) correctNext();
      } else {
        c.classList.add("wrongFlash");
        setTimeout(() => c.classList.remove("wrongFlash"), 500);
        wrong(item.steps.join(" → "));
      }
    };
    sourceArea.appendChild(c);
  });
}

function buildBalance(item) {
  targetArea.style.display = "none";
  let choices = ["Buoyant force > Weight", "Buoyant force < Weight", "Buoyant force = 0"];
  shuffleArray(choices);
  choices.forEach(x => {
    let b = document.createElement("div"); b.className = "object"; b.textContent = x;
    b.onclick = () => {
      if (locked) return;
      if (x === item.answer) correctNext();
      else wrong(item.answer);
    };
    sourceArea.appendChild(b);
  });
}

function wrong(ans) {
  playSound(audioWrong);
  chances--; updateChances();
  if (chances > 0) {
    msg("❌ Try again!", "#ef4444");
  } else {
    locked = true;
    msg("Ans: " + ans, "#ef4444");
    level++; setTimeout(loadLevel, 2200);
  }
}

function correctNext() {
  score += 10; updateScore(); playSound(audioCorrect);
  locked = true;
  msg("✅ Correct!", "#22c55e");
  level++; setTimeout(loadLevel, 1200);
}

function updateScore() { document.getElementById("score").textContent = score; }
function updateChances() { document.getElementById("chances").textContent = chances; }
function msg(t, c) { 
  let m = document.getElementById("msg"); 
  m.textContent = t || ""; 
  m.style.color = c || "white"; 
}

function endGame() {
  playSound(audioCorrect);
  document.getElementById("finalScore").textContent = score;
  document.getElementById("endScreen").style.display = "flex";
}
</script>

</body>
</html>
