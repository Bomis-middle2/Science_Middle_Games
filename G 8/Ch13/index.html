<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Guardian: The Planetary Survival Quest</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b132b;
            color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .game-card {
            background: #1c2541;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            max-width: 720px;
            width: 100%;
            padding: 28px;
            border: 1px solid #3a506b;
            position: relative;
            min-height: 540px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #3a506b;
            padding-bottom: 12px;
        }
        .header h1 {
            color: #4ea8de;
            font-size: 1.8rem;
            margin-bottom: 6px;
        }
        .status-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0b132b;
            padding: 12px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .health-bar-bg {
            width: 140px;
            height: 16px;
            background-color: #3a506b;
            border-radius: 8px;
            overflow: hidden;
        }
        .health-bar-fill {
            width: 100%;
            height: 100%;
            background-color: #48bb78;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        .stage-title {
            font-size: 1.25rem;
            color: #f6c445;
            margin-bottom: 12px;
        }
        .visual-asset {
            width: 100%;
            max-height: 220px;
            border-radius: 10px;
            margin-bottom: 16px;
            background-color: #0b132b;
            border: 1px solid #3a506b;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .visual-asset svg {
            width: 100%;
            height: 180px;
        }
        .story-text {
            font-size: 0.98rem;
            line-height: 1.6;
            color: #d1d5db;
            margin-bottom: 20px;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #3a506b;
            color: #ffffff;
            border: 2px solid transparent;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }
        .option-btn:hover {
            background-color: #5bc0be;
            color: #0b132b;
            font-weight: 600;
        }
        .feedback-box {
            padding: 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            display: none;
            margin-bottom: 16px;
            line-height: 1.4;
        }
        .feedback-box.correct {
            background-color: rgba(72, 187, 120, 0.2);
            border: 1px solid #48bb78;
            color: #68d391;
        }
        .feedback-box.incorrect {
            background-color: rgba(245, 101, 101, 0.2);
            border: 1px solid #f56565;
            color: #fc8181;
        }
        .action-btn {
            width: 100%;
            background-color: #4ea8de;
            color: #0b132b;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .action-btn:hover {
            background-color: #5bc0be;
        }
        .restart-btn {
            background-color: #f56565;
            color: white;
        }
        .restart-btn:hover {
            background-color: #e53e3e;
        }
        
        /* Screen Specific Layouts */
        .screen-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%;
            flex-grow: 1;
        }
        .logo-img {
            max-width: 280px;
            width: 80%;
            height: auto;
            margin-bottom: 24px;
            filter: drop-shadow(0 0 12px rgba(91, 192, 190, 0.4));
        }
        .instruction-box {
            background-color: #0b132b;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #3a506b;
            text-align: left;
            margin-bottom: 24px;
            width: 100%;
        }
        .instruction-box ul {
            margin-left: 20px;
            margin-top: 10px;
            color: #d1d5db;
        }
        .instruction-box li {
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="game-card" id="game-card">
    <!-- Screen content loaded via JS -->
</div>

        flower: `<svg viewBox="0 0 400 150">

        hydrosphere: `<svg viewBox="0 0 400 150">

        biodiversity: `<svg viewBox="0 0 400 150">
            <circle cx="120" cy="75" r="35" fill="#2b6cb0" />
            <circle cx="200" cy="75" r="35" fill="#2f855a" />

            <text x="200" y="135" fill="#4ea8de" font-size="11" text-anchor="middle">Web of Interconnected Life</text>
        </svg>`

    const gameData = [
        {
            title: "Sector 1: Orbit Selection (Habitable Zone)",
            desc: "An alien probe is analyzing potential planets to sustain human-like life. It needs to position a new biosphere near a star. Which region will keep water liquid without freezing or evaporating?",
            asset: SVG_ASSETS.goldilocks,
            options: [
                { text: "Position A: Very close to the star where all surface water evaporates.", correct: false, reason: "Incorrect! Being too close turns the planet into a scorching desert." },
                { text: "Position B: In the Goldilocks Zone (Habitable Zone).", correct: true, reason: "Correct! The Habitable Zone keeps temperatures 'just right' for liquid water to exist." },
                { text: "Position C: Far beyond the outer gas giants where water locks into permanent ice.", correct: false, reason: "Incorrect! Being too far makes the planet a freezing ice world." }
            ]
        },
        {
            title: "Sector 2: Defense Against Solar Winds",
            desc: "A massive solar wind stream is heading straight towards Earth's atmosphere! Which natural protective shield deflects high-energy charged particles from damaging the ozone layer and atmosphere?",
            asset: SVG_ASSETS.magnetosphere,
            options: [
                { text: "Shield 1: Earth's Magnetic Field generated by molten iron in its core.", correct: true, reason: "Correct! The magnetic field acts as a protective shield, deflecting solar wind particles." },
                { text: "Shield 2: Thick Carbon Dioxide layer like Venus.", correct: false, reason: "Incorrect! A thick CO2 atmosphere causes a runaway greenhouse effect that melts lead!" },
                { text: "Shield 3: Earth's liquid oceans (Hydrosphere).", correct: false, reason: "Incorrect! While water regulates climate, it cannot deflect charged space particles." }
            ]
        },
        {
            title: "Sector 3: Thermal Blanket (Greenhouse Effect)",
            desc: "Without naturally occurring greenhouse gases like carbon dioxide and water vapor, Earth's average surface temperature would plummet to -18°C. How do these gases regulate Earth's climate?",
            asset: SVG_ASSETS.greenhouse,
            options: [
                { text: "Option A: They generate internal nuclear heat directly inside the atmosphere.", correct: false, reason: "Incorrect! Atmospheric gases do not undergo nuclear reactions." },
                { text: "Option B: They absorb outgoing infrared heat radiation from Earth's surface and re-radiate it back.", correct: true, reason: "Correct! The natural greenhouse effect traps thermal energy, keeping the planet warm enough for life." },
                { text: "Option C: They block all sunlight from entering the atmosphere entirely.", correct: false, reason: "Incorrect! Blocking all sunlight would prevent photosynthesis and plunge Earth into total darkness." }
            ]
        },
        {
            title: "Sector 4: Atmospheric Shielding (The Ozone Layer)",
            desc: "High-frequency Ultraviolet (UV-C and UV-B) rays from the Sun are bombardment threats to cellular DNA. Which atmospheric layer contains high concentrations of O3 gas to filter these rays?",
            asset: SVG_ASSETS.ozone,
            options: [
                { text: "Layer 1: Troposphere, where weather events take place.", correct: false, reason: "Incorrect! Ground-level ozone in the troposphere is a pollutant, not the protective layer." },
                { text: "Layer 2: Stratosphere, housing the natural ozone layer.", correct: true, reason: "Correct! The ozone layer in the stratosphere absorbs harmful solar UV rays before they reach the ground." },
                { text: "Layer 3: Thermosphere, where space shuttles orbit.", correct: false, reason: "Incorrect! The thermosphere absorbs X-rays and gamma rays, but ozone sits in the stratosphere." }
            ]
        },
        {
            title: "Sector 5: Climate Regulation (The Hydrosphere)",
            desc: "Global temperature extremes are stabilized because ocean currents circulate enormous amounts of thermal energy from the equator toward the poles. What property of water makes this possible?",
            asset: SVG_ASSETS.hydrosphere,
            options: [
                { text: "Property A: Low boiling point that allows fast evaporation.", correct: false, reason: "Incorrect! Low boiling points cause rapid loss of liquid oceans." },
                { text: "Property B: High specific heat capacity, absorbing large amounts of heat with minimal temperature change.", correct: true, reason: "Correct! Water's high heat capacity allows oceans to store and transport heat globally." },
                { text: "Property C: High salinity that resists ocean current motion.", correct: false, reason: "Incorrect! Salinity actually helps drive ocean density circulation rather than blocking it." }
            ]
        },
        {
            title: "Sector 6: Species Preservation (Reproduction)",
            desc: "A harsh environmental shift has affected a population of flatworms. To quickly regenerate a damaged colony from tiny fragmented body parts, which process will save them?",
            asset: SVG_ASSETS.planaria,
            options: [
                { text: "Method A: Sexual Reproduction using pollen and seeds.", correct: false, reason: "Incorrect! Pollen and seeds are used in plant reproduction." },
                { text: "Method B: Asexual Regeneration (like in Planaria).", correct: true, reason: "Correct! Planaria can regenerate complete new organisms from body fragments!" },
                { text: "Method C: Internal fertilization via placenta.", correct: false, reason: "Incorrect! Placental development occurs in mammals, not simple flatworms." }
            ]
        },
        {
            title: "Sector 7: Plant Reproduction Mechanisms",
            desc: "To ensure successful sexual reproduction in flowering plants (angiosperms), pollen must transfer from the male structure to the female structure. What are these structures called?",
            asset: SVG_ASSETS.flower,
            options: [
                { text: "Option A: From Sepal to Petal.", correct: false, reason: "Incorrect! Sepals and petals protect the flower and attract pollinators." },
                { text: "Option B: From Anther (Stamen) to Stigma (Pistil/Carpel).", correct: true, reason: "Correct! Pollen produced in the anther must land on the sticky stigma for fertilization to occur." },
                { text: "Option C: From Root cap to Xylem vessel.", correct: false, reason: "Incorrect! Roots and xylem are involved in water transport, not reproduction." }

                { text: "Option A: Binary fission where cells split into identical copies.", correct: false, reason: "Incorrect! Binary fission produces exact clones without mixing genetic material from two parents." },

            asset: SVG_ASSETS.biodiversity,
            options: [
                { text: "Option A: Diverse ecosystems contain multiple species filling similar roles, ensuring ecological stability if one dies out.", correct: true, reason: "Correct! High biodiversity creates resilient food webs where alternative species prevent total collapse." },

            desc: "Earth is facing the Triple Planetary Crisis: Climate Change, Biodiversity Loss, and Pollution. As an Earth Guardian, which action addresses global warming caused by excess carbon dioxide?",

            options: [
                { text: "Action A: Increase burning of fossil fuels for fast energy generation.", correct: false, reason: "Incorrect! Burning fossil fuels releases massive amounts of CO2 and worsens global warming." },
                { text: "Action B: Shift to renewable energy (solar/wind) and protect forests.", correct: true, reason: "Correct! Renewable energy cuts emissions, while trees absorb CO2." },
                { text: "Action C: Dump agricultural chemicals into freshwater bodies.", correct: false, reason: "Incorrect! This causes water and soil pollution, harming biodiversity." }

    let currentStage = 0;
    let shieldIntegrity = 100;

    function renderLogoScreen() {
        const card = document.getElementById("game-card");
        card.innerHTML = `
            <div class="screen-center">
                <img src="assets/logo.png" alt="Innovine Logo" class="logo-img" onerror="this.onerror=null; this.src='https://via.placeholder.com/280x100?text=INNOVINE';">
              
                <button class="action-btn" onclick="renderInstructionScreen()">Start Briefing</button>
            </div>
        `;
    }

    function renderInstructionScreen() {
        const card = document.getElementById("game-card");
        card.innerHTML = `
            <div>
                <div class="header">
                    <h1>🎮 Mission Instructions</h1>
                </div>
                <div class="instruction-box">
                    <h3 style="color: #f6c445; margin-bottom: 10px;">Objective:</h3>
                    <p style="color: #d1d5db; font-size: 0.95rem; line-height: 1.5;">
                        Guide Earth through 10 critical planetary sectors by answering key science and sustainability challenges to maintain biosphere equilibrium.
                    </p>
                    <h3 style="color: #f6c445; margin-top: 16px; margin-bottom: 10px;">Rules of Engagement:</h3>
                    <ul>
                        <li><strong>Shield Integrity:</strong> You start with 100% Shield Integrity.</li>
                        <li><strong>Penalty:</strong> Every incorrect answer reduces your shield by 10%.</li>
                        <li><strong>Defeat:</strong> If your Shield Integrity hits 0%, the mission fails and must be restarted.</li>
                        <li><strong>Victory:</strong> Navigate all 10 sectors successfully to save the planet!</li>
                    </ul>
                </div>
            </div>
            <button class="action-btn" onclick="startGame()">Begin Mission</button>
        `;
    }

    function startGame() {
        currentStage = 0;
        shieldIntegrity = 100;
        loadStage();
    }

    function loadStage() {
        const stage = gameData[currentStage];
        const card = document.getElementById("game-card");
        
        card.innerHTML = `
            <div>
                <div class="header">
                    <h1>🌍 Earth Guardian Quest</h1>
                </div>

                <div class="status-container">
                    <div>Stage: <span id="stage-counter" style="color: #4ea8de; font-weight: bold;">${currentStage + 1}/${gameData.length}</span></div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span>Shield Integrity:</span>
                        <div class="health-bar-bg">
                            <div class="health-bar-fill" id="shield-bar"></div>
                        </div>
                        <span id="shield-text" style="font-weight: bold;">${shieldIntegrity}%</span>
                    </div>
                </div>

                <div id="stage-container">
                    <h2 class="stage-title">${stage.title}</h2>
                    <div class="visual-asset">${stage.asset}</div>
                    <p class="story-text">${stage.desc}</p>

                    <div class="options-list" id="options-container"></div>

                    <div class="feedback-box" id="feedback-box"></div>
                </div>
            </div>
            <button class="action-btn" id="next-btn" style="display:none;" onclick="nextStage()">Proceed</button>
        `;

        updateShieldDisplay();

        const container = document.getElementById("options-container");
        stage.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt.text;
            btn.onclick = () => selectOption(opt, btn);
            container.appendChild(btn);
        });
    }

    function selectOption(opt, btn) {
        const feedbackBox = document.getElementById("feedback-box");
        const allBtns = document.querySelectorAll(".option-btn");

        allBtns.forEach(b => b.disabled = true);

        if (opt.correct) {
            feedbackBox.className = "feedback-box correct";
            feedbackBox.innerHTML = opt.reason;
            document.getElementById("next-btn").innerText = currentStage < gameData.length - 1 ? "Advance to Next Sector" : "Complete Mission";
            document.getElementById("next-btn").style.display = "block";
        } else {
            shieldIntegrity -= 10;
            updateShieldDisplay();
            feedbackBox.className = "feedback-box incorrect";
            feedbackBox.innerHTML = opt.reason + " (-10% Shield Integrity)";

            if (shieldIntegrity <= 0) {
                renderEndGame(false);
            } else {
                setTimeout(() => {
                    allBtns.forEach(b => b.disabled = false);
                }, 800);
            }
        }
        feedbackBox.style.display = "block";
    }

    function updateShieldDisplay() {
        if (shieldIntegrity < 0) shieldIntegrity = 0;
        const bar = document.getElementById("shield-bar");
        const text = document.getElementById("shield-text");
        if (bar && text) {
            text.innerText = `${shieldIntegrity}%`;
            bar.style.width = `${shieldIntegrity}%`;

            if (shieldIntegrity <= 30) {
                bar.style.backgroundColor = "#f56565";
            } else if (shieldIntegrity <= 60) {
                bar.style.backgroundColor = "#ed8936";
            } else {
                bar.style.backgroundColor = "#48bb78";
            }
        }
    }

    function nextStage() {
        currentStage++;
        if (currentStage < gameData.length) {
            loadStage();
        } else {
            renderEndGame(true);
        }
    }

    function renderEndGame(victory) {
        const card = document.getElementById("game-card");
        if (victory) {
            card.innerHTML = `
                <div class="screen-center">
                    <h1 style="color: #48bb78; font-size: 2.2rem; margin-bottom: 12px;">🌟 MISSION ACCOMPLISHED!</h1>
                    <p class="story-text" style="font-size: 1.1rem; margin-bottom: 8px;">
                        You protected Earth with <strong style="color: #4ea8de;">${shieldIntegrity}% Shield Integrity</strong> remaining!
                    </p>
                    <div class="instruction-box" style="margin-top: 16px;">
                        <p style="color: #d1d5db; text-align: center;">
                            You have demonstrated a complete mastery of Earth's protective systems, atmospheric layers, biological processes, and planetary preservation solutions.
                        </p>
                    </div>
                    <button class="action-btn" onclick="renderLogoScreen()">Return to Main Menu</button>
                </div>
            `;
        } else {
            card.innerHTML = `
                <div class="screen-center">
                    <h1 style="color: #f56565; font-size: 2.2rem; margin-bottom: 12px;">⚠️ MISSION FAILED</h1>
                    <p class="story-text" style="font-size: 1.1rem; margin-bottom: 8px;">
                        Shield Integrity reached 0%. Earth's ecosystems suffered critical collapse.
                    </p>
                    <div class="instruction-box" style="margin-top: 16px;">
                        <p style="color: #d1d5db; text-align: center;">
                            Don't give up! Review core concepts on atmosphere, ocean heat circulation, and sustainability to try again.
                        </p>
                    </div>
                    <button class="action-btn restart-btn" onclick="startGame()">Restart Quest</button>
                </div>
            `;
        }
    }

    // Start with Logo Screen
    renderLogoScreen();
</script>

</body>
</html>
