<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 13 CBQ Quiz - Our Home: Earth</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #quiz-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 800px;
            padding: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 1.4rem;
            color: var(--accent-blue);
        }

        .badge {
            background-color: #0284c7;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .question-tag {
            display: inline-block;
            background-color: #334155;
            color: #e2e8f0;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .scenario-box {
            background-color: #0f172a;
            border-left: 4px solid var(--accent-blue);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            font-size: 0.98rem;
            line-height: 1.6;
            color: #cbd5e1;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 18px;
            border-radius: 10px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not([disabled]) {
            border-color: var(--accent-blue);
            background-color: #1e293b;
            transform: translateX(4px);
        }

        .option-btn.correct {
            background-color: rgba(74, 222, 128, 0.15);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .option-btn.wrong {
            background-color: rgba(248, 113, 113, 0.15);
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .explanation-box {
            background-color: #1e293b;
            border: 1px solid var(--accent-blue);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .explanation-title {
            color: var(--accent-blue);
            font-weight: 700;
            margin-bottom: 5px;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background-color: var(--accent-blue);
            color: #0f172a;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
            color: #94a3b8;
        }

        .hidden {
            display: none !important;
        }

        /* Results Screen */
        .results-box {
            text-align: center;
            padding: 20px 0;
        }

        .results-score {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent-blue);
            margin: 15px 0;
        }
    </style>
</head>
<body>

<div id="quiz-container">
    <!-- Quiz Header -->
    <div class="header">
        <h1>CBQ Assessment: Chapter 13</h1>
        <span class="badge" id="progress-badge">Question 1/5</span>
    </div>

    <!-- Active Question View -->
    <div id="question-view">
        <span class="question-tag" id="type-tag">Case-Based Analysis</span>
        
        <div class="scenario-box hidden" id="scenario-box">
            <!-- Case study scenario text goes here -->
        </div>

        <div class="question-text" id="question-text">
            <!-- Question prompt goes here -->
        </div>

        <div class="options-list" id="options-container">
            <!-- Option buttons rendered here -->
        </div>

        <div class="explanation-box hidden" id="explanation-box">
            <div class="explanation-title">Competency Insight:</div>
            <div id="explanation-text"></div>
        </div>

        <div class="footer">
            <span style="color: var(--text-muted); font-size: 0.9rem;" id="score-tracker">Score: 0</span>
            <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>Next Question</button>
        </div>
    </div>

    <!-- Results View -->
    <div id="results-view" class="results-box hidden">
        <h2>Assessment Complete!</h2>
        <p style="color: var(--text-muted); margin-top: 8px;">Your Performance Summary</p>
        <div class="results-score" id="final-score">0 / 5</div>
        <p id="performance-feedback" style="margin-bottom: 25px; line-height: 1.6;"></p>
        <button class="btn" onclick="restartQuiz()">Retake CBQ Assessment</button>
    </div>
</div>

<script>
    // --- Competency-Based Questions Data ---
    const cbqQuestions = [
        {
            type: "Case-Based Scenario",
            scenario: "Astronomers recently discovered an exoplanet orbiting a distant star. The planet has a thick atmosphere rich in Carbon Dioxide (CO2), sits extremely close to its star, and lacks an active liquid core to generate a magnetic shield.",
            question: "Based on your understanding of planetary characteristics in Chapter 13, why is this exoplanet UNLIKELY to support human-like life?",
            options: [
                "It lacks a gravitational field entirely because it is near a star.",
                "It would experience a runaway greenhouse effect and high exposure to solar radiation.",
                "Its atmosphere would freeze into solid dry ice due to the high CO2 content.",
                "It belongs to the outer gas giant category and lacks a solid surface."
            ],
            answer: 1,
            explanation: "Dense CO2 traps extreme thermal heat (similar to Venus's runaway greenhouse effect), and the lack of a magnetic field leaves the surface exposed to high-energy cosmic rays and solar winds."
        },
        {
            type: "Assertion & Reasoning",
            scenario: null,
            question: "Assertion (A): Vegetative propagation in plants produces offspring that are genetically identical to the parent plant.<br><br>Reason (R): Vegetative propagation is a form of asexual reproduction involving only a single parent.",
            options: [
                "Both (A) and (R) are true, and (R) is the correct explanation of (A).",
                "Both (A) and (R) are true, but (R) is NOT the correct explanation of (A).",
                "(A) is true, but (R) is false.",
                "(A) is false, but (R) is true."
            ],
            answer: 0,
            explanation: "Because asexual reproduction involves only one parent without the fusion of male and female gametes, the resulting offspring receive 100% identical DNA from that single parent."
        },
        {
            type: "Ecosystem Application",
            scenario: "An agricultural area experiences severe soil degradation due to excessive synthetic chemical runoff. Farmers notice that earthworms and soil bacteria are dying out, causing crop yields to drop continuously.",
            question: "Which two spheres of Earth are primarily interacting in this environmental problem?",
            options: [
                "Atmosphere and Outer Core",
                "Hydrosphere and Geosphere (impacting the Biosphere)",
                "Magnetosphere and Cryosphere",
                "Lithosphere and Exosphere"
            ],
            answer: 1,
            explanation: "Water run-off (Hydrosphere) carrying chemicals damages the soil nutrients/minerals (Geosphere), which directly leads to the loss of living soil organisms and crops (Biosphere)."
        },
        {
            type: "Comparative Analysis",
            scenario: "Species X reproduces sexually by laying soft eggs directly in water. Species Y reproduces sexually via internal fertilisation, giving birth to live young that are nourished through a placenta.",
            question: "What conclusion can be drawn regarding the adaptation of these organisms?",
            options: [
                "Species X exhibits internal fertilisation suitable for dry desert land.",
                "Species Y requires external water bodies for sperm to swim to the egg.",
                "Species X relies on external fertilisation (e.g., frogs/fish), while Species Y is an adapted mammal.",
                "Species X produces genetically identical clones, while Species Y produces diverse offspring."
            ],
            answer: 2,
            explanation: "Organisms laying unfertilised eggs in water rely on external fertilisation (like amphibians/fish), whereas mammals use internal fertilisation and a placenta for internal nourishment."
        },
        {
            type: "Data & Policy Evaluation",
            scenario: "Global temperature logs show an average rise of 1.1°C over pre-industrial levels, leading to frequent heatwaves, melting glaciers, and rising ocean levels worldwide.",
            question: "Which global environmental initiative was established specifically to limit global warming to well below 2°C?",
            options: [
                "The Wildlife Protection Act (1972)",
                "The Paris Agreement",
                "Project Tiger",
                "The Montreal Protocol (1987)"
            ],
            answer: 1,
            explanation: "The Paris Agreement is a global treaty aimed at limiting global warming to below 2°C (preferably 1.5°C). The Montreal Protocol targeted ozone depletion, and the Wildlife Protection Act is an Indian national conservation law."
        }
    ];

    // --- Engine Logic ---
    let currentIdx = 0;
    let score = 0;
    let selectedOption = null;

    function renderQuestion() {
        const q = cbqQuestions[currentIdx];
        
        // Reset state
        selectedOption = null;
        document.getElementById('next-btn').disabled = true;
        document.getElementById('explanation-box').classList.add('hidden');
        
        // Header updates
        document.getElementById('progress-badge').innerText = `Question ${currentIdx + 1}/${cbqQuestions.length}`;
        document.getElementById('type-tag').innerText = q.type;
        document.getElementById('score-tracker').innerText = `Score: ${score}`;

        // Scenario Box
        const scenarioBox = document.getElementById('scenario-box');
        if (q.scenario) {
            scenarioBox.innerHTML = q.scenario;
            scenarioBox.classList.remove('hidden');
        } else {
            scenarioBox.classList.add('hidden');
        }

        // Question text
        document.getElementById('question-text').innerHTML = q.question;

        // Options
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        q.options.forEach((optText, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span style="font-weight:bold; margin-right: 10px;">${String.fromCharCode(65 + index)}.</span> ${optText}`;
            btn.onclick = () => selectOption(index);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(index) {
        if (selectedOption !== null) return; // Prevent changing answer
        selectedOption = index;

        const q = cbqQuestions[currentIdx];
        const buttons = document.querySelectorAll('.option-btn');

        if (index === q.answer) {
            buttons[index].classList.add('correct');
            score++;
        } else {
            buttons[index].classList.add('wrong');
            buttons[q.answer].classList.add('correct'); // Highlight right answer
        }

        // Disable all option buttons
        buttons.forEach(btn => btn.disabled = true);

        // Show Explanation
        document.getElementById('explanation-text').innerText = q.explanation;
        document.getElementById('explanation-box').classList.remove('hidden');

        // Enable Next
        document.getElementById('score-tracker').innerText = `Score: ${score}`;
        document.getElementById('next-btn').disabled = false;
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < cbqQuestions.length) {
            renderQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('question-view').classList.add('hidden');
        document.getElementById('results-view').classList.remove('hidden');
        
        document.getElementById('final-score').innerText = `${score} / ${cbqQuestions.length}`;
        
        const feedback = document.getElementById('performance-feedback');
        const percentage = (score / cbqQuestions.length) * 100;

        if (percentage === 100) {
            feedback.innerHTML = "<strong style='color: var(--accent-green)'>Exemplary Performance!</strong><br>You have demonstrated high analytical mastery over Chapter 13 concepts!";
        } else if (percentage >= 60) {
            feedback.innerHTML = "<strong style='color: var(--accent-blue)'>Good Competency Level!</strong><br>You understand key concepts well, but re-reviewing assertion-reasoning questions will boost precision.";
        } else {
            feedback.innerHTML = "<strong style='color: var(--accent-red)'>Needs Conceptual Practice!</strong><br>Consider re-reading Chapter 13 topics like reproduction modes, Earth spheres, and global environmental crises.";
        }
    }

    function restartQuiz() {
        currentIdx = 0;
        score = 0;
        document.getElementById('results-view').classList.add('hidden');
        document.getElementById('question-view').classList.remove('hidden');
        renderQuestion();
    }

    // Initialize Quiz
    renderQuestion();
</script>

</body>
</html>
