<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Planetary Command Grid: Deflector Core</title>
<style>
:root {
    --bg-deep-space: #060b13;
    --panel-border: #1e293b;
    --neon-blue: #00f2fe;
    --neon-cyan: #4facfe;
    --neon-green: #39ff14;
    --neon-red: #ff3131;
    --neon-orange: #ff9900;
    --text-glow: 0 0 8px rgba(0, 242, 254, 0.6);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Courier New', Courier, monospace, system-ui, sans-serif;
}

body {
    background-color: var(--bg-deep-space);
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    user-select: none;
    overflow: hidden;
    position: relative;
}

/* 5-Second Pure White Innovine Splash Screen Override Overlay */
#splash-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #ffffff;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 1;
    transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: all;
}

#splash-overlay img {
    max-width: 280px;
    height: auto;
    object-fit: contain;
    animation: splashPulse 2.5s ease-in-out infinite;
}

@keyframes splashPulse {
    0% { transform: scale(0.96); opacity: 0.85; }
    50% { transform: scale(1.02); opacity: 1; }
    100% { transform: scale(0.96); opacity: 0.85; }
}

body::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    z-index: -1;
    background-image: 
        radial-gradient(circle at 20% 30%, rgba(79, 172, 254, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(255, 49, 49, 0.05) 0%, transparent 40%),
        radial-gradient(1px 1px at 25px 40px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 75px 120px, #fff, transparent);
    background-size: 100% 100%, 100% 100%, 300px 300px, 400px 400px;
    animation: spaceOrbit 180s linear infinite;
}

@keyframes spaceOrbit {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

#game-container {
    width: 100%;
    max-width: 900px;
    background: linear-gradient(145deg, #0d1527, #13223f);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 242, 254, 0.15);
    border: 2px solid var(--panel-border);
    display: flex;
    flex-direction: column;
    gap: 24px;
    position: relative;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #1e293b;
    padding-bottom: 16px;
}
.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 1.4rem;
    font-weight: 900;
    color: var(--neon-blue);
    text-shadow: var(--text-glow);
    text-transform: uppercase;
    letter-spacing: 1px;
}
.brand svg {
    width: 32px;
    height: 32px;
    filter: drop-shadow(var(--text-glow));
}
.status-indicators {
    display: flex;
    gap: 16px;
}
.hud-pill {
    font-size: 0.75rem;
    font-weight: bold;
    padding: 8px 16px;
    border-radius: 6px;
    background: #090f1d;
    border: 1px solid #334155;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.hud-pill span {
    color: var(--neon-blue);
    font-weight: 900;
}
#shield-hud { border-color: rgba(255, 153, 0, 0.4); }
#shield-hud span { color: var(--neon-orange); }

.atmosphere-viewport {
    height: 280px;
    background: radial-gradient(circle at center, #0b1931 0%, #040914 100%);
    border: 2px solid #243b6b;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.atmosphere-viewport::before {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
    z-index: 10;
    background-size: 100% 4px;
    pointer-events: none;
}

.descending-anomaly {
    position: absolute;
    width: 82%;
    max-width: 650px;
    background: rgba(13, 27, 56, 0.9);
    border: 1px solid var(--neon-cyan);
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    font-size: 1.1rem;
    font-weight: bold;
    line-height: 1.5;
    box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
    animation: tacticalDescend 10s linear infinite;
    transform-origin: top center;
    color: #f0fdfa;
    backdrop-filter: blur(4px);
    z-index: 5;
}

@keyframes tacticalDescend {
    0% { transform: translateY(-110px); opacity: 0; }
    10% { opacity: 1; }
    85% { opacity: 1; border-color: var(--neon-cyan); box-shadow: 0 0 20px rgba(0, 242, 254, 0.2); }
    92% { border-color: var(--neon-red); box-shadow: 0 0 25px var(--neon-red); }
    100% { transform: translateY(130px); opacity: 0; }
}

.defense-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.panel-title {
    font-size: 0.75rem;
    text-transform: uppercase;
    font-weight: bold;
    color: #64748b;
    letter-spacing: 1.5px;
    text-align: center;
}
.interceptor-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}
.interceptor-node {
    background: linear-gradient(180deg, #14223c 0%, #0b1526 100%);
    border: 2px solid #334155;
    padding: 22px 25px;
    border-radius: 10px;
    font-size: 1.1rem;
    font-weight: 900;
    color: #94a3b8;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    position: relative;
}

.interceptor-node::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 3px;
    background: #334155;
}

.interceptor-node:hover {
    color: #fff;
    background: linear-gradient(180deg, #1a2f54 0%, #0e1d36 100%);
    transform: translateY(-2px);
}

.interceptor-node.primed-correct { border-color: var(--neon-blue); }
.interceptor-node.primed-correct::before { background: var(--neon-blue); }
.interceptor-node.primed-correct:hover { box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }

.interceptor-node.primed-wrong { border-color: #334155; }

.grid-terminal-light {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #1e293b;
    transition: all 0.3s ease;
}

.sub-title-indicator {
    font-size: 0.7rem;
    color: #475569;
}

.safety-logger {
    background: #040811;
    border-left: 4px solid #334155;
    border-radius: 4px;
    padding: 16px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 0.85rem;
    color: #38bdf8;
    text-shadow: 0 0 4px rgba(56, 189, 248, 0.4);
    border-top: 1px solid #1e293b;
    border-bottom: 1px solid #1e293b;
}

.discharge-beam {
    position: absolute;
    bottom: 0;
    width: 12px;
    background: linear-gradient(to right, #ffffff, var(--neon-blue), #ffffff);
    box-shadow: 0 0 30px 10px rgba(0, 242, 254, 0.9);
    display: none;
    z-index: 8;
}
#left-discharger { left: 25%; }
#right-discharger { left: 75%; }

#finish-screen {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, #0c182d 0%, #040812 100%);
    border-radius: 20px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    z-index: 50;
    gap: 24px;
}
#finish-screen h2 { 
    color: var(--neon-green); 
    font-size: 2.2rem; 
    text-shadow: 0 0 15px rgba(57, 255, 20, 0.5);
    text-transform: uppercase;
}
.reboot-btn {
    background: linear-gradient(135deg, #00f2fe, #4facfe);
    color: #040812;
    border: 0;
    padding: 16px 45px;
    font-weight: 900;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    text-transform: uppercase;
    box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
}
</style>
</head>
<body>

<div id="splash-overlay">
  <img src="assets/logo.png" alt="Innovine" />
</div>

<div id="game-container">
  <div class="header">
    <div class="brand">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 22h20L12 2zm0 14h.01M12 10v4" stroke="var(--neon-blue)" stroke-width="2" stroke-linejoin="round" fill="none"/>
      </svg>
      Command Grid Core
    </div>
    <div class="status-indicators">
      <div class="hud-pill" id="progress-hud">Matrix Index: <span id="lbl-question">1</span>/10</div>
      <div class="hud-pill" id="shield-hud">Shield Arrays: <span id="lbl-chances">2</span></div>
    </div>
  </div>

  <div class="atmosphere-viewport" id="viewport-area">
    <div id="left-discharger" class="discharge-beam"></div>
    <div id="right-discharger" class="discharge-beam"></div>
    <div class="descending-anomaly" id="anomaly-display">Initializing core components...</div>
  </div>

  <div class="defense-panel" id="controls-area">
    <div class="panel-title">Direct Localized Deflector Impulse Output:</div>
    <div class="interceptor-grid">
      <button class="interceptor-node" id="btn-left" onclick="deployPulse(0)">
        <span class="grid-terminal-light" id="light-left"></span>
        <span id="text-left">ARRAY ALPHA</span>
        <span class="sub-title-indicator" id="sub-left">MODULE // 01</span>
      </button>
      <button class="interceptor-node" id="btn-right" onclick="deployPulse(1)">
        <span class="grid-terminal-light" id="light-right"></span>
        <span id="text-right">ARRAY BETA</span>
        <span class="sub-title-indicator" id="sub-right">MODULE // 02</span>
      </button>
    </div>
  </div>

  <div class="safety-logger" id="feedback-box">
    SYSTEM ACTIVE // Identify incoming hazard parameters.
  </div>

  <div id="finish-screen">
    <h2>⚡ GRID DEFLECTION SECURED ⚡</h2>
    <p style="color: #94a3b8; font-size: 1.05rem; max-width: 600px; line-height: 1.7;">
      Atmospheric sectors stabilized. Core telemetry integrated perfectly.
    </p>
    <button class="reboot-btn" onclick="location.reload()">Recharge Core</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let currentQuestion = 0;
let attemptsLeft = 2;
let blockControls = false;

const database = [
    { q: "Any sudden vibration or movement of a part of the Earth's crust caused by natural or man-made forces is an:", answer: "Earthquake", wrong: "Lightning" },
    { q: "The specific deep underground physical waves produced through the bedrock during a sudden earthquake are:", answer: "Seismic waves", wrong: "Anions" },
    { q: "A highly sensitive mechanical laboratory instrument used to explicitly measure and record seismic waves is a:", answer: "Seismograph", wrong: "Electroscope" },
    { q: "A form of electricity comprised of accumulated surface electrical charges that remain completely stationary and do not flow is:", answer: "Static electricity", wrong: "Seismic waves" },
    { q: "A specialized physical laboratory device constructed of conducting materials used for detecting and testing the presence of electric charge on a body is an:", answer: "Electroscope", wrong: "Seismograph" },
    { q: "Highly active particles or groups of atoms that carry net positive or negative electrical charges due to electron imbalance are:", answer: "Ions", wrong: "Asteroids" },
    { q: "A specific structural molecular ion configuration that carries a net positive charge is a:", answer: "Cation", wrong: "Anion" },
    { q: "A specific electrical ion configuration that carries a net negative charge is an:", answer: "Anion", wrong: "Cation" },
    { q: "Small rocky or metallic objects occupying space that form a distinct belt primarily between the planetary tracks of Mars and Jupiter are:", answer: "Asteroids", wrong: "Constellations" },
    { q: "Identifiable groups of stars that form a particular configuration, shape, or recognizable pattern in the open night sky are:", answer: "Constellations", wrong: "Asteroids" }
];

let leftSideIsTrue = false;

function initGameFramework() {
    // Exactly 5000 milliseconds (5 seconds) of White Screen branding lock frame
    setTimeout(() => {
        const splash = $('splash-overlay');
        if (splash) {
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
            }, 800);
        }
    }, 5000);

    loadQuestion();
}

function loadQuestion() {
    if (currentQuestion >= database.length) {
        $('viewport-area').style.display = 'none';
        $('controls-area').style.display = 'none';
        $('feedback-box').style.display = 'none';
        $('finish-screen').style.display = 'flex';
        return;
    }

    attemptsLeft = 2;
    blockControls = false;
    
    $('lbl-question').innerText = currentQuestion + 1;
    $('lbl-chances').innerText = attemptsLeft;
    
    $('feedback-box').innerText = "// SCAN FEED ACTIVE: Select the true matching data matrix module.";
    $('feedback-box').style.color = "#38bdf8";
    $('feedback-box').style.borderLeftColor = "#0284c7";

    let data = database[currentQuestion];
    
    let anomalyNode = $('anomaly-display');
    anomalyNode.innerText = data.q;
    anomalyNode.style.animation = 'none';
    anomalyNode.offsetHeight; 
    anomalyNode.style.animation = 'tacticalDescend 10s linear infinite';
    anomalyNode.style.animationPlayState = 'running';

    $('btn-left').className = "interceptor-node";
    $('btn-right').className = "interceptor-node";

    leftSideIsTrue = Math.random() > 0.5;
    if (leftSideIsTrue) {
        $('text-left').innerText = data.answer;
        $('text-right').innerText = data.wrong;
        
        $('btn-left').classList.add('primed-correct');
        $('btn-right').classList.add('primed-wrong');
        
        // Correct side button strictly receives the blue neon indicator dot illumination
        $('light-left').style.backgroundColor = "var(--neon-blue)";
        $('light-left').style.boxShadow = "0 0 10px var(--neon-blue)";
        $('light-right').style.backgroundColor = "#1e293b";
        $('light-right').style.boxShadow = "none";
    } else {
        $('text-left').innerText = data.wrong;
        $('text-right').innerText = data.answer;
        
        $('btn-left').classList.add('primed-wrong');
        $('btn-right').classList.add('primed-correct');
        
        // Correct side button strictly receives the blue neon indicator dot illumination
        $('light-left').style.backgroundColor = "#1e293b";
        $('light-left').style.boxShadow = "none";
        $('light-right').style.backgroundColor = "var(--neon-blue)";
        $('light-right').style.boxShadow = "0 0 10px var(--neon-blue)";
    }
}

function deployPulse(chosenSide) {
    if (blockControls) return;
    
    let data = database[currentQuestion];
    let isCorrect = (chosenSide === 0 && leftSideIsTrue) || (chosenSide === 1 && !leftSideIsTrue);
    let dischargerID = chosenSide === 0 ? 'left-discharger' : 'right-discharger';

    let beam = $(dischargerID);
    beam.style.display = 'block';
    beam.style.height = '100%';
    if(!isCorrect) {
        beam.style.background = "linear-gradient(to right, #ffffff, var(--neon-red), #ffffff)";
        beam.style.boxShadow = "0 0 30px 10px var(--neon-red)";
    } else {
        beam.style.background = "linear-gradient(to right, #ffffff, var(--neon-blue), #ffffff)";
        beam.style.boxShadow = "0 0 30px 10px var(--neon-blue)";
    }
    
    setTimeout(() => {
        beam.style.display = 'none';
        beam.style.height = '0px';
    }, 200);

    if (isCorrect) {
        blockControls = true;
        $('anomaly-display').style.animationPlayState = 'paused';

        $('feedback-box').innerText = `✓ VECTOR ALIGNED: "${data.answer.toUpperCase()}" locked into core parameters.`;
        $('feedback-box').style.color = "var(--neon-green)";
        $('feedback-box').style.borderLeftColor = "var(--neon-green)";

        setTimeout(() => {
            currentQuestion++;
            loadQuestion();
        }, 1500);

    } else {
        attemptsLeft--;
        $('lbl-chances').innerText = attemptsLeft;

        if (attemptsLeft > 0) {
            $('feedback-box').innerText = "✕ IMPULSE MISALIGNMENT: Deflection failure. Shield capacity running low.";
            $('feedback-box').style.color = "var(--neon-orange)";
            $('feedback-box').style.borderLeftColor = "var(--neon-orange)";
        } else {
            blockControls = true;
            $('anomaly-display').style.animationPlayState = 'paused';

            $('feedback-box').innerText = `⚠️ CORE PATCH INJECTED: System override active. Solution profile: "${data.answer.toUpperCase()}".`;
            $('feedback-box').style.color = "var(--neon-red)";
            $('feedback-box').style.borderLeftColor = "var(--neon-red)";

            setTimeout(() => {
                currentQuestion++;
                loadQuestion();
            }, 3000);
        }
    }
}

window.onload = initGameFramework;
</script>
</body>
</html>
