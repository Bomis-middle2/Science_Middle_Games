<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuit Runner: Conductor Rush</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #162447;
            border: 4px solid #0f3460;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* --- SCREEN 1: SPLASH SCREEN --- */
        #splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff; /* Clean white background for the logo */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        #logo-img {
            max-width: 350px;
            max-height: 200px;
            object-fit: contain;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.02); }
            100% { transform: scale(0.95); }
        }

        /* --- SCREEN 2: MAIN MENU --- */
        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1f4068 0%, #162447 100%);
            z-index: 50;
            display: none; /* Controlled by JS */
        }

        h1 {
            font-size: 3rem;
            color: #e43f5a;
            text-shadow: 0 0 10px rgba(228,63,90,0.6);
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #00fff0;
            margin-bottom: 40px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            background-color: #e43f5a;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(228,63,90,0.4);
        }

        .btn:hover {
            background-color: #ff4d6d;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(228,63,90,0.6);
        }

        /* --- SCREEN 3: ACTUAL GAMEPLAY --- */
        #gameplay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        /* HUD Overlay */
        #hud {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
        }

        .hud-item {
            background: rgba(15, 52, 96, 0.85);
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid #00fff0;
        }

        #target-box {
            color: #ffea00;
            border-color: #ffea00;
        }

        canvas {
            display: block;
            background: #121214;
        }

        /* --- SCREEN 4: GAME OVER / WIN --- */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 26, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 60;
            display: none;
        }

        #game-over-title {
            font-size: 3.5rem;
            margin-bottom: 20px;
        }

        #game-over-msg {
            font-size: 1.2rem;
            margin-bottom: 30px;
            max-width: 500px;
            text-align: center;
            color: #ccc;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="game-container">
        
        <div id="splash-screen">
            <img id="logo-img" src="image_cc8df7.png" alt="Innovine Logo">
        </div>

        <div id="menu-screen">
            <h1>CIRCUIT RUNNER</h1>
            <p class="subtitle">Fundamentals of Electricity & Circuits</p>
            <button class="btn" id="start-btn">START GAME</button>
        </div>

        <div id="gameplay-screen">
            <div id="hud">
                <div class="hud-item" id="score-box">Score: 0 / 10</div>
                <div class="hud-item" id="target-box">Collect: CONDUCTORS!</div>
                <div class="hud-item" id="lives-box">🔋 Lives: 3</div>
            </div>
            <canvas id="gameCanvas" width="800" height="600"></canvas>
        </div>

        <div id="game-over-screen">
            <h2 id="game-over-title">Game Over</h2>
            <p id="game-over-msg">Your circuit broke down!</p>
            <button class="btn" id="restart-btn">Play Again</button>
        </div>

    </div>

    <script>
        // DOM Elements
        const splashScreen = document.getElementById('splash-screen');
        const menuScreen = document.getElementById('menu-screen');
        const gameplayScreen = document.getElementById('gameplay-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        
        const scoreBox = document.getElementById('score-box');
        const livesBox = document.getElementById('lives-box');
        const gameOverTitle = document.getElementById('game-over-title');
        const gameOverMsg = document.getElementById('game-over-msg');
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game State Variables
        let score = 0;
        let lives = 3;
        let gameActive = false;
        let items = [];
        let player = { x: 360, y: 500, width: 80, height: 40, speed: 8 };
        let keys = {};
        let spawnTimer = 0;
        const winningScore = 10;

        // Educational Database from Chapter 8
        const pool = [
            { name: "Copper Wire", type: "conductor", color: "#b87333" },
            { name: "Iron Nail", type: "conductor", color: "#aaa9ad" },
            { name: "Aluminum Foil", type: "conductor", color: "#ddd" },
            { name: "Coin", type: "conductor", color: "#ffd700" },
            { name: "Plastic Ruler", type: "insulator", color: "#e63946" },
            { name: "Rubber Eraser", type: "insulator", color: "#ffb703" },
            { name: "Glass Strip", type: "insulator", color: "#a8dadc" },
            { name: "Wooden Stick", type: "insulator", color: "#9c6644" }
        ];

        // --- TIMERS & SCENE TRANSITIONS ---
        // Exactly 5 Seconds Splash Screen hold
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                splashScreen.style.opacity = '0';
                setTimeout(() => {
                    splashScreen.style.display = 'none';
                    menuScreen.style.display = 'flex';
                }, 500); // Wait for fade transition
            }, 5000); // 5000ms = 5 Seconds
        });

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Input listeners
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // --- GAME LOGIC ---
        function startGame() {
            menuScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            gameplayScreen.style.display = 'block';
            
            score = 0;
            lives = 3;
            items = [];
            player.x = canvas.width / 2 - player.width / 2;
            gameActive = true;
            
            updateHUD();
            requestAnimationFrame(gameLoop);
        }

        function updateHUD() {
            scoreBox.innerText = `Score: ${score} / ${winningScore}`;
            livesBox.innerText = `🔋 Lives: ${"⚡".repeat(lives)}`;
        }

        function spawnItem() {
            const template = pool[Math.floor(Math.random() * pool.length)];
            items.push({
                x: Math.random() * (canvas.width - 120) + 20,
                y: -30,
                width: 110,
                height: 35,
                name: template.name,
                type: template.type,
                color: template.color,
                speed: Math.random() * 2 + 2.5
            });
        }

        function gameLoop() {
            if (!gameActive) return;

            // Clear Screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background Circuit Lines for Sci-Fi vibe
            ctx.strokeStyle = '#1f4068';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(100, 0); ctx.lineTo(100, canvas.height);
            ctx.moveTo(700, 0); ctx.lineTo(700, canvas.height);
            ctx.stroke();

            // Handle Player Movement
            if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 0) {
                player.x -= player.speed;
            }
            if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            // Draw Terminal/Tester Player (Looks like an Open Circuit clip)
            ctx.fillStyle = score >= 7 ? '#00fff0' : '#ffea00';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Draw Contact Points
            ctx.fillStyle = '#fff';
            ctx.fillRect(player.x, player.y - 4, 10, 6);
            ctx.fillRect(player.x + player.width - 10, player.y - 4, 10, 6);
            
            ctx.fillStyle = '#0f3460';
            ctx.font = '12px sans-serif';
            ctx.fillText("TESTER", player.x + 18, player.y + 24);

            // Spawning Logic
            spawnTimer++;
            if (spawnTimer % 90 === 0) {
                spawnItem();
            }

            // Update & Draw Dropping Items
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;

                // Draw Item card
                ctx.fillStyle = item.color;
                ctx.fillRect(item.x, item.y, item.width, item.height);
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#fff';
                ctx.strokeRect(item.x, item.y, item.width, item.height);

                // Draw Item Text Label
                ctx.fillStyle = '#000';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(item.name, item.x + item.width/2, item.y + 22);
                ctx.textAlign = 'left'; // Reset

                // Collision Detection with Player Tester
                if (item.x < player.x + player.width &&
                    item.x + item.width > player.x &&
                    item.y < player.y + player.height &&
                    item.y + item.height > player.y) {
                    
                    // Interaction evaluations
                    if (item.type === 'conductor') {
                        score++;
                        if (score >= winningScore) {
                            endGame(true);
                            return;
                        }
                    } else {
                        // Caught an Insulator! Circuit breaks.
                        lives--;
                        if (lives <= 0) {
                            endGame(false);
                            return;
                        }
                    }
                    updateHUD();
                    items.splice(i, 1);
                    continue;
                }

                // Remove out-of-bounds items
                if (item.y > canvas.height) {
                    items.splice(i, 1);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function endGame(isWin) {
            gameActive = false;
            gameplayScreen.style.display = 'none';
            gameOverScreen.style.display = 'flex';

            if (isWin) {
                gameOverTitle.innerText = "💡 CIRCUIT COMPLETE!";
                gameOverTitle.style.color = "#00fff0";
                gameOverMsg.innerHTML = "Fantastic! You collected all the necessary <b>Conductors</b> to allow electric current to flow through the circuit. The bulb is glowing brightly!";
            } else {
                gameOverTitle.innerText = "💥 CIRCUIT BROKEN!";
                gameOverTitle.style.color = "#e43f5a";
                gameOverMsg.innerHTML = "Oops! You introduced too many <b>Insulators</b> (materials that do not allow electric current to flow). The flow of electrons stopped.";
            }
        }
    </script>
</body>
</html>
