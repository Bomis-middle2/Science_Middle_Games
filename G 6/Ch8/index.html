<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuit Runner: Symbols & Materials</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #162447;
            border: 4px solid #0f3460;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* --- SCREEN 1: SPLASH SCREEN --- */
        #splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        #logo-img {
            max-width: 350px;
            max-height: 200px;
            object-fit: contain;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.02); }
            100% { transform: scale(0.95); }
        }

        /* --- SCREEN 2: MAIN MENU --- */
        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1f4068 0%, #162447 100%);
            z-index: 50;
            display: none;
        }

        h1 {
            font-size: 3rem;
            color: #e43f5a;
            text-shadow: 0 0 10px rgba(228,63,90,0.6);
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #00fff0;
            margin-bottom: 40px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            background-color: #e43f5a;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(228,63,90,0.4);
        }

        .btn:hover {
            background-color: #ff4d6d;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(228,63,90,0.6);
        }

        /* --- SCREEN 3: ACTUAL GAMEPLAY --- */
        #gameplay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        #hud {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
        }

        .hud-item {
            background: rgba(15, 52, 96, 0.9);
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid #00fff0;
        }

        #target-box {
            color: #ffea00;
            border-color: #ffea00;
            max-width: 320px;
            text-align: center;
        }

        #level-box {
            color: #ff4d6d;
            border-color: #ff4d6d;
        }

        canvas {
            display: block;
            background: #121214;
        }

        /* --- SCREEN 4: GAME OVER / WIN --- */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 26, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 60;
            display: none;
        }

        #game-over-title {
            font-size: 3.2rem;
            margin-bottom: 20px;
            text-align: center;
        }

        #game-over-msg {
            font-size: 1.2rem;
            margin-bottom: 30px;
            max-width: 550px;
            text-align: center;
            color: #ccc;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="game-container">
        
        <div id="splash-screen">
            <img id="logo-img" src="image_cc8df7.png" alt="Innovine Logo">
        </div>

        <div id="menu-screen">
            <h1>CIRCUIT RUNNER</h1>
            <p class="subtitle">Electricity, Circuits & Symbols</p>
            <button class="btn" id="start-btn">START GAME</button>
        </div>

        <div id="gameplay-screen">
            <div id="hud">
                <div class="hud-item" id="level-box">Level: 1</div>
                <div class="hud-item" id="score-box">Score: 0 / 5</div>
                <div class="hud-item" id="target-box">Collect: CONDUCTORS!</div>
                <div class="hud-item" id="lives-box">⚡ Lives: 3</div>
            </div>
            <canvas id="gameCanvas" width="800" height="600"></canvas>
        </div>

        <div id="game-over-screen">
            <h2 id="game-over-title">Game Over</h2>
            <p id="game-over-msg">Your circuit broke down!</p>
            <button class="btn" id="restart-btn">Play Again</button>
        </div>

    </div>

    <script>
        const splashScreen = document.getElementById('splash-screen');
        const menuScreen = document.getElementById('menu-screen');
        const gameplayScreen = document.getElementById('gameplay-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        
        const levelBox = document.getElementById('level-box');
        const scoreBox = document.getElementById('score-box');
        const targetBox = document.getElementById('target-box');
        const livesBox = document.getElementById('lives-box');
        const gameOverTitle = document.getElementById('game-over-title');
        const gameOverMsg = document.getElementById('game-over-msg');
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game State Variables
        let currentLevel = 1;
        let score = 0;
        let lives = 3;
        let gameActive = false;
        let items = [];
        let player = { x: 360, y: 510, width: 90, height: 40, speed: 9 };
        let keys = {};
        let spawnTimer = 0;
        const targetScorePerLevel = 5;

        // Level 1 Pool: Materials
        const level1Pool = [
            { name: "Copper Wire", matchesTarget: true, info: "conductor", color: "#b87333" },
            { name: "Iron Nail", matchesTarget: true, info: "conductor", color: "#aaa9ad" },
            { name: "Aluminum Foil", matchesTarget: true, info: "conductor", color: "#ddd" },
            { name: "Plastic Ruler", matchesTarget: false, info: "insulator", color: "#e63946" },
            { name: "Rubber Eraser", matchesTarget: false, info: "insulator", color: "#ffb703" },
            { name: "Wooden Stick", matchesTarget: false, info: "insulator", color: "#9c6644" }
        ];

        // Level 2 Pool: Circuit Schematic Diagrams Vector Drawing Lookups
        const level2Pool = [
            { name: "Cell", matchesTarget: true, symbolType: "cell", color: "#4cc9f0" },
            { name: "Battery", matchesTarget: true, symbolType: "battery", color: "#4cc9f0" },
            { name: "Electric Bulb", matchesTarget: false, symbolType: "bulb", color: "#f72585" },
            { name: "Switch (ON)", matchesTarget: false, symbolType: "switch_on", color: "#f72585" },
            { name: "Switch (OFF)", matchesTarget: false, symbolType: "switch_off", color: "#f72585" },
            { name: "Wire Line", matchesTarget: false, symbolType: "wire", color: "#f72585" }
        ];

        // --- TIMERS & SCENE TRANSITIONS ---
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                splashScreen.style.opacity = '0';
                setTimeout(() => {
                    splashScreen.style.display = 'none';
                    menuScreen.style.display = 'flex';
                }, 500);
            }, 5000); // 5 Seconds Splash Screen hold
        });

        startBtn.addEventListener('click', () => startNewGame(1));
        restartBtn.addEventListener('click', () => startNewGame(1));

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function startNewGame(lvl) {
            menuScreen.style.none = 'none';
            gameOverScreen.style.display = 'none';
            gameplayScreen.style.display = 'block';
            
            currentLevel = lvl;
            score = 0;
            if(lvl === 1) lives = 3; 
            items = [];
            player.x = canvas.width / 2 - player.width / 2;
            gameActive = true;
            
            updateHUD();
            requestAnimationFrame(gameLoop);
        }

        function updateHUD() {
            levelBox.innerText = `Level: ${currentLevel}`;
            scoreBox.innerText = `Score: ${score} / ${targetScorePerLevel}`;
            livesBox.innerText = `⚡ Lives: ${"❤️".repeat(lives)}`;
            
            if (currentLevel === 1) {
                targetBox.innerText = "Collect: CONDUCTORS!";
                targetBox.style.borderColor = "#ffea00";
                targetBox.style.color = "#ffea00";
            } else {
                targetBox.innerText = "Target: ELECTRICAL SOURCES! (Cells/Batteries)";
                targetBox.style.borderColor = "#00fff0";
                targetBox.style.color = "#00fff0";
            }
        }

        // Custom Vector drawings for Component Symbols
        function drawCircuitSymbol(ctx, type, x, y, w, h) {
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            
            let cx = x + w / 2;
            let cy = y + h / 2;

            if (type === "cell") {
                // Long thin line (positive), short thick line (negative)
                ctx.moveTo(cx - 15, cy); ctx.lineTo(cx - 5, cy);
                ctx.moveTo(cx - 5, cy - 15); ctx.lineTo(cx - 5, cy + 15); // Long
                
                ctx.lineWidth = 5;
                ctx.moveTo(cx + 5, cy - 8); ctx.lineTo(cx + 5, cy + 8); // Short/Thick
                ctx.lineWidth = 3;
                ctx.moveTo(cx + 5, cy); ctx.lineTo(cx + 15, cy);
            } 
            else if (type === "battery") {
                // Multiple cells joined
                ctx.moveTo(cx - 25, cy); ctx.lineTo(cx - 15, cy);
                ctx.moveTo(cx - 15, cy - 15); ctx.lineTo(cx - 15, cy + 15);
                ctx.lineWidth = 5;
                ctx.moveTo(cx - 7, cy - 8); ctx.lineTo(cx - 7, cy + 8);
                ctx.lineWidth = 1; ctx.setLineDash([2, 2]); // Dashed line connecting
                ctx.moveTo(cx - 7, cy); ctx.lineTo(cx + 7, cy);
                ctx.stroke();
                ctx.setLineDash([]); // Reset
                ctx.lineWidth = 3;
                ctx.moveTo(cx + 7, cy - 15); ctx.lineTo(cx + 7, cy + 15);
                ctx.lineWidth = 5;
                ctx.moveTo(cx + 15, cy - 8); ctx.lineTo(cx + 15, cy + 8);
                ctx.lineWidth = 3;
                ctx.moveTo(cx + 15, cy); ctx.lineTo(cx + 25, cy);
            } 
            else if (type === "bulb") {
                // Circle with a filament loop inside
                ctx.arc(cx, cy, 12, 0, Math.PI * 2);
                ctx.moveTo(cx - 20, cy); ctx.lineTo(cx - 12, cy);
                ctx.moveTo(cx + 12, cy); ctx.lineTo(cx + 20, cy);
                // Filament M shape
                ctx.moveTo(cx - 6, cy + 4);
                ctx.lineTo(cx - 3, cy - 4);
                ctx.lineTo(cx, cy + 2);
                ctx.lineTo(cx + 3, cy - 4);
                ctx.lineTo(cx + 6, cy + 4);
            } 
            else if (type === "switch_on") {
                // Terminals linked flat down
                ctx.arc(cx - 15, cy, 3, 0, Math.PI * 2, true);
                ctx.arc(cx + 15, cy, 3, 0, Math.PI * 2, true);
                ctx.moveTo(cx - 12, cy); ctx.lineTo(cx + 12, cy);
                ctx.moveTo(cx - 25, cy); ctx.lineTo(cx - 15, cy);
                ctx.moveTo(cx + 15, cy); ctx.lineTo(cx + 25, cy);
            } 
            else if (type === "switch_off") {
                // Arm pointing up, open gap
                ctx.arc(cx - 15, cy, 3, 0, Math.PI * 2, true);
                ctx.arc(cx + 15, cy, 3, 0, Math.PI * 2, true);
                ctx.moveTo(cx - 13, cy); ctx.lineTo(cx + 5, cy - 12); // Tilted open arm
                ctx.moveTo(cx - 25, cy); ctx.lineTo(cx - 15, cy);
                ctx.moveTo(cx + 15, cy); ctx.lineTo(cx + 25, cy);
            }
            else if (type === "wire") {
                ctx.moveTo(cx - 25, cy); ctx.lineTo(cx + 25, cy);
            }
            ctx.stroke();
        }

        function spawnItem() {
            const pool = (currentLevel === 1) ? level1Pool : level2Pool;
            const template = pool[Math.floor(Math.random() * pool.length)];
            
            items.push({
                x: Math.random() * (canvas.width - 140) + 20,
                y: -50,
                width: 130,
                height: currentLevel === 1 ? 40 : 75, // Extra space vertically for level 2 symbol rendering
                name: template.name,
                matchesTarget: template.matchesTarget,
                symbolType: template.symbolType || null,
                color: template.color,
                speed: Math.random() * 1.5 + (currentLevel === 1 ? 2.5 : 3.0)
            });
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Tech grid aesthetics lines
            ctx.strokeStyle = '#1f4068';
            ctx.lineWidth = 1;
            for(let g = 100; g < canvas.width; g += 200) {
                ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g, canvas.height); ctx.stroke();
            }

            // Player Receiver Box Controls
            if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 0) player.x -= player.speed;
            if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - player.width) player.x += player.speed;

            // Render Player Tester Basket
            ctx.fillStyle = currentLevel === 1 ? '#ffea00' : '#00fff0';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.strokeStyle = '#fff';
            ctx.strokeRect(player.x, player.y, player.width, player.height);
            
            ctx.fillStyle = '#0f3460';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText(currentLevel === 1 ? "⚠️ TESTER" : "🔋 TERMINAL", player.x + 10, player.y + 24);

            // Spawn cycle
            spawnTimer++;
            if (spawnTimer % 85 === 0) spawnItem();

            // Handle falling drop nodes
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;

                // Background box wrapper element
                ctx.fillStyle = item.color;
                ctx.fillRect(item.x, item.y, item.width, item.height);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(item.x, item.y, item.width, item.height);

                if (currentLevel === 1) {
                    // Level 1: Just Display text block labels
                    ctx.fillStyle = '#000000';
                    ctx.font = 'bold 13px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(item.name, item.x + item.width / 2, item.y + 24);
                } else {
                    // Level 2: Render schematic symbols + Text name at the bottom corner edge
                    drawCircuitSymbol(ctx, item.symbolType, item.x, item.y, item.width, item.height - 20);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(item.x + 2, item.y + item.height - 20, item.width - 4, 18);
                    
                    ctx.fillStyle = '#000000';
                    ctx.font = 'bold 11px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(item.name, item.x + item.width / 2, item.y + item.height - 6);
                }
                ctx.textAlign = 'left'; // Reset alignment formatters

                // Detect overlaps bounding box
                if (item.x < player.x + player.width &&
                    item.x + item.width > player.x &&
                    item.y < player.y + player.height &&
                    item.y + item.height > player.y) {
                    
                    if (item.matchesTarget) {
                        score++;
                        if (score >= targetScorePerLevel) {
                            if (currentLevel === 1) {
                                // Level up transition configuration 
                                score = 0;
                                currentLevel = 2;
                                items = [];
                                updateHUD();
                                alert("Level 1 Clear! Proceeding to Level 2: Circuit Diagrams & Symbols challenge!");
                            } else {
                                endGame(true); // Won overall game setup loop
                                return;
                            }
                        }
                    } else {
                        lives--;
                        if (lives <= 0) {
                            endGame(false);
                            return;
                        }
                    }
                    updateHUD();
                    items.splice(i, 1);
                    continue;
                }

                if (item.y > canvas.height) {
                    items.splice(i, 1);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function endGame(isWin) {
            gameActive = false;
            gameplayScreen.style.display = 'none';
            gameOverScreen.style.display = 'flex';

            if (isWin) {
                gameOverTitle.innerText = "🏆 MASTER SCIENTIST!";
                gameOverTitle.style.color = "#00fff0";
                gameOverMsg.innerHTML = "Incredible job! You successfully mastered both parts of Grade 6 Circuits!<br><br><b>Level 1:</b> You isolated conductors correctly.<br><b>Level 2:</b> You identified standard diagram symbols for Cells & Batteries (the power sources providing chemical-to-electrical energy conversion!).";
            } else {
                gameOverTitle.innerText = "💥 CIRCUIT BLOWN OUT";
                gameOverTitle.style.color = "#e43f5a";
                if(currentLevel === 1) {
                    gameOverMsg.innerHTML = "You caught too many <b>Insulators</b>. Materials like plastic, wood, and rubber block electric charges from flowing safely through circuits.";
                } else {
                    gameOverMsg.innerHTML = "You missed the proper symbols or collected the wrong components! Remember, a <b>Cell</b> consists of one long and one short line, while a <b>Battery</b> links multiple cells together.";
                }
            }
        }
    </script>
</body>
</html>
