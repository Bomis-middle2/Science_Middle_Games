<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 6 Science: Fundamentals of Electricity & Circuits Lab</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #090d16;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            border-radius: 16px;
            overflow: hidden;
            border: 4px solid #1e293b;
            background-color: #0f172a;
        }
        canvas {
            display: block;
            background-color: #0f172a;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="circuitLabCanvas" width="900" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('circuitLabCanvas');
        const ctx = canvas.getContext('2d');

        // GAME STATES: 'SPLASH', 'INSTRUCTIONS', 'PLAYING', 'GAME_OVER'
        let currentState = 'SPLASH';
        let splashStartTime = Date.now();
        const SPLASH_DURATION = 5000; // Mandatory 5 Seconds Lock

        // Session Performance & State Metrics
        let activeQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let healthPoints = 3; // Game Over occurs if system integrity falls to 0
        let attemptsLeft = 2;
        let currentInstanceHint = "";
        let displayHintBanner = false;
        let activeOptions = [];
        let selectedObject = null;
        let successGlowTicks = 0;

        // Interactive Component Anchors
        const testSlotZone = { x: 400, y: 350, width: 100, height: 48, occupiedBy: null };
        const knifeSwitchControl = { x: 375, y: 460, width: 150, height: 42, isEngaged: false };

        // Programmatic Web Audio Synthesis Engine (Eliminates External Asset Failures)
        const AudioEngine = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playClick() {
                this.init();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(580, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            },
            playBuzzer() {
                this.init();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.45);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.45);
            },
            playSuccess() {
                this.init();
                // Bell Chime 1 (C5)
                let osc1 = this.ctx.createOscillator();
                let gain1 = this.ctx.createGain();
                osc1.type = 'triangle';
                osc1.frequency.setValueAtTime(523.25, this.ctx.currentTime);
                gain1.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
                osc1.connect(gain1);
                gain1.connect(this.ctx.destination);
                osc1.start();
                osc1.stop(this.ctx.currentTime + 0.35);

                // Bell Chime 2 (E5) delayed
                let osc2 = this.ctx.createOscillator();
                let gain2 = this.ctx.createGain();
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.12);
                gain2.gain.setValueAtTime(0.15, this.ctx.currentTime + 0.12);
                gain2.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.47);
                osc2.connect(gain2);
                gain2.connect(this.ctx.destination);
                osc2.start();
                osc2.stop(this.ctx.currentTime + 0.47);

                this.triggerClappingEffect();
            },
            triggerClappingEffect() {
                // Generates high-quality physical white noise bursts to simulate enthusiastic clapping
                try {
                    let bufSize = this.ctx.sampleRate * 0.35;
                    let buffer = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
                    let data = buffer.getChannelData(0);
                    for (let i = 0; i < bufSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    for (let burst = 0; burst < 3; burst++) {
                        let src = this.ctx.createBufferSource();
                        src.buffer = buffer;
                        let filter = this.ctx.createBiquadFilter();
                        filter.type = 'bandpass';
                        filter.frequency.value = 950 + (burst * 100);
                        let burstGain = this.ctx.createGain();
                        let timeDelay = this.ctx.currentTime + (burst * 0.12);
                        burstGain.gain.setValueAtTime(0.06, timeDelay);
                        burstGain.gain.exponentialRampToValueAtTime(0.001, timeDelay + 0.22);
                        src.connect(filter);
                        filter.connect(burstGain);
                        burstGain.connect(this.ctx.destination);
                        src.start(timeDelay);
                    }
                } catch (e) { console.warn("Audio Context restrictions matched: ", e); }
            }
        };

        // Textbook Database Layer: 12 Rigorous Application Tasks 
        const masterItemPool = [
            { id: "M1", name: "Copper Wire Strip", isConductor: true, label: "COPPER", color: "#b87333", desc: "Complete the connection link to safely transmit power from the plant network.", hint: "Metals like copper allow electric current to pass through freely." },
            { id: "M2", name: "Thick Plastic Jacket", isConductor: false, label: "PLASTIC", color: "#2563eb", desc: "Insulate the bare handle grips of the electrician's pliers to prevent high-voltage hazard shock.", hint: "Plastic behaves as an insulator, blocking electrical current flows." },
            { id: "M3", name: "Aluminium Foil Plate", isConductor: true, label: "ALUMINIUM", color: "#94a3b8", desc: "Bridge a damaged operational trace loop inside a standard electronic circuit board channel.", hint: "Aluminium is a functional metal element used widely for electric cables." },
            { id: "M4", name: "Soft Rubber Tape", isConductor: false, label: "RUBBER", color: "#db2777", desc: "Wrap around a structural copper wire junction splice to seal it cleanly from touch hazards.", hint: "Rubber prevents electrical charges from moving out of the circuit loop." },
            { id: "M5", name: "Steel Safety Pin", isConductor: true, label: "STEEL PIN", color: "#cbd5e1", desc: "Act as an emergency alternative temporary switch mechanism inside a classroom project board.", hint: "Steel is a durable carbon-iron alloy and represents a powerful conductor." },
            { id: "M6", name: "Dry Wooden Block", isConductor: false, label: "DRY WOOD", color: "#78350f", desc: "Isolate a high-power control switch backing panel frame safely from moist grounding lines.", hint: "Dry wood does not allow electric charges to travel through its matrix." },
            { id: "M7", name: "Graphite Electrode", isConductor: true, label: "GRAPHITE", color: "#475569", desc: "Test an alternative mineral structure capable of conducting current despite being non-metallic.", hint: "Graphite is a non-metal form of carbon that conducts current effectively." },
            { id: "M8", name: "Glazed Porcelain Rim", isConductor: false, label: "PORCELAIN", color: "#e2e8f0", desc: "Mount a structural overhead high-voltage cable separation hook safely away from utility poles.", hint: "Ceramic porcelain acts as a premium insulator protecting high-voltage infrastructure." },
            { id: "M9", name: "Iron Construction Nail", isConductor: true, label: "IRON NAIL", color: "#64748b", desc: "Repair a physical gap break detected across an industrial battery bay bracket track terminal.", hint: "Iron objects complete circuits reliably by acting as strong conductors." },
            { id: "M10", name: "Heavy Cardboard Sheeting", isConductor: false, label: "CARDBOARD", color: "#a1a1aa", desc: "Insert a physical safety separator partition barrier inside a tabletop lamp terminal housing box.", hint: "Paper products lack free charge carriers, classifying them clearly as insulators." },
            { id: "M11", name: "Polished Brass Skeleton Key", isConductor: true, label: "BRASS KEY", color: "#eab308", desc: "Form a solid mechanical jumper connection directly across two bare electrical terminal blocks.", hint: "Brass is a robust alloy containing copper, making it a reliable conductor." },
            { id: "M12", name: "Thick Glass Rod Spacer", isConductor: false, label: "GLASS SPACER", color: "#38bdf8", desc: "Construct a physical safety brace bar designed to stop live current leaking into adjacent housing.", hint: "Glass offers very high resistance and handles properties as an expert insulator." }
        ];

        // Initialization Routine: Populates exactly 10 non-repetitive dynamic tasks
        function initializeLaboratorySession() {
            currentQuestionIndex = 0;
            score = 0;
            healthPoints = 3;
            activeQuestions = [...masterItemPool].sort(() => Math.random() - 0.5).slice(0, 10);
            assembleActiveQuestionInstance();
        }

        // Configures choices and coordinates for the active question slide
        function assembleActiveQuestionInstance() {
            attemptsLeft = 2;
            displayHintBanner = false;
            testSlotZone.occupiedBy = null;
            knifeSwitchControl.isEngaged = false;
            successGlowTicks = 0;

            const targetTask = activeQuestions[currentQuestionIndex];
            currentInstanceHint = targetTask.hint;

            // Generate alternative choices from remaining data items
            let distractionPool = masterItemPool.filter(item => item.id !== targetTask.id);
            distractionPool.sort(() => Math.random() - 0.5);

            // Exactly 3 unique selectable choice options per prompt
            let activeChoices = [targetTask, distractionPool[0], distractionPool[1]];
            activeChoices.sort(() => Math.random() - 0.5);

            activeOptions = [];
            for (let i = 0; i < 3; i++) {
                activeOptions.push({
                    data: activeChoices[i],
                    x: 200 + (i * 250),
                    y: 150,
                    originX: 200 + (i * 250),
                    originY: 150,
                    width: 180,
                    height: 50,
                    isDocked: false
                });
            }
        }

        // Custom Vector Branding Renderer (Zero-White Layout Safeguard)
        function drawInnovineVectorBranding(x, y, multiplier) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(multiplier, multiplier);

            // External Geometrical Techno Hexagon Ring
            ctx.strokeStyle = '#0ea5e9';
            ctx.lineWidth = 5;
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                let rotAngle = (Math.PI / 3) * i;
                let hx = 75 * Math.cos(rotAngle);
                let hy = 75 * Math.sin(rotAngle);
                if (i === 0) ctx.moveTo(hx, hy);
                else ctx.lineTo(hx, hy);
            }
            ctx.closePath();
            ctx.stroke();

            // Internal Central Core Energy Node
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(0, 0, 22, 0, Math.PI * 2);
            ctx.fill();

            // Trace Network Grid Triggers
            ctx.strokeStyle = '#67e8f9';
            ctx.lineWidth = 4;
            for (let j = 0; j < 3; j++) {
                let segmentAngle = (Math.PI / 1.5) * j + 0.3;
                ctx.beginPath();
                ctx.moveTo(22 * Math.cos(segmentAngle), 22 * Math.sin(segmentAngle));
                ctx.lineTo(62 * Math.cos(segmentAngle), 62 * Math.sin(segmentAngle));
                ctx.stroke();

                // Distributed Node Junctions
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(62 * Math.cos(segmentAngle), 62 * Math.sin(segmentAngle), 6, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        // Central Canvas Evaluation & Render Engine
        function paintLaboratoryTick() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (currentState === 'SPLASH') {
                // Strict Dark Splash Screen
                ctx.fillStyle = '#090d16';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                drawInnovineVectorBranding(canvas.width / 2, canvas.height / 2 - 40, 1.25);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 42px sans-serif';
                ctx.letterSpacing = "4px";
                ctx.textAlign = 'center';
                ctx.fillText('INNOVINE', canvas.width / 2, canvas.height / 2 + 85);
                ctx.letterSpacing = "0px";

                ctx.fillStyle = '#475569';
                ctx.font = '600 14px sans-serif';
                ctx.fillText('VIRTUAL LABORATORY SIMULATION ENVIRONMENT', canvas.width / 2, canvas.height / 2 + 130);

                // Evaluation Route for 5-Second Threshold
                if (Date.now() - splashStartTime > SPLASH_DURATION) {
                    currentState = 'INSTRUCTIONS';
                }

            } else if (currentState === 'INSTRUCTIONS') {
                // Instruction Board (Rendered ONLY after Splash Phase terminates)
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 32px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('LAB PROTOCOLS & CIRCUIT DIAGRAM INSTRUCTIONS', canvas.width / 2, 85);

                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 15px sans-serif';
                ctx.fillText('SCIENCE CURRICULUM LEVEL VI  |  CHAPTER 8: ELECTRICITY', canvas.width / 2, 120);

                // Central Instructions Panel Box
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(80, 160, 740, 290);
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 2;
                ctx.strokeRect(80, 160, 740, 290);

                ctx.textAlign = 'left';
                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('CORE SCIENTIFIC OBJECTIVE:', 120, 205);

                ctx.fillStyle = '#cbd5e1';
                ctx.font = '15px sans-serif';
                ctx.fillText('Read the laboratory requirement. Analyze whether the scenario calls for a', 120, 230);
                ctx.fillText('Conductor (allows current) or an Insulator (blocks current) to complete the tasks safely.', 120, 255);

                ctx.fillStyle = '#facc15';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('LABORATORY WORKFLOW CONTROLS:', 120, 310);

                ctx.fillStyle = '#cbd5e1';
                ctx.font = '15px sans-serif';
                ctx.fillText('1. Drag items using your pointer directly into the dashed test slot circuit junction.', 120, 335);
                ctx.fillText('2. Click on the knife switch lever down to pass current verification tests.', 120, 360);
                ctx.fillText('3. Each prompt permits 2 distinct attempt loops before generating contextual hints.', 120, 385);
                ctx.fillText('4. Preserve system health metrics. Completing 10 questions routes to the evaluation card.', 120, 410);

                // Clickable Action Trigger
                ctx.fillStyle = '#10b981';
                ctx.fillRect(320, 490, 260, 50);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('INITIALIZE LABORATORY SUITE', canvas.width / 2, 521);

            } else if (currentState === 'PLAYING') {
                const targetTask = activeQuestions[currentQuestionIndex];

                // Continuous Scoreboard Header
                ctx.fillStyle = '#090d16';
                ctx.fillRect(0, 0, canvas.width, 65);
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 2;
                ctx.strokeRect(0, 0, canvas.width, 65);

                ctx.textAlign = 'left';
                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText(`CURRENT TASK: ${currentQuestionIndex + 1} / 10`, 30, 38);

                ctx.textAlign = 'center';
                ctx.fillStyle = '#ffffff';
                ctx.fillText(`METRIC ACCURACY: ${score} Pts`, canvas.width / 2 - 80, 38);
                ctx.fillStyle = '#ef4444';
                ctx.fillText(`SYSTEM INTEGRITY: ${healthPoints} HP`, canvas.width / 2 + 100, 38);

                ctx.textAlign = 'right';
                ctx.fillStyle = '#475569';
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText('CHAPTER 8 CORE LAB', canvas.width - 30, 38);

                // Objective Banner Frame
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(40, 85, 820, 45);
                ctx.fillStyle = '#facc15';
                ctx.font = '600 15px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`SCENARIO TARGET: "${targetTask.desc}"`, canvas.width / 2, 113);

                // Blueprint Circuit Path Vector Drawings [cite: 374, 375, 376]
                let systemClosedSuccessfully = (knifeSwitchControl.isEngaged && testSlotZone.occupiedBy && testSlotZone.occupiedBy.data.id === targetTask.id);
                ctx.lineWidth = 7;
                ctx.strokeStyle = systemClosedSuccessfully ? '#facc15' : '#334155';

                // Core loop layout lines
                ctx.beginPath();
                ctx.moveTo(250, 374);
                ctx.lineTo(160, 374);
                ctx.lineTo(160, 280);
                ctx.lineTo(400, 280);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(500, 280);
                ctx.lineTo(740, 280);
                ctx.lineTo(740, 374);
                ctx.lineTo(500, 374);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(250, 374);
                ctx.lineTo(250, 480);
                ctx.lineTo(375, 480);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(525, 480);
                ctx.lineTo(650, 480);
                ctx.lineTo(650, 374);
                ctx.stroke();

                // Component 1: The Dry Chemical Power Cell [cite: 357, 359, 365]
                ctx.save();
                ctx.translate(540, 350);
                ctx.fillStyle = '#ef4444'; // Non-white child-friendly primary element colors
                ctx.fillRect(0, 0, 110, 48);
                ctx.fillStyle = '#64748b';
                ctx.fillRect(110, 14, 8, 20);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('DRY CELL', 55, 29);
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText('+', 100, 31);
                ctx.fillText('-', 15, 31);
                ctx.restore();

                // Component 2: Filament Light Bulb Housing [cite: 378, 380, 384]
                ctx.save();
                ctx.translate(405, 230);
                if (systemClosedSuccessfully) {
                    successGlowTicks++;
                    let pulsingGlow = ctx.createRadialGradient(45, 25, 5, 45, 25, 45 + Math.sin(successGlowTicks * 0.15) * 6);
                    pulsingGlow.addColorStop(0, 'rgba(254, 240, 138, 1)');
                    pulsingGlow.addColorStop(0.5, 'rgba(234, 179, 8, 0.4)');
                    pulsingGlow.addColorStop(1, 'rgba(234, 179, 8, 0)');
                    ctx.fillStyle = pulsingGlow;
                    ctx.beginPath();
                    ctx.arc(45, 25, 50, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = systemClosedSuccessfully ? '#fef08a' : '#1e293b';
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(45, 25, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                // Filament thread element representation inside glass case [cite: 378, 380]
                ctx.strokeStyle = systemClosedSuccessfully ? '#ea580c' : '#475569';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(35, 30);
                ctx.lineTo(40, 15);
                ctx.lineTo(50, 15);
                ctx.lineTo(55, 30);
                ctx.stroke();
                ctx.fillStyle = '#334155';
                ctx.fillRect(32, 49, 26, 12);
                ctx.restore();

                // Target Circuit Disconnect Testing Slot Area
                ctx.fillStyle = 'rgba(9, 13, 22, 0.8)';
                ctx.fillRect(testSlotZone.x, testSlotZone.y, testSlotZone.width, testSlotZone.height);
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([6, 4]);
                ctx.strokeRect(testSlotZone.x, testSlotZone.y, testSlotZone.width, testSlotZone.height);
                ctx.setLineDash([]);
                ctx.fillStyle = '#475569';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                if (!testSlotZone.occupiedBy) {
                    ctx.fillText('INSERT ELEMENT', testSlotZone.x + testSlotZone.width / 2, testSlotZone.y + 28);
                }

                // Interactive Circuit Control Knife Switch [cite: 395, 396]
                ctx.fillStyle = knifeSwitchControl.isEngaged ? '#10b981' : '#dc2626';
                ctx.fillRect(knifeSwitchControl.x, knifeSwitchControl.y, knifeSwitchControl.width, knifeSwitchControl.height);
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 2;
                ctx.strokeRect(knifeSwitchControl.x, knifeSwitchControl.y, knifeSwitchControl.width, knifeSwitchControl.height);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px sans-serif';
                ctx.fillText(knifeSwitchControl.isEngaged ? 'SWITCH CLOSED' : 'ENGAGE SWITCH', knifeSwitchControl.x + knifeSwitchControl.width / 2, knifeSwitchControl.y + 26);

                // Option Block List Element Layout Cards
                activeOptions.forEach(opt => {
                    if (!opt.isDocked || selectedObject === opt) {
                        ctx.fillStyle = opt.data.color;
                        ctx.fillRect(opt.x - opt.width / 2, opt.y - opt.height / 2, opt.width, opt.height);
                        ctx.strokeStyle = selectedObject === opt ? '#facc15' : '#334155';
                        ctx.lineWidth = selectedObject === opt ? 3.5 : 2;
                        ctx.strokeRect(opt.x - opt.width / 2, opt.y - opt.height / 2, opt.width, opt.height);

                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 13px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText(opt.data.name, opt.x, opt.y + 5);
                    }
                });

                // Automated Contextual Remedial Hint System Box
                if (displayHintBanner) {
                    ctx.fillStyle = '#1e1b4b';
                    ctx.fillRect(60, 525, 780, 48);
                    ctx.strokeStyle = '#f59e0b';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(60, 525, 780, 48);

                    ctx.fillStyle = '#fbbf24';
                    ctx.font = 'italic 14px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`SCIENTIFIC CONCEPT HINT: ${currentInstanceHint}`, canvas.width / 2, 554);
                }

            } else if (currentState === 'GAME_OVER') {
                // Completed Terminal Summary Card
                ctx.fillStyle = '#090d16';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let testPassed = (healthPoints > 0 && score >= 7);

                ctx.fillStyle = testPassed ? '#10b981' : '#ef4444';
                ctx.font = 'bold 38px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(testPassed ? 'LAB EVALUATION SUCCESSFUL' : 'LAB CERTIFICATION INCOMPLETE', canvas.width / 2, 170);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 20px sans-serif';
                ctx.fillText(`Operational Calibration Accuracy: ${score} / 10 Tasks Matched`, canvas.width / 2, 245);

                ctx.fillStyle = '#94a3b8';
                ctx.font = '15px sans-serif';
                if (testPassed) {
                    ctx.fillText('Excellent proficiency. Core principles of conductive loops and insulator barriers mastered.', canvas.width / 2, 300);
                } else {
                    ctx.fillText('Required proficiency threshold not fulfilled. Re-examine the material charts and try again.', canvas.width / 2, 300);
                }

                // Interactive Session Reset Mechanism
                ctx.fillStyle = '#2563eb';
                ctx.fillRect(350, 380, 200, 52);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('RUN NEW TRIAL', canvas.width / 2, 412);
            }
        }

        // Pointer Click & Interaction Interception Event Management
        window.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (currentState === 'INSTRUCTIONS') {
                // Check start lab coordinates bounds engagement
                if (mouseX >= 320 && mouseX <= 580 && mouseY >= 490 && mouseY <= 540) {
                    AudioEngine.playClick();
                    initializeLaboratorySession();
                    currentState = 'PLAYING';
                }
            } else if (currentState === 'PLAYING') {
                // Scan list array inputs for intersecting choice objects
                activeOptions.forEach(opt => {
                    if (mouseX >= opt.x - opt.width / 2 && mouseX <= opt.x + opt.width / 2 &&
                        mouseY >= opt.y - opt.height / 2 && mouseY <= opt.y + opt.height / 2) {
                        selectedObject = opt;
                        AudioEngine.playClick();
                    }
                });

                // Switch Trigger Verification System Controls
                if (mouseX >= knifeSwitchControl.x && mouseX <= knifeSwitchControl.x + knifeSwitchControl.width &&
                    mouseY >= knifeSwitchControl.y && mouseY <= knifeSwitchControl.y + knifeSwitchControl.height) {
                    
                    if (testSlotZone.occupiedBy && !knifeSwitchControl.isEngaged) {
                        knifeSwitchControl.isEngaged = true;
                        AudioEngine.playClick();

                        let targetObject = activeQuestions[currentQuestionIndex];
                        if (testSlotZone.occupiedBy.data.id === targetObject.id) {
                            // Validation Loop Succeeded Pathway
                            AudioEngine.playSuccess();
                            score++;
                            setTimeout(() => {
                                currentQuestionIndex++;
                                if (currentQuestionIndex >= 10) {
                                    currentState = 'GAME_OVER'; // Route exactly to absolute end state
                                } else {
                                    assembleActiveQuestionInstance();
                                }
                            }, 1900);
                        } else {
                            // Validation Loop Failed Pathway
                            AudioEngine.playBuzzer();
                            healthPoints--;
                            attemptsLeft--;

                            setTimeout(() => {
                                if (healthPoints <= 0) {
                                    currentState = 'GAME_OVER';
                                } else {
                                    knifeSwitchControl.isEngaged = false;
                                    if (attemptsLeft <= 0) {
                                        displayHintBanner = true; // Auto display hint text block asset
                                    }
                                    // Elastic Snap Return to Starting Coordinates Positions
                                    if (testSlotZone.occupiedBy) {
                                        testSlotZone.occupiedBy.x = testSlotZone.occupiedBy.originX;
                                        testSlotZone.occupiedBy.y = testSlotZone.occupiedBy.originY;
                                        testSlotZone.occupiedBy.isDocked = false;
                                        testSlotZone.occupiedBy = null;
                                    }
                                }
                            }, 1300);
                        }
                    } else if (!testSlotZone.occupiedBy) {
                        AudioEngine.playBuzzer();
                    }
                }
            } else if (currentState === 'GAME_OVER') {
                // Process request for running new test evaluation session cycles
                if (mouseX >= 350 && mouseX <= 550 && mouseY >= 380 && mouseY <= 432) {
                    AudioEngine.playClick();
                    initializeLaboratorySession();
                    currentState = 'PLAYING';
                }
            }
        });

        // Pointer Live-Motion Event Tracker Coordinates Updates
        window.addEventListener('mousemove', (e) => {
            if (!selectedObject || currentState !== 'PLAYING') return;
            const rect = canvas.getBoundingClientRect();
            selectedObject.x = e.clientX - rect.left;
            selectedObject.y = e.clientY - rect.top;
        });

        // Pointer Release Evaluation Event Framework Handler Rules
        window.addEventListener('mouseup', () => {
            if (!selectedObject || currentState !== 'PLAYING') return;

            let dropZoneCenterX = testSlotZone.x + testSlotZone.width / 2;
            let dropZoneCenterY = testSlotZone.y + testSlotZone.height / 2;
            let spatialDistance = Math.hypot(selectedObject.x - dropZoneCenterX, selectedObject.y - dropZoneCenterY);

            // Snapping capture lock geometry check rules
            if (spatialDistance < 90 && !testSlotZone.occupiedBy) {
                selectedObject.x = dropZoneCenterX;
                selectedObject.y = dropZoneCenterY;
                selectedObject.isDocked = true;
                testSlotZone.occupiedBy = selectedObject;
                AudioEngine.playClick();
            } else {
                // Elastic failure bounce back to card list decks configuration points
                selectedObject.x = selectedObject.originX;
                selectedObject.y = selectedObject.originY;
                selectedObject.isDocked = false;
                if (testSlotZone.occupiedBy === selectedObject) {
                    testSlotZone.occupiedBy = null;
                }
            }
            selectedObject = null;
        });

        // Continuous Main Cycle Render Routine Execution Driver 
        function frameTickController() {
            paintLaboratoryTick();
            requestAnimationFrame(frameTickController);
        }

        // Engage continuous cycle engine runtime execution immediately
        frameTickController();
    </script>
</body>
