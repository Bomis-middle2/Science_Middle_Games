<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 6 Physics: Magnetism Module</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070c;
            color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #labContainer {
            position: relative;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
            border-radius: 16px;
            overflow: hidden;
            border: 4px solid #1e293b;
            background-color: #111827;
        }
        canvas {
            display: block;
            background-color: #111827;
        }
    </style>
</head>
<body>

    <div id="labContainer">
        <canvas id="magnetismCanvas" width="900" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('magnetismCanvas');
        const ctx = canvas.getContext('2d');

        // ASSET PIPELINE: Load external branding image
        const logoAsset = new Image();
        logoAsset.src = 'assets/logo.png';

        // STATE ENGINE: 'SPLASH', 'INSTRUCTIONS', 'PLAYING', 'GAME_OVER'
        let currentState = 'SPLASH';
        let splashStartTime = Date.now();
        const SPLASH_LOCK_DURATION = 2000; // 2 Seconds for quick debugging/loading

        // Session Game Metrics
        let activeTasks = [];
        let currentTaskIndex = 0;
        let score = 0;
        let healthPoints = 3; 
        let attemptsLeft = 2;
        let displayHintBanner = false;
        let currentInstanceHint = "";
        let choiceCards = [];
        let loadedSpecimen = null;
        let animationTicks = 0;

        // Interactive Interface Buttons (Non-drag zones)
        const testTriggerButton = { x: 365, y: 490, width: 170, height: 44, isActivated: false };

        // Programmatic Web Audio Synthesis Engine
        const AudioSynth = {
            audioCtx: null,
            init() {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }
            },
            playTap() {
                this.init();
                let osc = this.audioCtx.createOscillator();
                let gain = this.audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(620, this.audioCtx.currentTime);
                gain.gain.setValueAtTime(0.06, this.audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.07);
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);
                osc.start();
                osc.stop(this.audioCtx.currentTime + 0.07);
            },
            playBuzzer() {
                this.init();
                let osc = this.audioCtx.createOscillator();
                let gain = this.audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, this.audioCtx.currentTime);
                gain.gain.setValueAtTime(0.25, this.audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);
                osc.start();
                osc.stop(this.audioCtx.currentTime + 0.4);
            },
            playChime() {
                this.init();
                let osc1 = this.audioCtx.createOscillator();
                let gain1 = this.audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, this.audioCtx.currentTime); 
                gain1.gain.setValueAtTime(0.12, this.audioCtx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.3);
                osc1.connect(gain1);
                gain1.connect(this.audioCtx.destination);
                osc1.start();
                osc1.stop(this.audioCtx.currentTime + 0.3);

                let osc2 = this.audioCtx.createOscillator();
                let gain2 = this.audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(659.25, this.audioCtx.currentTime + 0.1); 
                gain2.gain.setValueAtTime(0.12, this.audioCtx.currentTime + 0.1);
                gain2.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.4);
                osc2.connect(gain2);
                gain2.connect(this.audioCtx.destination);
                osc2.start();
                osc2.stop(this.audioCtx.currentTime + 0.4);
            }
        };

        // Grade 6 Physics Application Database Layer
        const magnetismQuestionPool = [
            { id: "Q1", name: "Iron Casing Nail", type: "Magnetic Material", isCorrectGroup: true, hexColor: "#64748b", prompt: "Identify a reliable magnetic material to safely secure structural iron bracket fixtures.", hint: "Iron, Cobalt, and Nickel are classic magnetic substances strongly attracted to magnets." },
            { id: "Q2", name: "Brass Key Ring", type: "Non-Magnetic Material", isCorrectGroup: false, hexColor: "#eab308", prompt: "Select a component that will NOT be attracted when mapping out a copper-alloy security casing.", hint: "Brass and copper are non-ferrous metals and do not display magnetic tracking properties." },
            { id: "Q3", name: "Aluminium Can Lip", type: "Non-Magnetic Material", isCorrectGroup: false, hexColor: "#94a3b8", prompt: "Isolate a non-magnetic sorting item away from automated electromagnetic separating belts.", hint: "Aluminium handles properties as a non-magnetic metal that ignores static magnetic lines." },
            { id: "Q4", name: "Pure Cobalt Rod", type: "Magnetic Material", isCorrectGroup: true, hexColor: "#3b82f6", prompt: "Find a core transition metal suitable for forging strong industrial permanent alloy magnets.", hint: "Cobalt is ferromagnetic, making it vital for engineering powerful permanent magnet cores." },
            { id: "Q5", name: "South Pole Base", type: "Opposite Attraction", isCorrectGroup: true, hexColor: "#dc2626", prompt: "Determine what face must point toward a North Pole marker to trigger a strong attractive pull.", hint: "Unlike magnetic poles (North and South) generate attractive forces that draw them together." },
            { id: "Q6", name: "North Pole Bracket", type: "Like Repulsion", isCorrectGroup: false, hexColor: "#334155", prompt: "Predict which pole placement causes a magnetic lever arm to push away from an active North Pole terminal.", hint: "Like magnetic poles (North and North, or South and South) generate repulsive forces that push apart." },
            { id: "Q7", name: "Soft Rubber Block", type: "Non-Magnetic Material", isCorrectGroup: false, hexColor: "#db2777", prompt: "Identify a flexible shielding material completely transparent to field lines and un-attracted.", hint: "Rubber lacks aligned atomic magnetic dipoles and is completely non-magnetic." },
            { id: "Q8", name: "Steel Safety Pin", type: "Magnetic Material", isCorrectGroup: true, hexColor: "#cbd5e1", prompt: "Choose a steel item that can pick up smaller paperclips once contextually magnetized.", hint: "Steel contains iron grains and can easily become induced as a temporary magnet." },
            { id: "Q9", name: "Thick Glass Spacer", type: "Non-Magnetic Material", isCorrectGroup: false, hexColor: "#38bdf8", prompt: "Isolate a structural dielectric frame element that shows zero attraction to lodestone samples.", hint: "Glass offers no magnetic permeability and cannot be attracted or repelled by fields." },
            { id: "Q10", name: "Nickel Plated Coin", type: "Magnetic Material", isCorrectGroup: true, hexColor: "#a1a1aa", prompt: "Select an alloy component consisting of nickel that reacts actively inside coin sorting machines.", hint: "Elemental nickel is naturally ferromagnetic at standard room temperatures." },
            { id: "Q11", name: "Dry Timber Strip", type: "Non-Magnetic Material", isCorrectGroup: false, hexColor: "#78350f", prompt: "Choose an organic insulation spacer completely immune to permanent bar magnet forces.", hint: "Wood has no structural free electrons or dipoles capable of responding to magnetic fields." },
            { id: "Q12", name: "South Pole Guide", type: "Like Repulsion", isCorrectGroup: false, hexColor: "#ef4444", prompt: "Select a secondary directional cap that experiences active repulsive levitation over a South Pole block.", hint: "Bringing identical pole configurations together produces absolute repulsive action." }
        ];

        function startNewSession() {
            currentTaskIndex = 0;
            score = 0;
            healthPoints = 3;
            activeTasks = [...magnetismQuestionPool].sort(() => Math.random() - 0.5).slice(0, 10);
            generateTaskEnvironment();
        }

        function generateTaskEnvironment() {
            attemptsLeft = 2;
            displayHintBanner = false;
            loadedSpecimen = null;
            testTriggerButton.isActivated = false;
            animationTicks = 0;

            const targetTask = activeTasks[currentTaskIndex];
            currentInstanceHint = targetTask.hint;

            let alternativesPool = magnetismQuestionPool.filter(i => i.id !== targetTask.id);
            alternativesPool.sort(() => Math.random() - 0.5);

            let uniqueSelection = [targetTask, alternativesPool[0], alternativesPool[1]];
            uniqueSelection.sort(() => Math.random() - 0.5);

            choiceCards = [];
            for (let i = 0; i < 3; i++) {
                choiceCards.push({
                    data: uniqueSelection[i],
                    x: 180 + (i * 270), 
                    y: 400,
                    width: 220,
                    height: 55,
                    isSelected: false
                });
            }
        }

        // RE-ENGINEERED LOGO DRAWER: Renders target reference asset/logo.png cleanly centered
        function drawInnovineLogoAsset(x, y, displayWidth, displayHeight) {
            // Check to ensure the image has loaded down the asset line pipeline before drawing
            if (logoAsset.complete && logoAsset.naturalWidth !== 0) {
                ctx.save();
                // Draw image anchored from its true center point coordinates
                ctx.drawImage(
                    logoAsset, 
                    x - displayWidth / 2, 
                    y - displayHeight / 2, 
                    displayWidth, 
                    displayHeight
                );
                ctx.restore();
            } else {
                // High-quality fallback text tracker while asset finishes server fetch
                ctx.save();
                ctx.fillStyle = '#2563eb';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('[LOGOTYPE]', x, y);
                ctx.restore();
            }
        }

        function updateAndRenderCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (currentState === 'SPLASH') {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Render the clean image asset logo (150x150 dimensions for splash screen display focus)
                drawInnovineLogoAsset(canvas.width / 2, canvas.height / 2 - 40, 150, 150);

                ctx.fillStyle = '#0f172a'; 
                ctx.font = 'bold 44px sans-serif';
                ctx.letterSpacing = "5px";
                ctx.textAlign = 'center';
                ctx.fillText('INNOVINE', canvas.width / 2, canvas.height / 2 + 90);
                ctx.letterSpacing = "0px";
                ctx.fillStyle = '#64748b'; 
                ctx.font = 'bold 13px sans-serif';
                ctx.fillText('PHYSICS LABORATORY SIMULATION HARDWARE', canvas.width / 2, canvas.height / 2 + 135);

                if (Date.now() - splashStartTime > SPLASH_LOCK_DURATION) {
                    currentState = 'INSTRUCTIONS';
                }

            } else if (currentState === 'INSTRUCTIONS') {
                ctx.fillStyle = '#090d16';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 30px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('LAB PROTOCOLS: CORE MAGNETISM EXPLORER', canvas.width / 2, 90);

                ctx.fillStyle = '#4b5563';
                ctx.font = 'bold 15px sans-serif';
                ctx.fillText('ELEMENTARY COGNITIVE PHYSICS SERIES  |  GRADE 6', canvas.width / 2, 125);

                ctx.fillStyle = '#111827';
                ctx.fillRect(80, 170, 740, 270);
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 3;
                ctx.strokeRect(80, 170, 740, 270);

                ctx.textAlign = 'left';
                ctx.fillStyle = '#3b82f6';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('EXPERIMENTAL PURPOSE:', 125, 215);

                ctx.fillStyle = '#cbd5e1';
                ctx.font = '15px sans-serif';
                ctx.fillText('Analyze the magnetism research task prompt. Correctly test individual specimens', 125, 240);
                ctx.fillText('against dynamic magnet terminals to observe reactive core flux properties.', 125, 265);

                ctx.fillStyle = '#eab308';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('INTERACTIVE CONTROL PANEL RULES:', 125, 315);

                ctx.fillStyle = '#cbd5e1';
                ctx.font = '15px sans-serif';
                ctx.fillText('1. Click or tap directly on any specimen console to load it into the chamber.', 125, 340);
                ctx.fillText('2. Run the Flux Analysis system to evaluate magnetic field reactions.', 125, 365);
                ctx.fillText('3. Locked hint scaffolds will unlock dynamically if calibration failures occur.', 125, 390);

                ctx.fillStyle = '#10b981';
                ctx.fillRect(320, 485, 260, 50);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('ENGAGE MAGNETISM CONSOLE', canvas.width / 2, 516);

            } else if (currentState === 'PLAYING') {
                const currentTask = activeTasks[currentTaskIndex];
                animationTicks++;

                // HUD Scoreboard Header
                ctx.fillStyle = '#05070c';
                ctx.fillRect(0, 0, canvas.width, 65);
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 2;
                ctx.strokeRect(0, 0, canvas.width, 65);

                // Small decorative logo inside the UI Header panel (40x40 dimension constraint)
                drawInnovineLogoAsset(50, 32, 40, 40);

                ctx.font = 'bold 15px sans-serif';
                ctx.textAlign = 'left';
                ctx.fillStyle = '#38bdf8';
                ctx.fillText(`CURRENT TASK: ${currentTaskIndex + 1} / 10`, 95, 38);
                ctx.fillStyle = '#f8fafc';
                ctx.fillText(`EARNED SCORE: ${score} Pts`, 340, 38);
                ctx.fillStyle = '#ef4444';
                ctx.fillText(`SYSTEM HP: ${healthPoints} LIFE`, 590, 38);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#4b5563';
                ctx.fillText('CLICK-MATRIX PANEL V2', canvas.width - 35, 38);

                // Scenario Prompt Board
                ctx.fillStyle = '#1f2937';
                ctx.fillRect(40, 85, 820, 46);
                ctx.fillStyle = '#fbbf24';
                ctx.font = '600 15px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`SCENARIO CRITERIA: "${currentTask.prompt}"`, canvas.width / 2, 113);

                // --- CENTRAL CORE MAGNETIC FLUX CHAMBER ---
                let chamberX = 450;
                let chamberY = 220;
                
                // Pulsing Wave Ring Logic on Validation Check
                let isAnswerCorrect = (testTriggerButton.isActivated && loadedSpecimen && loadedSpecimen.data.id === currentTask.id);
                if (isAnswerCorrect) {
                    ctx.save();
                    ctx.translate(chamberX, chamberY);
                    ctx.lineWidth = 3;
                    for (let r = 1; r <= 3; r++) {
                        ctx.strokeStyle = `rgba(16, 185, 129, ${0.8 - (r * 0.2)})`;
                        let pulseRadius = 50 + r * 20 + Math.sin(animationTicks * 0.25) * 6;
                        ctx.beginPath();
                        ctx.ellipse(-90, 0, pulseRadius * 0.5, pulseRadius, 0, 0, Math.PI * 2);
                        ctx.ellipse(90, 0, pulseRadius * 0.5, pulseRadius, 0, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                // Render Bar Magnet
                ctx.save();
                ctx.translate(chamberX, chamberY - 40);
                ctx.fillStyle = '#ef4444'; // North
                ctx.fillRect(-90, -15, 90, 30);
                ctx.fillStyle = '#2563eb'; // South
                ctx.fillRect(0, -15, 90, 30);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('N', -45, 5);
                ctx.fillText('S', 45, 5);
                ctx.restore();

                // Specimen Testing Platform Dock Location
                let dockX = chamberX - 80;
                let dockY = chamberY + 30;
                let dockW = 160;
                let dockH = 50;

                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                ctx.fillRect(dockX, dockY, dockW, dockH);
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2;
                ctx.strokeRect(dockX, dockY, dockW, dockH);

                // Render currently loaded item inside the test rig
                if (loadedSpecimen) {
                    ctx.fillStyle = loadedSpecimen.data.hexColor;
                    ctx.fillRect(dockX + 10, dockY + 10, dockW - 20, dockH - 20);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(loadedSpecimen.data.name, chamberX, dockY + 30);
                } else {
                    ctx.fillStyle = '#4b5563';
                    ctx.font = 'bold 11px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('CHAMBER EMPTY', chamberX, dockY + 30);
                }

                // --- INTERACTIVE SPECIMEN SELECTION MATRIX ---
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(40, 335, 820, 135);
                ctx.strokeStyle = '#1e293b';
                ctx.strokeRect(40, 335, 820, 135);

                ctx.fillStyle = '#94a3b8';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText("AVAILABLE WORKBENCH SPECIMENS (CLICK TO LOAD CHASSIS):", 55, 358);

                choiceCards.forEach(card => {
                    let cardLeft = card.x - card.width / 2;
                    let cardTop = card.y - card.height / 2;

                    if (loadedSpecimen && loadedSpecimen.data.id === card.data.id) {
                        ctx.fillStyle = '#1e293b';
                        ctx.fillRect(cardLeft - 4, cardTop - 4, card.width + 8, card.height + 8);
                        ctx.strokeStyle = '#facc15'; 
                        ctx.lineWidth = 3;
                    } else {
                        ctx.fillStyle = '#111827';
                        ctx.fillRect(cardLeft, cardTop, card.width, card.height);
                        ctx.strokeStyle = card.data.hexColor;
                        ctx.lineWidth = 2;
                    }
                    ctx.strokeRect(cardLeft, cardTop, card.width, card.height);

                    // Colored Swatch internal indicator
                    ctx.fillStyle = card.data.hexColor;
                    ctx.fillRect(cardLeft + 12, cardTop + 15, 25, 25);

                    // Text String
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 13px sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText(card.data.name, cardLeft + 50, card.y + 5);
                });

                // Analysis Execution Button
                ctx.fillStyle = testTriggerButton.isActivated ? '#10b981' : '#dc2626';
                ctx.fillRect(testTriggerButton.x, testTriggerButton.y, testTriggerButton.width, testTriggerButton.height);
                ctx.strokeStyle = '#374151';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(testTriggerButton.x, testTriggerButton.y, testTriggerButton.width, testTriggerButton.height);
                
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(testTriggerButton.isActivated ? 'ANALYZING FLUX' : 'RUN FLUX ANALYSIS', testTriggerButton.x + testTriggerButton.width / 2, testTriggerButton.y + 26);

                // Concept Scaffold Banner
                if (displayHintBanner) {
                    ctx.fillStyle = '#1e1b4b';
                    ctx.fillRect(60, 545, 780, 42);
                    ctx.strokeStyle = '#d97706';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(60, 545, 780, 42);

                    ctx.fillStyle = '#fbbf24';
                    ctx.font = 'italic 13px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`MAGNETIC CONTEXT HINT: ${currentInstanceHint}`, canvas.width / 2, 571);
                }

            } else if (currentState === 'GAME_OVER') {
                ctx.fillStyle = '#05070c';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let verifiedPass = (healthPoints > 0 && score >= 7);
                ctx.fillStyle = verifiedPass ? '#10b981' : '#ef4444';
                ctx.font = 'bold 36px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(verifiedPass ? 'MAGNETISM EXPERIMENT COMPLETE' : 'LAB CERTIFICATION INCOMPLETE', canvas.width / 2, 180);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 20px sans-serif';
                ctx.fillText(`Final Performance Accuracy Score: ${score} / 10 Units Correct`, canvas.width / 2, 255);

                ctx.fillStyle = '#94a3b8';
                ctx.font = '15px sans-serif';
                if (verifiedPass) {
                    ctx.fillText('Excellent evaluation. Core knowledge of field poles, ferritic vectors and material limits achieved.', canvas.width / 2, 315);
                } else {
                    ctx.fillText('Performance standard below threshold. Re-examine standard ferromagnetic properties and try again.', canvas.width / 2, 315);
                }

                ctx.fillStyle = '#2563eb';
                ctx.fillRect(350, 400, 200, 52);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('RUN NEW TRIAL', canvas.width / 2, 432);
            }
        }

        function handlePointerInterface(pX, pY) {
            if (currentState === 'INSTRUCTIONS') {
                if (pX >= 320 && pX <= 580 && pY >= 485 && pY <= 535) {
                    AudioSynth.playTap();
                    startNewSession();
                    currentState = 'PLAYING';
                }
            } else if (currentState === 'PLAYING') {
                choiceCards.forEach(card => {
                    if (pX >= card.x - card.width / 2 && pX <= card.x + card.width / 2 &&
                        pY >= card.y - card.height / 2 && pY <= card.y + card.height / 2) {
                        
                        if (!testTriggerButton.isActivated) {
                            loadedSpecimen = card;
                            AudioSynth.playTap();
                        }
                    }
                });

                if (pX >= testTriggerButton.x && pX <= testTriggerButton.x + testTriggerButton.width &&
                    pY >= testTriggerButton.y && pY <= testTriggerButton.y + testTriggerButton.height) {
                    
                    if (loadedSpecimen && !testTriggerButton.isActivated) {
                        testTriggerButton.isActivated = true;
                        AudioSynth.playTap();

                        let correctInstance = activeTasks[currentTaskIndex];
                        if (loadedSpecimen.data.id === correctInstance.id) {
                            AudioSynth.playChime();
                            score++;
                            setTimeout(() => {
                                currentTaskIndex++;
                                if (currentTaskIndex >= 10) {
                                    currentState = 'GAME_OVER';
                                } else {
                                    generateTaskEnvironment();
                                }
                            }, 1800);
                        } else {
                            AudioSynth.playBuzzer();
                            healthPoints--;
                            attemptsLeft--;

                            setTimeout(() => {
                                if (healthPoints <= 0) {
                                    currentState = 'GAME_OVER';
                                } else {
                                    testTriggerButton.isActivated = false;
                                    if (attemptsLeft <= 0) {
                                        displayHintBanner = true;
                                    }
                                    loadedSpecimen = null; 
                                }
                            }, 1400);
                        }
                    } else if (!loadedSpecimen) {
                        AudioSynth.playBuzzer();
                    }
                }
            } else if (currentState === 'GAME_OVER') {
                if (pX >= 350 && pX <= 550 && pY >= 400 && pY <= 452) {
                    AudioSynth.playTap();
                    startNewSession();
                    currentState = 'PLAYING';
                }
            }
        }

        function getMouseCoordinates(e) {
            const boundaryRect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - boundaryRect.left,
                y: e.clientY - boundaryRect.top
            };
        }

        window.addEventListener('mousedown', (e) => {
            let coords = getMouseCoordinates(e);
            handlePointerInterface(coords.x, coords.y);
        });

        window.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(e.touches.length > 0) {
                const boundaryRect = canvas.getBoundingClientRect();
                let tx = e.touches[0].clientX - boundaryRect.left;
                let ty = e.touches[0].clientY - boundaryRect.top;
                handlePointerInterface(tx, ty);
            }
        }, {passive: false});

        function executeMasterFrameTick() {
            updateAndRenderCanvas();
            requestAnimationFrame(executeMasterFrameTick);
        }

        executeMasterFrameTick();
    </script>
</body>
</html>
