<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Magnetic Mission Control</title>
<style>
body{
  margin:0;
  font-family:Arial;
  text-align:center;
  background:#f2f7ff;
}
.screen{
  display:none;
  padding:20px;
}
.active{
  display:block;
}
button{
  padding:12px 18px;
  margin:8px;
  font-size:16px;
  border:none;
  border-radius:10px;
  background:#2b6cb0;
  color:white;
}
button:hover{background:#1a4f80;}
.card{
  background:white;
  padding:20px;
  margin:20px auto;
  max-width:500px;
  border-radius:15px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}
.timer{
  font-size:18px;
  color:#d9534f;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash" class="screen active">
  <img src="assets/logo.png" style="width:200px;margin-top:80px;">
  <h2>Innovine Learning</h2>
</div>

<!-- TITLE -->
<div id="title" class="screen">
  <h1>🧲 Magnetic Mission Control</h1>
  <p>Restore balance in the Arctic Magnetic Lab!</p>
  <button onclick="startGame()">Start</button>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div class="timer">Time Left: <span id="time">60</span>s</div>
  <div class="card">
    <h3 id="question"></h3>
    <div id="options"></div>
    <p id="hint" style="color:#d9534f;"></p>
  </div>
  <p>Score: <span id="score">0</span></p>
</div>

<!-- END -->
<div id="end" class="screen">
  <h1>Mission Complete 🧲</h1>
  <p id="result"></p>
  <button onclick="location.reload()">Play Again</button>
</div>

<script>

setTimeout(()=>{
  document.getElementById("splash").classList.remove("active");
  document.getElementById("title").classList.add("active");
}, 2000);

let questions = [
{q:"Which poles attract each other?",o:["N-N","S-S","N-S","Same poles"],a:2,h:"Opposite poles attract"},
{q:"Magnet attracts:",o:["Wood","Iron","Plastic","Paper"],a:1,h:"Only magnetic materials"},
{q:"Which is non-magnetic?",o:["Iron nail","Steel clip","Rubber","Pin"],a:2,h:"Check metals vs non-metals"},
{q:"Like poles:",o:["Attract","Repel","Stick","Disappear"],a:1,h:"Same poles repel"},
{q:"Strongest part of magnet is:",o:["Center","Edges","Poles","Any point"],a:2,h:"Ends are strongest"},
{q:"Magnet can attract:",o:["Glass","Iron","Paper","Wood"],a:1,h:"Think metals"},
{q:"Earth behaves like:",o:["Battery","Magnet","Stone","Light"],a:1,h:"Earth has magnetic field"},
{q:"Compass uses:",o:["Heat","Magnetism","Light","Sound"],a:1,h:"Direction finding tool"},
{q:"Magnet will NOT attract:",o:["Iron","Nickel","Plastic","Cobalt"],a:2,h:"Non-metal item"},
{q:"Opposite poles:",o:["Repel","Attract","Break","Stop"],a:1,h:"Rule of magnetism"},
{q:"Magnetic materials contain:",o:["Iron","Sugar","Water","Air"],a:0,h:"Ferromagnetic metals"},
{q:"Magnet strength is highest at:",o:["Middle","Ends","All equal","Corners"],a:1,h:"Poles"},
{q:"A magnet always has:",o:["1 pole","2 poles","3 poles","No poles"],a:1,h:"North and South"},
{q:"Which is used in fridge door?",o:["Glue","Magnet","Water","Fan"],a:1,h:"Everyday use"},
{q:"Magnet repels when:",o:["Opposite poles","Same poles","Different shape","Broken"],a:1,h:"Rule again"}
];

let current=0, score=0, attempts=0;
let time=60, timer;

function startGame(){
  document.getElementById("title").classList.remove("active");
  document.getElementById("game").classList.add("active");
  loadQ();
  timer=setInterval(()=>{
    time--;
    document.getElementById("time").innerText=time;
    if(time<=0) endGame();
  },1000);
}

function loadQ(){
  attempts=0;
  document.getElementById("hint").innerText="";
  let q=questions[current];
  document.getElementById("question").innerText=q.q;

  let opt="";
  q.o.forEach((val,i)=>{
    opt+=`<button onclick="check(${i})">${val}</button>`;
  });
  document.getElementById("options").innerHTML=opt;
}

function check(i){
  let q=questions[current];

  if(i==q.a){
    score++;
    document.getElementById("score").innerText=score;
    nextQ();
  } else {
    attempts++;
    if(attempts==2){
      document.getElementById("hint").innerText="Hint: "+q.h;
    }
  }
}

function nextQ(){
  current++;
  if(current>=questions.length){
    endGame();
  } else {
    loadQ();
  }
}

function endGame(){
  clearInterval(timer);
  document.getElementById("game").classList.remove("active");
  document.getElementById("end").classList.add("active");

  let msg="";
  if(score>=12) msg="Excellent Magnetic Engineer 🌟";
  else if(score>=8) msg="Good Work 👍";
  else if(score>=5) msg="Well Tried 🙂";
  else msg="Revise Concepts 📘";

  document.getElementById("result").innerText=
  "Score: "+score+"/15\n"+msg;
}

</script>

</body>
</html>
