<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 6 Physics: Advanced Magnetism Lab</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #labContainer {
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            border-radius: 16px;
            overflow: hidden;
            border: 4px solid #1e293b;
            background-color: #0f172a;
        }
        canvas {
            display: block;
            background-color: #0f172a;
        }
    </style>
</head>
<body>

    <div id="labContainer">
        <canvas id="physicsLabCanvas" width="950" height="650"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('physicsLabCanvas');
        const ctx = canvas.getContext('2d');

        // BRANDING ASSET PIPELINE
        const logoAsset = new Image();
        logoAsset.src = 'assets/logo.png';

        // STATE ENGINE: 'SPLASH', 'PROTOCOLS', 'LAB_ACTIVE', 'SUMMARY'
        let currentState = 'SPLASH';
        let splashStartTime = Date.now();
        const SPLASH_DURATION = 2200;

        // SESSION METRICS
        let currentQuestionIdx = 0;
        let playerScore = 0;
        let labHP = 3;
        let attemptsLeft = 2;
        let activeHint = "";
        let showHintBox = false;
        let isEvaluating = false;
        let evalTimer = 0;
        let selectedOptionIdx = -1;
        let animationTicks = 0;

        // SCENARIO DATABANK (Curriculum Mapped Puzzles)
        const curriculumScenarios = [
            {
                station: "STATION 1: DISCOVERY",
                title: "The Ancient Greece Riddle",
                prompt: "Magnes the shepherd says his iron-tipped staff is stuck to a rock by 'magic wood spirits'. How do you prove it's interacting with the metal tip?",
                options: [
                    "Touch a wooden cup to the rock to show it doesn't stick, then touch a steel blade to it.",
                    "Rub a leather strap against the rock until it sparks and catches fire.",
                    "Throw a bronze coin at the stick to knock it free from the mountain side."
                ],
                correct: 0,
                hint: "Magnets selectively attract certain materials like iron and steel, completely ignoring wood, leather, or bronze.",
                accent: "#3b82f6"
            },
            {
                station: "STATION 2: IDENTIFICATION",
                title: "The Anonymous Bar Dilemma",
                prompt: "You have two identical grey metal bars. One is a true permanent magnet, and the other is just plain unmagnetized iron. How do you find out which is which?",
                options: [
                    "Scratch them together violently to see which one leaves a darker mark.",
                    "Suspend each freely by a string; the true magnet will rotate to align North-South.",
                    "Drop both into a bucket of water; the non-magnet will float instantly."
                ],
                correct: 1,
                hint: "A freely suspended magnet has a directive property that always forces it to align along Earth's North-South axis.",
                accent: "#a855f7"
            },
            {
                station: "STATION 3: ELECTROMAGNETISM",
                title: "Scrapyard Crane Design",
                prompt: "You are designing a crane to lift heavy iron scrap from piles of wood and glass, then drop it cleanly onto a truck. What is best?",
                options: [
                    "A massive permanent bar magnet wrapped in thick layers of defensive soft rubber sheets.",
                    "An electromagnet, because you can flip its electric current switch on to pick up and off to drop items.",
                    "An artificial horseshoe magnet heated to extreme temperatures to maximize its pull power."
                ],
                correct: 1,
                hint: "Electromagnets only hold magnetic properties while an active electric current runs through their coiled circuit wire.",
                accent: "#10b981"
            },
            {
                station: "STATION 4: GEOPHYSICS",
                title: "The Broken Compass Conundrum",
                prompt: "A compass needle's North pole points toward Earth's geographic North Pole. Since opposite poles attract, what is actually hiding there?",
                options: [
                    "The geographic Arctic region acts as Earth's deep internal magnetic South Pole.",
                    "A massive mountain of pure natural magnetite pulling all North markers away.",
                    "Earth's geographic North Pole contains a giant electrical coil spinning backward."
                ],
                correct: 0,
                hint: "The Earth operates like a massive bar magnet. Its magnetic South pole sits near the geographic North Pole.",
                accent: "#f59e0b"
            },
            {
                station: "STATION 5: FIELD STRENGTH",
                title: "The Crime Scene Investigation",
                prompt: "A student single-strokes a nail to magnetize it, but accidentally snaps it in half. What happens to the broken pieces?",
                options: [
                    "One piece holds 100% North and the other holds 100% South magnetism.",
                    "Both pieces instantly lose all magnetic strength and turn back into normal nails.",
                    "Each piece becomes a complete individual magnet with its own North and South pole."
                ],
                correct: 2,
                hint: "Magnetic poles can never be isolated. Snapping a magnet simply yields two smaller, complete functional magnets.",
                accent: "#ec4899"
            },
            {
                station: "STATION 6: DEMAGNETIZATION",
                title: "The Lab Repair Ward",
                prompt: "The school's magnets have grown weak because students dropped them, put them on radiators, and tossed them loosely. How do you store them?",
                options: [
                    "Keep them loosely floating inside cold water containers away from light.",
                    "Store them in pairs with opposite poles facing, using wooden insulation spacers and soft iron keepers.",
                    "Stack them all in a continuous line with identical poles tightly clamped together."
                ],
                correct: 1,
                hint: "To avoid self-demagnetization, store bar magnets in pairs facing opposite directions with keepers across their open poles.",
                accent: "#ef4444"
            }
        ];

        // AUDIO ENGINE (Web Audio API)
        const AudioSynth = {
            ctx: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },
            playClick() {
                this.init();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.frequency.setValueAtTime(580, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.06);
            },
            playSuccess() {
                this.init();
                let osc1 = this.ctx.createOscillator();
                let osc2 = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc1.frequency.setValueAtTime(523.25, this.ctx.currentTime);
                osc2.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
                osc1.connect(gain); osc2.connect(gain); gain.connect(this.ctx.destination);
                osc1.start(); osc2.start(); osc1.stop(this.ctx.currentTime + 0.4); osc2.stop(this.ctx.currentTime + 0.4);
            },
            playError() {
                this.init();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(130, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.35);
            }
        };

        function resetSimulation() {
            currentQuestionIdx = 0;
            playerScore = 0;
            labHP = 3;
            prepareNextStation();
        }

        function prepareNextStation() {
            attemptsLeft = 2;
            showHintBox = false;
            selectedOptionIdx = -1;
            isEvaluating = false;
            if (currentQuestionIdx < curriculumScenarios.length) {
                activeHint = curriculumScenarios[currentQuestionIdx].hint;
            }
        }

        function drawBrandingLogo(x, y, sz) {
            if (logoAsset.complete && logoAsset.naturalWidth !== 0) {
                ctx.drawImage(logoAsset, x - sz/2, y - sz/2, sz, sz);
            } else {
                ctx.fillStyle = '#3b82f6';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('[LAB LOGO]', x, y);
            }
        }

        function drawInterface() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            animationTicks++;

            if (currentState === 'SPLASH') {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                drawBrandingLogo(canvas.width / 2, canvas.height / 2 - 40, 160);

                ctx.fillStyle = '#0f172a';
                ctx.font = 'bold 42px sans-serif';
                ctx.letterSpacing = "4px";
                ctx.textAlign = 'center';
                ctx.fillText('INNOVINE LABS', canvas.width / 2, canvas.height / 2 + 90);
                
                ctx.letterSpacing = "0px";
                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText('CURRICULUM PHYSICS EMULATOR • GRADE 6', canvas.width / 2, canvas.height / 2 + 130);

                if (Date.now() - splashStartTime > SPLASH_DURATION) {
                    currentState = 'PROTOCOLS';
                }

            } else if (currentState === 'PROTOCOLS') {
                // BRIEFING FRAME
                ctx.fillStyle = '#090d16';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 32px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('MISSION BRIEFING: MAGNETISM MATRIX', canvas.width / 2, 100);

                ctx.fillStyle = '#64748b';
                ctx.font = '600 14px sans-serif';
                ctx.fillText('APPLIED CONCEPT CHALLENGE SERIE', canvas.width / 2, 135);

                // Protocol Box
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(100, 180, 750, 260);
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 2;
                ctx.strokeRect(100, 180, 750, 260);

                ctx.textAlign = 'left';
                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('LAB PROCEDURES:', 140, 225);

                ctx.fillStyle = '#cbd5e1';
                ctx.font = '15px sans-serif';
                ctx.fillText('• Do not memorize rules—apply diagnostic logic to critical field issues.', 140, 260);
                ctx.fillText('• Analyze scenarios across 6 specialized lab simulation workstations.', 140, 295);
                ctx.fillText('• Failed calibrations unlock physical hint structures from your science syllabus.', 140, 330);
                ctx.fillText('• Safe limits: Maintain system health integrity above critical zero levels.', 140, 365);

                // Button
                ctx.fillStyle = '#10b981';
                ctx.fillRect(325, 490, 300, 50);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('INITIALIZE DIAGNOSTICS', canvas.width / 2, 521);

            } else if (currentState === 'LAB_ACTIVE') {
                const data = curriculumScenarios[currentQuestionIdx];

                // HUD Panel
                ctx.fillStyle = '#090d16';
                ctx.fillRect(0, 0, canvas.width, 70);
                ctx.strokeStyle = '#1e293b';
                ctx.strokeRect(0, 0, canvas.width, 70);

                drawBrandingLogo(50, 35, 42);

                ctx.textAlign = 'left';
                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('INNOVINE PHYSICS LAB', 90, 41);

                ctx.fillStyle = '#38bdf8';
                ctx.fillText(`STATION: ${currentQuestionIdx + 1} / 6`, 320, 41);
                ctx.fillStyle = '#10b981';
                ctx.fillText(`ACCURACY: ${playerScore} PTS`, 500, 41);
                ctx.fillStyle = '#ef4444';
                ctx.fillText(`LAB HP: ${labHP}`, 680, 41);

                // Workbench Display
                ctx.fillStyle = '#111827';
                ctx.fillRect(40, 95, 870, 520);
                ctx.strokeStyle = '#1e293b';
                ctx.strokeRect(40, 95, 870, 520);

                // Terminal header strip
                ctx.fillStyle = data.accent;
                ctx.fillRect(40, 95, 870, 40);
                
                ctx.fillStyle = '#000000';
                ctx.globalAlpha = 0.2;
                ctx.fillRect(40, 95, 870, 40);
                ctx.globalAlpha = 1.0;

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 15px sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(`${data.station} : ${data.title}`, 60, 121);

                // Prompt Question Box
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(70, 160, 810, 85);
                ctx.strokeStyle = '#334155';
                ctx.strokeRect(70, 160, 810, 85);

                ctx.fillStyle = '#facc15';
                ctx.font = '600 15px sans-serif';
                ctx.textAlign = 'center';
                wrapText(data.prompt, canvas.width / 2, 195, 760, 22);

                // Decorative Interactive Field Waves if checking answer
                if (isEvaluating) {
                    evalTimer++;
                    ctx.save();
                    ctx.translate(canvas.width/2, 290);
                    ctx.lineWidth = 2;
                    let correctColor = (selectedOptionIdx === data.correct) ? 'rgba(16,185,129,' : 'rgba(239,68,68,';
                    for(let i=1; i<=4; i++) {
                        ctx.strokeStyle = `${correctColor}${0.6 - (i*0.13)})`;
                        let rx = 100 + i*25 + Math.sin(animationTicks*0.2)*8;
                        let ry = 25 + i*8;
                        ctx.beginPath();
                        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI*2);
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                // Draw Answer Options
                data.options.forEach((opt, idx) => {
                    let boxY = 310 + (idx * 75);
                    let isHovered = false; // standard initialization

                    if (selectedOptionIdx === idx) {
                        ctx.fillStyle = isEvaluating ? ((data.correct === idx) ? '#065f46' : '#991b1b') : '#1e3a8a';
                        ctx.strokeStyle = isEvaluating ? ((data.correct === idx) ? '#10b981' : '#ef4444') : '#3b82f6';
                        ctx.lineWidth = 3;
                    } else {
                        ctx.fillStyle = '#1f2937';
                        ctx.strokeStyle = '#374151';
                        ctx.lineWidth = 1.5;
                    }

                    ctx.fillRect(70, boxY, 810, 60);
                    ctx.strokeRect(70, boxY, 810, 60);

                    // Radio Node indicator
                    ctx.fillStyle = selectedOptionIdx === idx ? (isEvaluating ? ((data.correct === idx) ? '#10b981' : '#ef4444') : '#3b82f6') : '#4b5563';
                    ctx.beginPath();
                    ctx.arc(105, boxY + 30, 10, 0, Math.PI*2);
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '600 14px sans-serif';
                    ctx.textAlign = 'left';
                    wrapText(opt, 135, boxY + 35, 720, 18);
                });

                // Bottom Hint scaffold layout
                if (showHintBox) {
                    ctx.fillStyle = '#2d1a10';
                    ctx.fillRect(70, 545, 810, 45);
                    ctx.strokeStyle = '#d97706';
                    ctx.strokeRect(70, 545, 810, 45);

                    ctx.fillStyle = '#f59e0b';
                    ctx.font = 'italic 13.5px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`LAB SCAFFOLD ADVICE: ${activeHint}`, canvas.width / 2, 572);
                }

            } else if (currentState === 'SUMMARY') {
                ctx.fillStyle = '#05070c';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let isPass = (labHP > 0 && playerScore >= 4);

                ctx.fillStyle = isPass ? '#10b981' : '#ef4444';
                ctx.font = 'bold 36px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(isPass ? 'DIAGNOSTIC MATRIX SUCCEEDED' : 'LAB CERTIFICATION INCOMPLETE', canvas.width / 2, 200);

                ctx.fillStyle = '#ffffff';
                ctx.font = '20px sans-serif';
                ctx.fillText(`Your Final Performance Score: ${playerScore} / 6 Systems Correct`, canvas.width / 2, 275);

                ctx.fillStyle = '#94a3b8';
                ctx.font = '15px sans-serif';
                if (isPass) {
                    ctx.fillText('Excellent tracking! You applied core principles of fields, induction, and safety storage structures cleanly.', canvas.width / 2, 335);
                } else {
                    ctx.fillText('System properties dropped below threshold limits. Review permanent vs temporary configurations and try again.', canvas.width / 2, 335);
                }

                // Action Area
                ctx.fillStyle = '#2563eb';
                ctx.fillRect(375, 420, 200, 50);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 15px sans-serif';
                ctx.fillText('RESTART RUN', canvas.width / 2, 451);
            }
        }

        // TEXT HELPER UTILITY FOR COMPACT WRAPPING
        function wrapText(text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            let currentY = y;

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    ctx.fillText(line, x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, currentY);
        }

        function processInteraction(pX, pY) {
            if (currentState === 'PROTOCOLS') {
                if (pX >= 325 && pX <= 625 && pY >= 490 && pY <= 540) {
                    AudioSynth.playClick();
                    resetSimulation();
                    currentState = 'LAB_ACTIVE';
                }
            } else if (currentState === 'LAB_ACTIVE') {
                if (isEvaluating) return; // ignore inputs during wave lock animations

                // Check Options Boxes selection boundaries
                for (let i = 0; i < 3; i++) {
                    let boxY = 310 + (i * 75);
                    if (pX >= 70 && pX <= 880 && pY >= boxY && pY <= boxY + 60) {
                        selectedOptionIdx = i;
                        AudioSynth.playClick();
                        triggerEvaluation();
                        break;
                    }
                }
            } else if (currentState === 'SUMMARY') {
                if (pX >= 375 && pX <= 575 && pY >= 420 && pY <= 470) {
                    AudioSynth.playClick();
                    resetSimulation();
                    currentState = 'LAB_ACTIVE';
                }
            }
        }

        function triggerEvaluation() {
            isEvaluating = true;
            let data = curriculumScenarios[currentQuestionIdx];

            if (selectedOptionIdx === data.correct) {
                AudioSynth.playSuccess();
                playerScore++;
                setTimeout(() => {
                    currentQuestionIdx++;
                    if (currentQuestionIdx >= curriculumScenarios.length) {
                        currentState = 'SUMMARY';
                    } else {
                        prepareNextStation();
                    }
                }, 2000);
            } else {
                AudioSynth.playError();
                labHP--;
                attemptsLeft--;
                setTimeout(() => {
                    if (labHP <= 0) {
                        currentState = 'SUMMARY';
                    } else {
                        isEvaluating = false;
                        if (attemptsLeft <= 0) {
                            showHintBox = true;
                        }
                        selectedOptionIdx = -1; // let them try alternative selection again
                    }
                }, 1800);
            }
        }

        // LISTENER REGISTRATION PIPELINE
        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        window.addEventListener('mousedown', (e) => {
            let coords = getCanvasCoordinates(e);
            processInteraction(coords.x, coords.y);
        });

        window.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(e.touches.length > 0) {
                let coords = getCanvasCoordinates(e.touches[0]);
                processInteraction(coords.x, coords.y);
            }
        }, {passive: false});

        function masterLoop() {
            drawInterface();
            requestAnimationFrame(masterLoop);
        }

        masterLoop();
    </script>
</body>
</html>
