<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Secret World of Magnets</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0c0f1d;
            color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #labContainer {
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #1e293b;
            background-color: #0f172a;
        }
        canvas {
            display: block;
            background-color: #0f172a;
        }
    </style>
</head>
<body>

    <div id="labContainer">
        <canvas id="magnetAdventureCanvas" width="950" height="650"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('magnetAdventureCanvas');
        const ctx = canvas.getContext('2d');

        // BRANDING ASSET PIPELINE
        const logoAsset = new Image();
        logoAsset.src = 'assets/logo.png';

        // STATE ENGINE: 'SPLASH', 'STORY_INTRO', 'ADVENTURE_ACTIVE', 'VICTORY_SCREEN'
        let currentState = 'SPLASH';
        let splashStartTime = Date.now();
        const SPLASH_DURATION = 5000; // EXACTLY 5 SECONDS LOCKED SPLASH

        // ADVENTURE TRACKERS
        let adventureStepIdx = 0;
        let starTokens = 0;
        let healthHearts = 3;
        let attemptsLeft = 2;
        let adviceTip = "";
        let showAdvice = false;
        let runningActionAnimation = false;
        let animTimer = 0;
        let chosenActionIdx = -1;
        let loopTicks = 0;

        // ADVENTURE QUESTS (Designed for 6th grade curiosity)
        const adventureQuests = [
            {
                title: "Quest 1: The Mountain Riddle",
                story: "Magnes the Greek shepherd is terrified! His wooden staff with a sharp iron tip is stuck tight to a massive black rock. He screams that an invisible forest giant is holding his staff! How do you prove it's just the rock drawing in the metal tip?",
                tools: [
                    "Touch a wooden bowl to the rock to show it doesn't stick, then touch a steel sword to it.",
                    "Rub a leather belt against the rock until it gets hot to try and spark a campfire.",
                    "Throw a heavy bronze coin directly at his hand to break his grip."
                ],
                winningIdx: 0,
                clue: "Natural magnetic rocks like Magnetite will selectively grab iron and steel, but completely ignore wood, leather, or bronze!",
                color: "#3b82f6"
            },
            {
                title: "Quest 2: The Blank Metal Boxes",
                story: "A merchant gives you two shiny grey metal blocks that look exactly identical. One is a magic permanent magnet, but the other is just an ordinary chunk of plain iron. How can you find the real magnet using nothing else?",
                tools: [
                    "Scratch them together as hard as you can to see which one creates darker dust.",
                    "Tie a string to the center of each and hang them from a branch; the real magnet will rotate until it points North-South.",
                    "Drop both into a bucket of water; the regular iron block will float instantly."
                ],
                winningIdx: 1,
                clue: "When left free to hang and spin, every real magnet has a directive compass power that makes it face Earth's North and South poles!",
                color: "#a855f7"
            },
            {
                title: "Quest 3: The Scrapyard Giant",
                story: "You are piloting a giant construction crane! Your job is to pick up heavy iron beams from a messy pile of smashed glass and wood, carry them across the yard, and drop them perfectly inside a delivery truck. What tool do you attach to the crane hook?",
                tools: [
                    "A massive permanent bar magnet wrapped safely in thick, protective soft rubber layers.",
                    "An electromagnet, because flipping its power switch instantly turns the magnetism ON to pick up and OFF to drop.",
                    "A natural horseshoe lodestone that has been heated over a blazing furnace fire to make it super strong."
                ],
                winningIdx: 1,
                clue: "Electromagnets are temporary! They only pull objects when an electric current is flowing through their wire coils.",
                color: "#10b981"
            },
            {
                title: "Quest 4: The Reverse Compass Mystery",
                story: "You are navigating through a dense jungle. Your compass needle's bright red North tip points perfectly toward Earth's geographic North Pole. But wait... since opposite poles attract each other, what magnetic pole is actually hiding beneath the Arctic ice?",
                tools: [
                    "The geographic Arctic region secretly acts as Earth's deep internal magnetic South Pole.",
                    "A massive underground mountain of solid magnetic ore that drags all red markers toward it.",
                    "A giant whirlpool of electrical current spinning backward inside the ocean floor."
                ],
                winningIdx: 0,
                clue: "Our Earth behaves like one giant hidden magnet, but its internal magnetic poles are flipped upside down compared to our maps!",
                color: "#f59e0b"
            },
            {
                title: "Quest 5: The Broken Toy Trap",
                story: "You carefully magnetize an ordinary steel nail by rubbing a bar magnet over it 50 times in one direction. But while celebrating, you accidentally step on the nail and snap it cleanly in half! What happened to the broken pieces?",
                tools: [
                    "One piece now holds 100% of the North magnetism and the other holds 100% of the South magnetism.",
                    "Both broken pieces instantly lose all power and turn back into regular old junk steel nails.",
                    "Each separate broken piece becomes its own individual, perfect magnet with a fresh North and South pole."
                ],
                winningIdx: 2,
                clue: "Magnetic poles are inseparable couples! No matter how many times you chop a magnet, every piece gets its own North and South ends.",
                color: "#ec4899"
            },
            {
                title: "Quest 6: The Magnet Doctor's Safe",
                story: "The school lab magnets are losing their strength because students keep dropping them on the floor, leaving them on burning hot radiators, or tossing them messy into bins. How should you store them to protect their power?",
                tools: [
                    "Keep them floating loosely in a glass jar filled with ice-cold mountain water.",
                    "Store them in pairs facing opposite ways, with wooden blocks in between them and soft iron bars across their ends.",
                    "Stack them tightly in a long, straight line with all identical poles clamped hard against each other."
                ],
                winningIdx: 1,
                clue: "To stop magnets from destroying their own fields (self-demagnetization), store them in opposite pairs using wooden spacers and iron keepers!",
                color: "#ef4444"
            }
        ];

        // AUDIO GENERATION CHIPS
        const AudioSynth = {
            ctx: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },
            playBlip() {
                this.init();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.05);
            },
            playSpark() {
                this.init();
                let osc1 = this.ctx.createOscillator();
                let osc2 = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc1.frequency.setValueAtTime(523, this.ctx.currentTime);
                osc2.frequency.setValueAtTime(659, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
                osc1.connect(gain); osc2.connect(gain); gain.connect(this.ctx.destination);
                osc1.start(); osc2.start(); osc1.stop(this.ctx.currentTime + 0.35); osc2.stop(this.ctx.currentTime + 0.35);
            },
            playThud() {
                this.init();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.3);
            }
        };

        function resetAdventure() {
            adventureStepIdx = 0;
            starTokens = 0;
            healthHearts = 3;
            loadNewQuest();
        }

        function loadNewQuest() {
            attemptsLeft = 2;
            showAdvice = false;
            chosenActionIdx = -1;
            runningActionAnimation = false;
            if (adventureStepIdx < adventureQuests.length) {
                adviceTip = adventureQuests[adventureStepIdx].clue;
            }
        }

        function drawBranding(x, y, size) {
            if (logoAsset.complete && logoAsset.naturalWidth !== 0) {
                ctx.drawImage(logoAsset, x - size/2, y - size/2, size, size);
            } else {
                ctx.fillStyle = '#2563eb';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('[INNOVINE]', x, y);
            }
        }

        function drawMainGameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            loopTicks++;

            if (currentState === 'SPLASH') {
                // Background fills white purely for logo asset focus separation
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                drawBranding(canvas.width / 2, canvas.height / 2 - 40, 160);

                ctx.fillStyle = '#0f172a';
                ctx.font = 'bold 44px sans-serif';
                ctx.letterSpacing = "4px";
                ctx.textAlign = 'center';
                ctx.fillText('INNOVINE', canvas.width / 2, canvas.height / 2 + 90);
                
                ctx.letterSpacing = "0px";
                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 13px sans-serif';
                ctx.fillText('INTERACTIVE PHYSICS MODULES', canvas.width / 2, canvas.height / 2 + 130);

                // EXACTLY 5 SECONDS CHECK
                if (Date.now() - splashStartTime > SPLASH_DURATION) {
                    currentState = 'STORY_INTRO';
                }

            } else if (currentState === 'STORY_INTRO') {
                ctx.fillStyle = '#090d16';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 36px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('THE SECRET WORLD OF MAGNETS!', canvas.width / 2, 120);

                ctx.fillStyle = '#475569';
                ctx.font = '600 14px sans-serif';
                ctx.fillText('AN INTERACTIVE LAB ADVENTURE', canvas.width / 2, 155);

                // Scroll box
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(120, 200, 710, 240);
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 2;
                ctx.strokeRect(120, 200, 710, 240);

                ctx.textAlign = 'left';
                ctx.fillStyle = '#f1f5f9';
                ctx.font = '16px sans-serif';
                wrapText("Welcome, young scientist! Magnets aren't magical stones—they operate on strict laws of force, materials, and fields.", 160, 245, 630, 24);
                wrapText("You are going on a quest to solve 6 practical problems around fields, compasses, electromagnets, and proper care.", 160, 295, 630, 24);
                wrapText("Look at the items on your workbench, think about how magnetic forces act, and choose the right option to fix the issue!", 160, 345, 630, 24);

                // Start button
                ctx.fillStyle = '#10b981';
                ctx.fillRect(345, 490, 260, 50);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('START ADVENTURE', canvas.width / 2, 521);

            } else if (currentState === 'ADVENTURE_ACTIVE') {
                const quest = adventureQuests[adventureStepIdx];

                // Top Dashboard Line
                ctx.fillStyle = '#060913';
                ctx.fillRect(0, 0, canvas.width, 65);
                ctx.strokeStyle = '#1e293b';
                ctx.strokeRect(0, 0, canvas.width, 65);

                // Small corner logo
                drawBranding(45, 32, 36);

                ctx.textAlign = 'left';
                ctx.fillStyle = '#94a3b8';
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText('INNOVINE ADVENTURE LAB', 75, 37);

                ctx.fillStyle = '#6366f1';
                ctx.fillText(`PROGRESS: ${adventureStepIdx + 1}/6`, 310, 37);
                ctx.fillStyle = '#facc15';
                ctx.fillText(`⭐ TOKENS: ${starTokens}`, 490, 37);
                ctx.fillStyle = '#ef4444';
                ctx.fillText(`❤️ SHIELD HP: ${healthHearts}`, 650, 37);

                // Interactive Board Layout
                ctx.fillStyle = '#111827';
                ctx.fillRect(30, 85, 890, 540);
                ctx.strokeStyle = '#1e293b';
                ctx.strokeRect(30, 85, 890, 540);

                // Colored Banner header
                ctx.fillStyle = quest.color;
                ctx.fillRect(30, 85, 890, 42);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(quest.title, 50, 112);

                // Narrative Scenario Box
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(55, 145, 840, 105);
                ctx.strokeStyle = '#334155';
                ctx.strokeRect(55, 145, 840, 105);

                ctx.fillStyle = '#f8fafc';
                ctx.font = '15px sans-serif';
                ctx.textAlign = 'center';
                wrapText(quest.story, canvas.width / 2, 178, 790, 22);

                // Magnetic Ripple Animation
                if (runningActionAnimation) {
                    animTimer++;
                    ctx.save();
                    ctx.translate(canvas.width / 2, 280);
                    ctx.lineWidth = 2.5;
                    let fxColor = (chosenActionIdx === quest.winningIdx) ? 'rgba(16,185,129,' : 'rgba(239,68,68,';
                    for (let x = 1; x <= 4; x++) {
                        ctx.strokeStyle = `${fxColor}${0.6 - (x * 0.12)})`;
                        let rx = 120 + x * 30 + Math.sin(loopTicks * 0.2) * 10;
                        let ry = 20 + x * 6;
                        ctx.beginPath();
                        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                // Interactive Tool/Action Cards on the Workbench
                ctx.textAlign = 'left';
                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 12px sans-serif';
                ctx.fillText("CHOOSE YOUR PHYSICAL LAB ACTION:", 60, 285);

                quest.tools.forEach((toolText, idx) => {
                    let cardY = 300 + (idx * 75);

                    if (chosenActionIdx === idx) {
                        ctx.fillStyle = runningActionAnimation ? ((quest.winningIdx === idx) ? '#065f46' : '#881337') : '#1e3a8a';
                        ctx.strokeStyle = runningActionAnimation ? ((quest.winningIdx === idx) ? '#10b981' : '#f43f5e') : '#3b82f6';
                        ctx.lineWidth = 3;
                    } else {
                        ctx.fillStyle = '#1f2937';
                        ctx.strokeStyle = '#374151';
                        ctx.lineWidth = 1.5;
                    }

                    ctx.fillRect(55, cardY, 840, 60);
                    ctx.strokeRect(55, cardY, 840, 60);

                    // Decorative tool chip icon box
                    ctx.fillStyle = chosenActionIdx === idx ? '#3b82f6' : '#4b5563';
                    ctx.fillRect(75, cardY + 15, 30, 30);
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(String.fromCharCode(65 + idx), 90, cardY + 34);

                    // Option text layout
                    ctx.fillStyle = '#f1f5f9';
                    ctx.font = '600 14.5px sans-serif';
                    ctx.textAlign = 'left';
                    wrapText(toolText, 125, cardY + 35, 740, 18);
                });

                // Wisdom Scaffold Box
                if (showAdvice) {
                    ctx.fillStyle = '#2a1a08';
                    ctx.fillRect(55, 535, 840, 45);
                    ctx.strokeStyle = '#b45309';
                    ctx.strokeRect(55, 535, 840, 45);

                    ctx.fillStyle = '#fbbf24';
                    ctx.font = 'italic 13px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`FIELD GUIDE CLUE: ${adviceTip}`, canvas.width / 2, 562);
                }

            } else if (currentState === 'VICTORY_SCREEN') {
                ctx.fillStyle = '#05070a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let didWinAll = (healthHearts > 0 && starTokens >= 4);

                ctx.fillStyle = didWinAll ? '#10b981' : '#ef4444';
                ctx.font = 'bold 36px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(didWinAll ? 'QUEST RUN SUCCESSFUL!' : 'MISSION OVER: RE-CALIBRATION NEEDED', canvas.width / 2, 210);

                ctx.fillStyle = '#ffffff';
                ctx.font = '20px sans-serif';
                ctx.fillText(`Tokens Found: ${starTokens} / 6 Star Badges`, canvas.width / 2, 280);

                ctx.fillStyle = '#94a3b8';
                ctx.font = '15px sans-serif';
                if (didWinAll) {
                    ctx.fillText('Fantastic work! You know exactly how magnetic properties behave, turn on/off, and how to protect them.', canvas.width / 2, 340);
                } else {
                    ctx.fillText('Your shield energy drained. Re-read the physical properties of fields and metals to try again.', canvas.width / 2, 340);
                }

                // Action box
                ctx.fillStyle = '#3b82f6';
                ctx.fillRect(385, 420, 180, 50);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 15px sans-serif';
                ctx.fillText('PLAY AGAIN', canvas.width / 2, 451);
            }
        }

        // SCENARIO WRAPPING CALCULATOR
        function wrapText(text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            let currentY = y;

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    ctx.fillText(line, x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, currentY);
        }

        function clickController(pX, pY) {
            if (currentState === 'STORY_INTRO') {
                if (pX >= 345 && pX <= 605 && pY >= 490 && pY <= 540) {
                    AudioSynth.playBlip();
                    resetAdventure();
                    currentState = 'ADVENTURE_ACTIVE';
                }
            } else if (currentState === 'ADVENTURE_ACTIVE') {
                if (runningActionAnimation) return; // freeze updates during wave bursts

                // Check which action block was selected on workbench
                for (let i = 0; i < 3; i++) {
                    let cardY = 300 + (i * 75);
                    if (pX >= 55 && pX <= 895 && pY >= cardY && pY <= cardY + 60) {
                        chosenActionIdx = i;
                        AudioSynth.playBlip();
                        evaluateActionChoice();
                        break;
                    }
                }
            } else if (currentState === 'VICTORY_SCREEN') {
                if (pX >= 385 && pX <= 565 && pY >= 420 && pY <= 470) {
                    AudioSynth.playBlip();
                    resetAdventure();
                    currentState = 'ADVENTURE_ACTIVE';
                }
            }
        }

        function evaluateActionChoice() {
            runningActionAnimation = true;
            let quest = adventureQuests[adventureStepIdx];

            if (chosenActionIdx === quest.winningIdx) {
                AudioSynth.playSpark();
                starTokens++;
                setTimeout(() => {
                    adventureStepIdx++;
                    if (adventureStepIdx >= adventureQuests.length) {
                        currentState = 'VICTORY_SCREEN';
                    } else {
                        loadNewQuest();
                    }
                }, 2000);
            } else {
                AudioSynth.playThud();
                healthHearts--;
                attemptsLeft--;
                setTimeout(() => {
                    if (healthHearts <= 0) {
                        currentState = 'VICTORY_SCREEN';
                    } else {
                        runningActionAnimation = false;
                        if (attemptsLeft <= 0) {
                            showAdvice = true;
                        }
                        chosenActionIdx = -1; // let them grab another item from the desk
                    }
                }, 1800);
            }
        }

        // VIEWPORT COORD SCALERS
        function fetchInteractionCoords(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        window.addEventListener('mousedown', (e) => {
            let coords = fetchInteractionCoords(e);
            clickController(coords.x, coords.y);
        });

        window.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) {
                let coords = fetchInteractionCoords(e.touches[0]);
                clickController(coords.x, coords.y);
            }
        }, {passive: false});

        function engineFrameTick() {
            drawMainGameLoop();
            requestAnimationFrame(engineFrameTick);
        }

        engineFrameTick();
    </script>
</body>
</html>
