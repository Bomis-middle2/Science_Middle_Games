<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 6 Physics: Magnetism & Force Field</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070c;
            color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #labContainer {
            position: relative;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
            border-radius: 16px;
            overflow: hidden;
            border: 4px solid #1e293b;
            background-color: #111827;
        }
        canvas {
            display: block;
            background-color: #111827;
        }
    </style>
</head>
<body>

    <div id="labContainer">
        <canvas id="magnetismCanvas" width="900" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('magnetismCanvas');
        const ctx = canvas.getContext('2d');

        // STATE ENGINE: 'SPLASH', 'INSTRUCTIONS', 'PLAYING', 'GAME_OVER'
        let currentState = 'SPLASH';
        let splashStartTime = Date.now();
        const SPLASH_LOCK_DURATION = 5000; // Mandatory 5 Seconds Lock

        // Session Game Metrics
        let activeTasks = [];
        let currentTaskIndex = 0;
        let score = 0;
        let healthPoints = 3; 
        let attemptsLeft = 2;
        let displayHintBanner = false;
        let currentInstanceHint = "";
        let choiceCards = [];
        let selectedObject = null;
        let animationTicks = 0;

        // Interaction Zones
        const laboratoryDropZone = { x: 380, y: 340, width: 140, height: 60, occupiedBy: null };
        const testTriggerButton = { x: 365, y: 460, width: 170, height: 44, isActivated: false };

        // Programmatic Web Audio Synthesis Engine
        const AudioSynth = {
            audioCtx: null,
            init() {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }
            },
            playTap() {
                this.init();
                let osc = this.audioCtx.createOscillator();
                let gain = this.audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(620, this.audioCtx.currentTime);
                gain.gain.setValueAtTime(0.06, this.audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.07);
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);
                osc.start();
                osc.stop(this.audioCtx.currentTime + 0.07);
            },
            playBuzzer() {
                this.init();
                let osc = this.audioCtx.createOscillator();
                let gain = this.audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, this.audioCtx.currentTime);
                gain.gain.setValueAtTime(0.25, this.audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);
                osc.start();
                osc.stop(this.audioCtx.currentTime + 0.4);
            },
            playChime() {
                this.init();
                let osc1 = this.audioCtx.createOscillator();
                let gain1 = this.audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, this.audioCtx.currentTime); // C5
                gain1.gain.setValueAtTime(0.12, this.audioCtx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.3);
                osc1.connect(gain1);
                gain1.connect(this.audioCtx.destination);
                osc1.start();
                osc1.stop(this.audioCtx.currentTime + 0.3);

                let osc2 = this.audioCtx.createOscillator();
                let gain2 = this.audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(659.25, this.audioCtx.currentTime + 0.1); // E5
                gain2.gain.setValueAtTime(0.12, this.audioCtx.currentTime + 0.1);
                gain2.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.4);
                osc2.connect(gain2);
                gain2.connect(this.audioCtx.destination);
                osc2.start();
                osc2.stop(this.audioCtx.currentTime + 0.4);

                this.triggerApplauseClap();
            },
            triggerApplauseClap() {
                try {
                    let bufSize = this.audioCtx.sampleRate * 0.3;
                    let buffer = this.audioCtx.createBuffer(1, bufSize, this.audioCtx.sampleRate);
                    let data = buffer.getChannelData(0);
                    for (let i = 0; i < bufSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    for (let c = 0; c < 3; c++) {
                        let src = this.audioCtx.createBufferSource();
                        src.buffer = buffer;
                        let filter = this.audioCtx.createBiquadFilter();
                        filter.type = 'bandpass';
                        filter.frequency.value = 1100 + (c * 80);
                        let gainNode = this.audioCtx.createGain();
                        let dTime = this.audioCtx.currentTime + (c * 0.1);
                        gainNode.gain.setValueAtTime(0.05, dTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.001, dTime + 0.2);
                        src.connect(filter);
                        filter.connect(gainNode);
                        gainNode.connect(this.audioCtx.destination);
                        src.start(dTime);
                    }
                } catch(e) {}
            }
        };

        // Grade 6 Physics Application Database Layer (12 Items Pool)
        const magnetismQuestionPool = [
            { id: "Q1", name: "Iron Casing Nail", type: "Magnetic Material", isCorrectGroup: true, hexColor: "#64748b", prompt: "Identify a reliable magnetic material to safely secure structural iron bracket fixtures.", hint: "Iron, Cobalt, and Nickel are classic magnetic substances strongly attracted to magnets." },
            { id: "Q2", name: "Brass Key Ring", type: "Non-Magnetic Material", isCorrectGroup: false, hexColor: "#eab308", prompt: "Select a component that will NOT be attracted when mapping out a copper-alloy security casing.", hint: "Brass and copper are non-ferrous metals and do not display magnetic tracking properties." },
            { id: "Q3", name: "Aluminium Can Lip", type: "Non-Magnetic Material", isCorrectGroup: false, hexColor: "#94a3b8", prompt: "Isolate a non-magnetic sorting item away from automated electromagnetic separating belts.", hint: "Aluminium handles properties as a non-magnetic metal that ignores static magnetic lines." },
            { id: "Q4", name: "Pure Cobalt Rod", type: "Magnetic Material", isCorrectGroup: true, hexColor: "#3b82f6", prompt: "Find a core transition metal suitable for forging strong industrial permanent alloy magnets.", hint: "Cobalt is ferromagnetic, making it vital for engineering powerful permanent magnet cores." },
            { id: "Q5", name: "South Pole Base", type: "Opposite Attraction", isCorrectGroup: true, hexColor: "#dc2626", prompt: "Determine what face must point toward a North Pole marker to trigger a strong attractive pull.", hint: "Unlike magnetic poles (North and South) generate attractive forces that draw them together." },
            { id: "Q6", name: "North Pole Bracket", type: "Like Repulsion", isCorrectGroup: false, hexColor: "#334155", prompt: "Predict which pole placement causes a magnetic lever arm to push away from an active North Pole terminal.", hint: "Like magnetic poles (North and North, or South and South) generate repulsive forces that push apart." },
            { id: "Q7", name: "Soft Rubber Block", type: "Non-Magnetic Material", isCorrectGroup: false, hexColor: "#db2777", prompt: "Identify a flexible shielding material completely transparent to field lines and un-attracted.", hint: "Rubber lacks aligned atomic magnetic dipoles and is completely non-magnetic." },
            { id: "Q8", name: "Steel Safety Pin", type: "Magnetic Material", isCorrectGroup: true, hexColor: "#cbd5e1", prompt: "Choose a steel item that can pick up smaller paperclips once contextually magnetized.", hint: "Steel contains iron grains and can easily become induced as a temporary magnet." },
            { id: "Q9", name: "Thick Glass Spacer", type: "Non-Magnetic Material", isCorrectGroup: false, hexColor: "#38bdf8", prompt: "Isolate a structural dielectric frame element that shows zero attraction to lodestone samples.", hint: "Glass offers no magnetic permeability and cannot be attracted or repelled by fields." },
            { id: "Q10", name: "Nickel Plated Coin", type: "Magnetic Material", isCorrectGroup: true, hexColor: "#a1a1aa", prompt: "Select an alloy component consisting of nickel that reacts actively inside coin sorting machines.", hint: "Elemental nickel is naturally ferromagnetic at standard room temperatures." },
            { id: "Q11", name: "Dry Timber Strip", type: "Non-Magnetic Material", isCorrectGroup: false, hexColor: "#78350f", prompt: "Choose an organic insulation spacer completely immune to permanent bar magnet forces.", hint: "Wood has no structural free electrons or dipoles capable of responding to magnetic fields." },
            { id: "Q12", name: "South Pole Guide", type: "Like Repulsion", isCorrectGroup: false, hexColor: "#ef4444", prompt: "Select a secondary directional cap that experiences active repulsive levitation over a South Pole block.", hint: "Bringing identical pole configurations together produces absolute repulsive action." }
        ];

        function startNewSession() {
            currentTaskIndex = 0;
            score = 0;
            healthPoints = 3;
            activeTasks = [...magnetismQuestionPool].sort(() => Math.random() - 0.5).slice(0, 10);
            generateTaskEnvironment();
        }

        function generateTaskEnvironment() {
            attemptsLeft = 2;
            displayHintBanner = false;
            laboratoryDropZone.occupiedBy = null;
            testTriggerButton.isActivated = false;
            animationTicks = 0;

            const targetTask = activeTasks[currentTaskIndex];
            currentInstanceHint = targetTask.hint;

            let alternativesPool = magnetismQuestionPool.filter(i => i.id !== targetTask.id);
            alternativesPool.sort(() => Math.random() - 0.5);

            let uniqueSelection = [targetTask, alternativesPool[0], alternativesPool[1]];
            uniqueSelection.sort(() => Math.random() - 0.5);

            choiceCards = [];
            for (let i = 0; i < 3; i++) {
                choiceCards.push({
                    data: uniqueSelection[i],
                    x: 210 + (i * 240),
                    y: 160,
                    startX: 210 + (i * 240),
                    startY: 160,
                    width: 190,
                    height: 52,
                    isDocked: false
                });
            }
        }

        // Programmatic HTML5 Vector Core Engine Replacement for Assets/Logo.png
        function drawInnovineVectorLogo(x, y, scale, isSplash) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // Technical Outer Hexagon
            ctx.strokeStyle = isSplash ? '#1e3a8a' : '#2563eb'; 
            ctx.lineWidth = 5;
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                let angle = (Math.PI / 3) * i;
                let hx = 75 * Math.cos(angle);
                let hy = 75 * Math.sin(angle);
                if (i === 0) ctx.moveTo(hx, hy);
                else ctx.lineTo(hx, hy);
            }
            ctx.closePath();
            ctx.stroke();

            // Core Circular Node
            ctx.fillStyle = isSplash ? '#2563eb' : '#60a5fa'; 
            ctx.beginPath();
            ctx.arc(0, 0, 24, 0, Math.PI * 2);
            ctx.fill();

            // Circuit Node Links
            ctx.strokeStyle = isSplash ? '#0284c7' : '#38bdf8';
            ctx.lineWidth = 4;
            for (let j = 0; j < 3; j++) {
                let lAngle = (Math.PI / 1.5) * j + 0.4;
                ctx.beginPath();
                ctx.moveTo(24 * Math.cos(lAngle), 24 * Math.sin(lAngle));
                ctx.lineTo(64 * Math.cos(lAngle), 64 * Math.sin(lAngle));
                ctx.stroke();

                ctx.fillStyle = isSplash ? '#1e293b' : '#ffffff';
                ctx.beginPath();
                ctx.arc(64 * Math.cos(lAngle), 64 * Math.sin(lAngle), 6, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        // Master Frame Animation Controller
        function updateAndRenderCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (currentState === 'SPLASH') {
                // Strict Clean White Screen Branding Splash Screen Lock
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                drawInnovineVectorLogo(canvas.width / 2, canvas.height / 2 - 40, 1.2, true);

                ctx.fillStyle = '#0f172a'; // Deep Navy slate for high readability on white
                ctx.font = 'bold 44px sans-serif';
                ctx.letterSpacing = "5px";
                ctx.textAlign = 'center';
                ctx.fillText('INNOVINE', canvas.width / 2, canvas.height / 2 + 90);
                ctx.letterSpacing = "0px";

                ctx.fillStyle = '#64748b'; // Muted dark slate subtitle
                ctx.font = 'bold 13px sans-serif';
                ctx.fillText('PHYSICS LABORATORY SIMULATION HARDWARE', canvas.width / 2, canvas.height / 2 + 135);

                if (Date.now() - splashStartTime > SPLASH_LOCK_DURATION) {
                    currentState = 'INSTRUCTIONS';
                }

            } else if (currentState === 'INSTRUCTIONS') {
                // Instruction Sequence (Strictly decoupled from initial splash scene)
                ctx.fillStyle = '#090d16';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 30px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('LAB PROTOCOLS: CORE MAGNETISM EXPLORER', canvas.width / 2, 90);

                ctx.fillStyle = '#4b5563';
                ctx.font = 'bold 15px sans-serif';
                ctx.fillText('ELEMENTARY COGNITIVE PHYSICS SERIES  |  GRADE 6', canvas.width / 2, 125);

                // Instructions Display Board Container Box
                ctx.fillStyle = '#111827';
                ctx.fillRect(80, 170, 740, 270);
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 3;
                ctx.strokeRect(80, 170, 740, 270);

                ctx.textAlign = 'left';
                ctx.fillStyle = '#3b82f6';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('EXPERIMENTAL PURPOSE:', 125, 215);

                ctx.fillStyle = '#cbd5e1';
                ctx.font = '15px sans-serif';
                ctx.fillText('Analyze the magnetism research task prompt. Correctly distinguish between magnetic', 125, 240);
                ctx.fillText('substances, active forces of attraction, and fields of repelling polarity vectors.', 125, 265);

                ctx.fillStyle = '#eab308';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('INTERACTIVE SYSTEM OPERATING RULES:', 125, 315);

                ctx.fillStyle = '#cbd5e1';
                ctx.font = '15px sans-serif';
                ctx.fillText('1. Drag items smoothly via mouse or touch pointer into the testing zone.', 125, 340);
                ctx.fillText('2. Click on the magnetic field generator switch to run flux analysis logs.', 125, 365);
                ctx.fillText('3. Missing an operation twice reveals a descriptive context hint banner.', 125, 390);

                ctx.fillStyle = '#10b981';
                ctx.fillRect(320, 485, 260, 50);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('ENGAGE MAGNETISM LOGS', canvas.width / 2, 516);

            } else if (currentState === 'PLAYING') {
                const currentTask = activeTasks[currentTaskIndex];

                // Continuous Static Scoreboard HUD (Perfect X-Separation Prevents Text Overlaps)
                ctx.fillStyle = '#05070c';
                ctx.fillRect(0, 0, canvas.width, 65);
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 2;
                ctx.strokeRect(0, 0, canvas.width, 65);

                ctx.font = 'bold 15px sans-serif';
                
                ctx.textAlign = 'left';
                ctx.fillStyle = '#38bdf8';
                ctx.fillText(`CURRENT TASK: ${currentTaskIndex + 1} / 10`, 35, 38);

                ctx.textAlign = 'left';
                ctx.fillStyle = '#f8fafc';
                ctx.fillText(`EARNED SCORE: ${score} Pts`, 320, 38);
                
                ctx.textAlign = 'left';
                ctx.fillStyle = '#ef4444';
                ctx.fillText(`SYSTEM HP: ${healthPoints} LIFE`, 590, 38);

                ctx.textAlign = 'right';
                ctx.fillStyle = '#4b5563';
                ctx.fillText('MAGNETISM MODULE V1', canvas.width - 35, 38);

                // Task Card Header Bar
                ctx.fillStyle = '#1f2937';
                ctx.fillRect(40, 85, 820, 46);
                ctx.fillStyle = '#fbbf24';
                ctx.font = '600 15px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`SCENARIO CRITERIA: "${currentTask.prompt}"`, canvas.width / 2, 113);

                // Custom Graphic Bar Magnet Rig Vector Artwork
                let taskEvaluatedCorrectly = (testTriggerButton.isActivated && laboratoryDropZone.occupiedBy && laboratoryDropZone.occupiedBy.data.id === currentTask.id);
                animationTicks++;

                ctx.save();
                ctx.translate(450, 270);
                
                // Pulsing Magnetic Wave Rings on Success Check
                if (taskEvaluatedCorrectly) {
                    ctx.lineWidth = 3;
                    for (let r = 1; r <= 3; r++) {
                        ctx.strokeStyle = `rgba(56, 189, 248, ${0.8 - (r * 0.2)})`;
                        let pulseRadius = 40 + r * 15 + Math.sin(animationTicks * 0.2) * 5;
                        ctx.beginPath();
                        ctx.ellipse(-90, 0, pulseRadius * 0.6, pulseRadius, 0, 0, Math.PI * 2);
                        ctx.ellipse(90, 0, pulseRadius * 0.6, pulseRadius, 0, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }

                // Bar Magnet Rendering
                ctx.fillStyle = '#ef4444'; // North (Red)
                ctx.fillRect(-100, -20, 100, 40);
                ctx.fillStyle = '#2563eb'; // South (Blue)
                ctx.fillRect(0, -20, 100, 40);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 15px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('N', -50, 6);
                ctx.fillText('S', 50, 6);
                ctx.restore();

                // Laboratory Core Drop Zone Container Frame
                ctx.fillStyle = 'rgba(5, 7, 12, 0.8)';
                ctx.fillRect(laboratoryDropZone.x, laboratoryDropZone.y, laboratoryDropZone.width, laboratoryDropZone.height);
                ctx.strokeStyle = '#2563eb';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([6, 4]);
                ctx.strokeRect(laboratoryDropZone.x, laboratoryDropZone.y, laboratoryDropZone.width, laboratoryDropZone.height);
                ctx.setLineDash([]);
                
                ctx.fillStyle = '#4b5563';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                if (!laboratoryDropZone.occupiedBy) {
                    ctx.fillText('ALIGN SPECIMEN', laboratoryDropZone.x + laboratoryDropZone.width / 2, laboratoryDropZone.y + 35);
                }

                // Interactive Analysis Trigger Lever Switch Block
                ctx.fillStyle = testTriggerButton.isActivated ? '#10b981' : '#dc2626';
                ctx.fillRect(testTriggerButton.x, testTriggerButton.y, testTriggerButton.width, testTriggerButton.height);
                ctx.strokeStyle = '#374151';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(testTriggerButton.x, testTriggerButton.y, testTriggerButton.width, testTriggerButton.height);
                
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px sans-serif';
                ctx.fillText(testTriggerButton.isActivated ? 'ANALYZING FLUX' : 'RUN FLUX ANALYSIS', testTriggerButton.x + testTriggerButton.width / 2, testTriggerButton.y + 26);

                // Render Interactable Deck Cards Elements
                choiceCards.forEach(card => {
                    if (!card.isDocked || selectedObject === card) {
                        ctx.fillStyle = card.data.hexColor;
                        ctx.fillRect(card.x - card.width / 2, card.y - card.height / 2, card.width, card.height);
                        ctx.strokeStyle = selectedObject === card ? '#facc15' : '#374151';
                        ctx.lineWidth = selectedObject === card ? 3.5 : 2;
                        ctx.strokeRect(card.x - card.width / 2, card.y - card.height / 2, card.width, card.height);

                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 13px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText(card.data.name, card.x, card.y + 5);
                    }
                });

                // Contextual Concept Scaffold Hint Banner Layer
                if (displayHintBanner) {
                    ctx.fillStyle = '#1e1b4b';
                    ctx.fillRect(60, 525, 780, 48);
                    ctx.strokeStyle = '#d97706';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(60, 525, 780, 48);

                    ctx.fillStyle = '#fbbf24';
                    ctx.font = 'italic 14px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`MAGNETIC HINT: ${currentInstanceHint}`, canvas.width / 2, 554);
                }

            } else if (currentState === 'GAME_OVER') {
                // Final Results Metric Screen Card
                ctx.fillStyle = '#05070c';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let verifiedPass = (healthPoints > 0 && score >= 7);

                ctx.fillStyle = verifiedPass ? '#10b981' : '#ef4444';
                ctx.font = 'bold 36px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(verifiedPass ? 'MAGNETISM EXPERIMENT COMPLETE' : 'LAB CERTIFICATION INCOMPLETE', canvas.width / 2, 170);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 20px sans-serif';
                ctx.fillText(`Final Performance Accuracy Score: ${score} / 10 Units Correct`, canvas.width / 2, 245);

                ctx.fillStyle = '#94a3b8';
                ctx.font = '15px sans-serif';
                if (verifiedPass) {
                    ctx.fillText('Excellent evaluation. Core knowledge of field poles, ferritic vectors and material limits achieved.', canvas.width / 2, 305);
                } else {
                    ctx.fillText('Performance standard below threshold. Re-examine standard ferromagnetic properties and try again.', canvas.width / 2, 305);
                }

                // Interactive Session Reset Trigger Action
                ctx.fillStyle = '#2563eb';
                ctx.fillRect(350, 390, 200, 52);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('RUN NEW TRIAL', canvas.width / 2, 422);
            }
        }

        // Cross-Platform Input Translation Helper Functions
        function capturePointerCoordinates(e) {
            const boundaryRect = canvas.getBoundingClientRect();
            let cX = e.clientX;
            let cY = e.clientY;
            
            if (e.touches && e.touches.length > 0) {
                cX = e.touches[0].clientX;
                cY = e.touches[0].clientY;
            }
            return {
                x: cX - boundaryRect.left,
                y: cY - boundaryRect.top
            };
        }

        function triggerPointerDown(coords) {
            const pX = coords.x;
            const pY = coords.y;

            if (currentState === 'INSTRUCTIONS') {
                if (pX >= 320 && pX <= 580 && pY >= 485 && pY <= 535) {
                    AudioSynth.playTap();
                    startNewSession();
                    currentState = 'PLAYING';
                }
            } else if (currentState === 'PLAYING') {
                // Scan array stack loop for card selection match
                choiceCards.forEach(card => {
                    if (pX >= card.x - card.width / 2 && pX <= card.x + card.width / 2 &&
                        pY >= card.y - card.height / 2 && pY <= card.y + card.height / 2) {
                        selectedObject = card;
                        AudioSynth.playTap();
                    }
                });

                // Field Flux Analysis Switch Bounds Trigger Calculation
                if (pX >= testTriggerButton.x && pX <= testTriggerButton.x + testTriggerButton.width &&
                    pY >= testTriggerButton.y && pY <= testTriggerButton.y + testTriggerButton.height) {
                    
                    if (laboratoryDropZone.occupiedBy && !testTriggerButton.isActivated) {
                        testTriggerButton.isActivated = true;
                        AudioSynth.playTap();

                        let correctInstance = activeTasks[currentTaskIndex];
                        if (laboratoryDropZone.occupiedBy.data.id === correctInstance.id) {
                            // Succeeded Pathway Logic Sequence
                            AudioSynth.playChime();
                            score++;
                            setTimeout(() => {
                                currentTaskIndex++;
                                if (currentTaskIndex >= 10) {
                                    currentState = 'GAME_OVER';
                                } else {
                                    generateTaskEnvironment();
                                }
                            }, 1900);
                        } else {
                            // Failure Pathway Logic Sequence
                            AudioSynth.playBuzzer();
                            healthPoints--;
                            attemptsLeft--;

                            setTimeout(() => {
                                if (healthPoints <= 0) {
                                    currentState = 'GAME_OVER';
                                } else {
                                    testTriggerButton.isActivated = false;
                                    if (attemptsLeft <= 0) {
                                        displayHintBanner = true;
                                    }
                                    // Elastic return action to starting array coordinate offsets
                                    if (laboratoryDropZone.occupiedBy) {
                                        laboratoryDropZone.occupiedBy.x = laboratoryDropZone.occupiedBy.startX;
                                        laboratoryDropZone.occupiedBy.y = laboratoryDropZone.occupiedBy.startY;
                                        laboratoryDropZone.occupiedBy.isDocked = false;
                                        laboratoryDropZone.occupiedBy = null;
                                    }
                                }
                            }, 1300);
                        }
                    } else if (!laboratoryDropZone.occupiedBy) {
                        AudioSynth.playBuzzer();
                    }
                }
            } else if (currentState === 'GAME_OVER') {
                if (pX >= 350 && pX <= 550 && pY >= 390 && pY <= 442) {
                    AudioSynth.playTap();
                    startNewSession();
                    currentState = 'PLAYING';
                }
            }
        }

        function triggerPointerMove(coords) {
            if (!selectedObject || currentState !== 'PLAYING') return;
            selectedObject.x = coords.x;
            selectedObject.y = coords.y;
        }

        function triggerPointerUp() {
            if (!selectedObject || currentState !== 'PLAYING') return;

            let zoneCenterX = laboratoryDropZone.x + laboratoryDropZone.width / 2;
            let zoneCenterY = laboratoryDropZone.y + laboratoryDropZone.height / 2;
            let deltaRange = Math.hypot(selectedObject.x - zoneCenterX, selectedObject.y - zoneCenterY);

            // Alignment Snapping Evaluation Geometric Bounds Check
            if (deltaRange < 95 && !laboratoryDropZone.occupiedBy) {
                selectedObject.x = zoneCenterX;
                selectedObject.y = zoneCenterY;
                selectedObject.isDocked = true;
                laboratoryDropZone.occupiedBy = selectedObject;
                AudioSynth.playTap();
            } else {
                selectedObject.x = selectedObject.startX;
                selectedObject.y = selectedObject.startY;
                selectedObject.isDocked = false;
                if (laboratoryDropZone.occupiedBy === selectedObject) {
                    laboratoryDropZone.occupiedBy = null;
                }
            }
            selectedObject = null;
        }

        // Standard Unified Events Multiplexer Hook Routine
        window.addEventListener('mousedown', (e) => triggerPointerDown(capturePointerCoordinates(e)));
        window.addEventListener('mousemove', (e) => triggerPointerMove(capturePointerCoordinates(e)));
        window.addEventListener('mouseup', () => triggerPointerUp());

        window.addEventListener('touchstart', (e) => { e.preventDefault(); triggerPointerDown(capturePointerCoordinates(e)); }, {passive: false});
        window.addEventListener('touchmove', (e) => { e.preventDefault(); triggerPointerMove(capturePointerCoordinates(e)); }, {passive: false});
        window.addEventListener('touchend', () => triggerPointerUp());

        // Game Loop Automation Core Driver Call
        function executeMasterFrameTick() {
            updateAndRenderCanvas();
            requestAnimationFrame(executeMasterFrameTick);
        }

        executeMasterFrameTick();
    </script>
</body>
</html>
