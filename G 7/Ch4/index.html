<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 7 Live Circuit Grid Sandbox</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #060a12;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #canvasFrame {
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #1e293b;
            background-color: #090d16;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="canvasFrame">
        <canvas id="gameCanvas" width="960" height="640"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // BRANDING ASSET
        const logoImg = new Image();
        logoImg.src = 'assets/logo.png';

        // MAIN CONTROL STATES
        let gameState = 'SPLASH'; // SPLASH -> STAGE_INTRO -> PLAY_SANDBOX -> STAGE_COMPLETE -> GAMEOVER
        let splashTimeStart = Date.now();
        const SPLASH_LIMIT = 5000; // 5 Seconds exact Branding lock

        let currentStageIdx = 0;
        let healthPoints = 3;
        let sandboxScore = 0;
        let globalTicks = 0;

        // ANIMATION AND INTERACTION TRACKING VARIABLE STATE
        let activeGridComponent = null; 
        let simulationActive = false;
        let circuitStateMessage = "READY TO WIRE: Deploy the critical components onto the golden terminal blocks.";
        let messageColor = "#94a3b8";
        let stateTimer = 0;
        let compassAngle = 0;
        let fuseBlown = false;

        // INVENTORY DECK SELECTION (PHYSICAL HARDWARE PARTS)
        const inventoryDeck = [
            { id: "switch_closed", name: "Key Switch [Closed]", desc: "Provides a zero-break continuous solid path.", color: "#2563eb", icon: "🔑" },
            { id: "battery_series", name: "2-Cell Battery", desc: "Two chemical cells linked in series (+ to -).", color: "#ec4899", icon: "🔋" },
            { id: "nichrome_wire", name: "Nichrome Element", desc: "High resistance wire coil that generates extreme heat.", color: "#a855f7", icon: "🌀" },
            { id: "thin_fuse", name: "Alloy Fuse Wire", desc: "Low melting link that breaks if current overloads.", color: "#e11d48", icon: "⚡" },
            { id: "compass_needle", name: "Magnetic Compass", desc: "Detects the invisible magnetic effect of lines.", color: "#f59e0b", icon: "🧭" },
            { id: "nail_coiled", name: "Soft Iron Core Coil", desc: "Acts like a heavy magnet only while power passes.", color: "#10b981", icon: "🧲" }
        ];

        // RENDER LOCATION FOR INVENTORY LAYOUT
        const deckX = 40, deckY = 515, cardW = 142, cardH = 95;

        // STAGES DESIGNED AROUND GRADE 7 LESSONS
        const stages = [
            {
                title: "MISSION 1: The Dark Signal Beacon",
                brief: "The colony lighthouse path is open and broken. A standard single cell provides power, but the circuit route contains a physical air gap preventing current flow. Select the tool that safely patches the loop gap to make electricity flow continuously.",
                targetId: "switch_closed",
                hardwareTerminals: [ { x: 480, y: 310, label: "LOOP COUPLER" } ],
                bgMatrix: "beacon"
            },
            {
                title: "MISSION 2: High-Voltage Motor Crank",
                brief: "An ventilation fan motor requires an immediate multi-cell voltage drop to generate enough magnetic push to spin its blade. A single weak cell fails. Deploy a serial multi-cell stack configuration to jumpstart the drive.",
                targetId: "battery_series",
                hardwareTerminals: [ { x: 480, y: 310, label: "DC ENERGY INPUT" } ],
                bgMatrix: "motor"
            },
            {
                title: "MISSION 3: Incubator Thermal Unit",
                brief: "An agricultural laboratory requires a component that converts raw electrical kinetic streams into ambient heat radiation via high resistance atomic drag. Wire the correct element loop inside the heating tray.",
                targetId: "nichrome_wire",
                hardwareTerminals: [ { x: 480, y: 310, label: "THERMAL CORE SLOT" } ],
                bgMatrix: "heater"
            },
            {
                title: "MISSION 4: The Transformer Surge Shield",
                brief: "A regional substation line is vulnerable to sudden lightning strikes. To prevent total appliance fires across the grid, load a sacrificial wire component designed to melt instantly if excessive load surges.",
                targetId: "thin_fuse",
                hardwareTerminals: [ { x: 480, y: 310, label: "SURGE TERMINAL" } ],
                bgMatrix: "fuse"
            },
            {
                title: "MISSION 5: The Deflection Detector",
                brief: "You are attempting to trace if current is secretly escaping into a buried concrete wall conduit. Wire in an interactive sensor that physically swivels out of alignment whenever a magnetic force leaks from a wire.",
                targetId: "compass_needle",
                hardwareTerminals: [ { x: 480, y: 310, label: "MAGNETIC INDUCTION DETECTOR" } ],
                bgMatrix: "compass"
            },
            {
                title: "MISSION 6: The Scrap Metal Crane Drop",
                brief: "An industrial scrapyard needs a sorting lifting plate that can lock onto iron car frames firmly when active, but immediately demagnetize to drop them the millisecond the circuit loop is broken.",
                targetId: "nail_coiled",
                hardwareTerminals: [ { x: 480, y: 310, label: "CORE INDUCTOR ASSEMBLY" } ],
                bgMatrix: "bell"
            }
        ];

        // AUDIO FREQUENCY SYNTHESIZER
        const SoundEngine = {
            ctx: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            },
            playTick() {
                this.init(); let osc = this.ctx.createOscillator(); let gain = this.ctx.createGain();
                osc.frequency.setValueAtTime(400, this.ctx.currentTime); gain.gain.setValueAtTime(0.02, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.05);
            },
            playSuccess() {
                this.init(); let osc = this.ctx.createOscillator(); let gain = this.ctx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, this.ctx.currentTime + 0.2); // G5
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.5);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.5);
            },
            playBurnout() {
                this.init(); let osc = this.ctx.createOscillator(); let gain = this.ctx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.3);
            }
        };

        function startSandboxLevel() {
            activeGridComponent = null;
            simulationActive = false;
            fuseBlown = false;
            compassAngle = 0;
            circuitStateMessage = "SANDBOX OFFLINE: Press 'ENGAGE CURRENT CIRCUIT' after dropping a component module.";
            messageColor = "#64748b";
        }

        function drawGameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            globalTicks++;

            if (gameState === 'SPLASH') {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let cx = canvas.width / 2;
                let cy = canvas.height / 2;

                if (logoImg.complete && logoImg.naturalWidth !== 0) {
                    ctx.drawImage(logoImg, cx - 70, cy - 100, 140, 140);
                } else {
                    ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 5; ctx.beginPath();
                    ctx.arc(cx, cy - 30, 40, 0, Math.PI * 2); ctx.stroke();
                    ctx.fillStyle = '#2563eb'; ctx.beginPath();
                    ctx.arc(cx, cy - 30, 12, 0, Math.PI * 2); ctx.fill();
                }

                ctx.fillStyle = '#0f172a'; ctx.font = 'bold 44px sans-serif'; ctx.letterSpacing = "5px"; ctx.textAlign = 'center';
                ctx.fillText('INNOVINE', cx, cy + 80);
                ctx.letterSpacing = "0px"; ctx.fillStyle = '#64748b'; ctx.font = 'bold 11px sans-serif';
                ctx.fillText('LIVE CIRCUIT SANDBOX & SIMULATION INTERACTIVE', cx, cy + 115);

                // Core Minimal Rotation Tracker Loader
                ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 3; ctx.beginPath();
                ctx.arc(cx, cy + 160, 14, globalTicks * 0.06, (globalTicks * 0.06) + (Math.PI * 0.5)); ctx.stroke();

                if (Date.now() - splashTimeStart > SPLASH_LIMIT) {
                    gameState = 'STAGE_INTRO';
                    startSandboxLevel();
                }
            }

            // ==========================================
            // STATE 2: LAB STAGE INTRO NARRATIVE DIALOGUE
            // ==========================================
            else if (gameState === 'STAGE_INTRO') {
                let sc = stages[currentStageIdx];
                ctx.fillStyle = '#090d16';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Grid background accent lines
                ctx.strokeStyle = '#111827'; ctx.lineWidth = 1;
                for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
                for(let j=0; j<canvas.height; j+=40) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(canvas.width,j); ctx.stroke(); }

                ctx.fillStyle = '#1e293b'; ctx.fillRect(100, 120, 760, 380);
                ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.strokeRect(100, 120, 760, 380);

                ctx.fillStyle = '#3b82f6'; ctx.fillRect(100, 120, 760, 45);
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left';
                ctx.fillText(`INCOMING PHYSICAL EXPERIMENT CHALLENGE — UNIT ${currentStageIdx+1}`, 130, 148);

                ctx.fillStyle = '#f8fafc'; ctx.font = '22px sans-serif';
                ctx.fillText(sc.title, 130, 215);

                ctx.fillStyle = '#94a3b8'; ctx.font = '15px sans-serif';
                wrapAndPrintText(sc.brief, 130, 260, 700, 25);

                // Interactive Enter Action Button box
                ctx.fillStyle = '#10b981'; ctx.fillRect(350, 410, 260, 50);
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText('BOOT BENCH LAB WORKSPACE', 480, 441);
            }

            // ==========================================
            // STATE 3: INTERACTIVE LIVE CIRCUITS SANDBOX
            // ==========================================
            else if (gameState === 'PLAY_SANDBOX') {
                let sc = stages[currentStageIdx];

                // Render Top Operations Bar Console
                ctx.fillStyle = '#0d1527'; ctx.fillRect(0, 0, canvas.width, 60);
                ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0,60); ctx.lineTo(canvas.width, 60); ctx.stroke();

                ctx.textAlign = 'left'; ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 14px sans-serif';
                ctx.fillText("INNOVINE ELECTRICITY SIMULATOR", 30, 35);

                ctx.fillStyle = '#38bdf8'; ctx.fillText(`STAGE: ${currentStageIdx+1}/6`, 380, 35);
                ctx.fillStyle = '#facc15'; ctx.fillText(`⭐ INSIGHT SCORE: ${sandboxScore}`, 520, 35);
                ctx.fillStyle = '#ef4444'; ctx.fillText(`❤️ HP INTEGRITY: ${healthPoints}`, 700, 35);

                // Render Main Laboratory Wiring Board Grid
                ctx.fillStyle = '#0b1120'; ctx.fillRect(20, 80, 920, 410);
                ctx.strokeStyle = '#1e293b'; ctx.strokeRect(20, 80, 920, 410);

                // Blueprint circuit visual background wiring path tracks
                ctx.strokeStyle = simulationActive ? '#3b82f6' : '#1e293b';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(150, 240); ctx.lineTo(150, 310); ctx.lineTo(360, 310);
                ctx.moveTo(600, 310); ctx.lineTo(810, 310); ctx.lineTo(810, 240);
                ctx.stroke();

                // Draw standard circuit loop back rails
                ctx.strokeStyle = simulationActive ? '#10b981' : '#1e293b';
                ctx.beginPath();
                ctx.moveTo(150, 240); ctx.lineTo(480, 140); ctx.lineTo(810, 240);
                ctx.stroke();

                // Draw background decorative component symbols based on type to establish real schematics
                ctx.fillStyle = '#334155'; ctx.font = '24px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText("💡 [BULB]", 480, 130);

                // Render Target Dynamic Golden Connection Terminals
                sc.hardwareTerminals.forEach(term => {
                    ctx.fillStyle = '#1e293b'; ctx.fillRect(term.x - 120, term.y - 45, 240, 90);
                    ctx.strokeStyle = '#eab308'; ctx.lineWidth = 2; ctx.strokeRect(term.x - 120, term.y - 45, 240, 90);

                    if (!activeGridComponent) {
                        ctx.fillStyle = 'rgba(234, 179, 8, 0.08)';
                        ctx.fillRect(term.x - 120, term.y - 45, 240, 90);
                        ctx.fillStyle = '#eab308'; ctx.font = 'bold 11px sans-serif';
                        ctx.fillText(`[ DROP ${term.label} HERE ]`, term.x, term.y + 5);
                    }
                });

                // Render Active Placed Component inside Terminal with Active Physical Graphics Animations
                if (activeGridComponent) {
                    ctx.fillStyle = activeGridComponent.color;
                    ctx.fillRect(370, 275, 220, 70);
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.strokeRect(370, 275, 220, 70);

                    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
                    ctx.fillText(`${activeGridComponent.icon} ${activeGridComponent.name}`, 480, 305);

                    // --- ACTIVE HARDWARE SIMULATED ANIMATIONS ---
                    if (simulationActive) {
                        // Animation 1: Nichrome wire high thermal load element heating up red hot
                        if (activeGridComponent.id === 'nichrome_wire') {
                            ctx.strokeStyle = `rgb(${200 + Math.sin(globalTicks*0.2)*55}, 50, 50)`;
                            ctx.lineWidth = 5;
                            ctx.beginPath();
                            for(let ix = 390; ix <= 570; ix += 10) {
                                ctx.lineTo(ix, 325 + (ix%2===0 ? 8 : -8));
                            }
                            ctx.stroke();
                        }
                        // Animation 2: Alloy Fuse Wire blowing out completely under load
                        if (activeGridComponent.id === 'thin_fuse') {
                            ctx.strokeStyle = fuseBlown ? '#475569' : '#f43f5e';
                            ctx.lineWidth = 3;
                            ctx.beginPath();
                            ctx.moveTo(400, 325);
                            if (fuseBlown) {
                                ctx.lineTo(470, 320); ctx.moveTo(490, 330); ctx.lineTo(560, 325);
                                circuitStateMessage = "💥 FUSE BURNOUT SAFELY TRIGGERED: The alloy wire melted instantly to halt excessive current.";
                                messageColor = "#f43f5e";
                            } else {
                                ctx.lineTo(560, 325);
                            }
                            ctx.stroke();
                        }
                        // Animation 3: Geographic Magnetic Compass deflection dial mechanics
                        if (activeGridComponent.id === 'compass_needle') {
                            compassAngle += (Math.PI*0.25 - compassAngle) * 0.1; // Smooth alignment matrix swing
                            ctx.save();
                            ctx.translate(480, 328);
                            ctx.rotate(compassAngle);
                            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3;
                            ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0, -20); ctx.stroke();
                            ctx.strokeStyle = '#94a3b8';
                            ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0, 20); ctx.stroke();
                            ctx.restore();
                        }
                        // Animation 4: Soft Iron Core Nail electromagnet field particle rings
                        if (activeGridComponent.id === 'nail_coiled') {
                            ctx.strokeStyle = 'rgba(16, 185, 129, 0.4)'; ctx.lineWidth = 2;
                            ctx.beginPath();
                            ctx.ellipse(480, 325, 40 + Math.sin(globalTicks*0.3)*10, 15, 0, 0, Math.PI*2);
                            ctx.stroke();
                        }
                    }
                }

                // Live Simulator Activity Terminal Readout Output text
                ctx.fillStyle = '#020617'; ctx.fillRect(20, 405, 920, 40);
                ctx.fillStyle = messageColor; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(circuitStateMessage, canvas.width/2, 429);

                // Simulation Activation Button Trigger
                ctx.fillStyle = simulationActive ? '#dc2626' : '#2563eb';
                ctx.fillRect(720, 452, 210, 32);
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(simulationActive ? "DISCONNECT BREAK CIRCUIT" : "ENGAGE CURRENT CIRCUIT ⚡", 825, 472);

                // Hardware Parts Deck Space Splitter Label
                ctx.textAlign = 'left'; ctx.fillStyle = '#475569'; ctx.font = 'bold 11px sans-serif'; ctx.letterSpacing = "2px";
                ctx.fillText("LAB COMPONENT DISPATCH INVENTORY DECK", 30, 503); ctx.letterSpacing = "0px";

                // Map Inventory Cards Grid
                inventoryDeck.forEach((card, idx) => {
                    let rx = deckX + (idx * 150);
                    ctx.fillStyle = '#111827'; ctx.fillRect(rx, deckY, cardW, cardH);
                    ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.5; ctx.strokeRect(rx, deckY, cardW, cardH);

                    ctx.fillStyle = card.color; ctx.fillRect(rx + 8, deckY + 8, 4, 14);
                    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px sans-serif';
                    ctx.fillText(card.name, rx + 18, deckY + 20);

                    ctx.fillStyle = '#64748b'; ctx.font = '10px sans-serif';
                    wrapAndPrintText(card.desc, rx + 10, deckY + 40, cardW - 16, 13);
                });
            }

            // ==========================================
            // STATE 4: SUCCESS RECAP AND FEEDBACK SCREEN
            // ==========================================
            else if (gameState === 'STAGE_COMPLETE') {
                let sc = stages[currentStageIdx];
                ctx.fillStyle = '#070f1e'; ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#10b981'; ctx.font = 'bold 32px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText("CIRCUIT SYNCHRONIZED SUCCESSFULLY!", canvas.width/2, 200);

                ctx.fillStyle = '#f8fafc'; ctx.font = '16px sans-serif';
                ctx.fillText("Core Educational Insight Discovered:", canvas.width/2, 260);

                ctx.fillStyle = '#94a3b8'; ctx.font = 'italic 16px sans-serif';
                wrapAndPrintText(`"${sc.brief}"`, canvas.width/2, 300, 750, 24);

                // Next Level Button Action Layout Box
                ctx.fillStyle = '#2563eb'; ctx.fillRect(380, 450, 200, 50);
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px sans-serif';
                ctx.fillText("NEXT SCHEMATIC MATRIX", canvas.width/2, 481);
            }

            // ==========================================
            // STATE 5: GAME OVER SIMULATOR REBOOT
            // ==========================================
            else if (gameState === 'GAMEOVER') {
                ctx.fillStyle = '#0f0505'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ef4444'; ctx.font = 'bold 36px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText("HARDWARE BALANCE SHUTDOWN", canvas.width/2, 230);

                ctx.fillStyle = '#94a3b8'; ctx.font = '16px sans-serif';
                ctx.fillText("Too many incompatible modules caused critical impedance faults.", canvas.width/2, 290);

                ctx.fillStyle = '#dc2626'; ctx.fillRect(370, 380, 220, 50);
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px sans-serif';
                ctx.fillText("REBOOT COLD MATRIX SIM", canvas.width/2, 411);
            }

            requestAnimationFrame(drawGameLoop);
        }

        // TEXT WRAPPING AND CHOPPING UTILITY
        function wrapAndPrintText(str, x, y, maxW, lineH) {
            let tokens = str.split(' '); let segment = ''; let currentY = y;
            for (let n = 0; n < tokens.length; n++) {
                let testLine = segment + tokens[n] + ' ';
                if (ctx.measureText(testLine).width > maxW && n > 0) {
                    ctx.fillText(segment, x, currentY); segment = tokens[n] + ' '; currentY += lineH;
                } else { segment = testLine; }
            }
            ctx.fillText(segment, x, currentY);
        }

        // CLICK HANDLING FOR ACTIONS AND GRID WIRING POSITIONS
        function processUserInteraction(mx, my) {
            if (gameState === 'STAGE_INTRO') {
                if (mx >= 350 && mx <= 610 && my >= 410 && my <= 460) {
                    SoundEngine.playTick();
                    gameState = 'PLAY_SANDBOX';
                }
            }
            else if (gameState === 'PLAY_SANDBOX') {
                // Check if user clicked an inventory module card to deploy it
                inventoryDeck.forEach((card, idx) => {
                    let rx = deckX + (idx * 150);
                    if (mx >= rx && mx <= rx + cardW && my >= deckY && my <= deckY + cardH) {
                        SoundEngine.playTick();
                        activeGridComponent = card;
                        simulationActive = false;
                        fuseBlown = false;
                        circuitStateMessage = `DEPLOYED: ${card.name} loaded into connection terminal block. Press power to test.`;
                        messageColor = "#38bdf8";
                    }
                });

                // Check if user clicked the "Engage Circuit" Toggle button
                if (mx >= 720 && mx <= 930 && my >= 452 && my <= 484) {
                    SoundEngine.playTick();
                    if (!activeGridComponent) {
                        circuitStateMessage = "WARNING WARNING: Cannot establish load path. The loop connection terminal is currently blank!";
                        messageColor = "#eab308";
                        return;
                    }

                    simulationActive = !simulationActive;

                    if (simulationActive) {
                        let target = stages[currentStageIdx];
                        if (activeGridComponent.id === target.targetId) {
                            // Specific special condition trigger animations
                            if (activeGridComponent.id === 'thin_fuse') {
                                fuseBlown = true;
                            }
                            
                            SoundEngine.playSuccess();
                            circuitStateMessage = "🟢 LOAD BALANCED: Continuous path validated! Transforming current effects cleanly.";
                            messageColor = "#10b981";
                            sandboxScore += 10;

                            setTimeout(() => {
                                gameState = 'STAGE_COMPLETE';
                            }, 3000);
                        } else {
                            SoundEngine.playBurnout();
                            circuitStateMessage = "🚨 CRITICAL FAULT: Circuit architecture breakdown! Incompatible electrical impedance detected.";
                            messageColor = "#ef4444";
                            healthPoints--;
                            simulationActive = false;

                            if (healthPoints <= 0) {
                                setTimeout(() => { gameState = 'GAMEOVER'; }, 1500);
                            }
                        }
                    }
                }
            }
            else if (gameState === 'STAGE_COMPLETE') {
                if (mx >= 380 && mx <= 580 && my >= 450 && my <= 500) {
                    SoundEngine.playTick();
                    currentStageIdx++;
                    if (currentStageIdx >= stages.length) {
                        currentStageIdx = 0; // Win loop overflow safety refresh reset
                        sandboxScore = 0;
                        healthPoints = 3;
                        gameState = 'SPLASH';
                        splashTimeStart = Date.now();
                    } else {
                        gameState = 'STAGE_INTRO';
                    }
                    startSandboxLevel();
                }
            }
            else if (gameState === 'GAMEOVER') {
                if (mx >= 370 && mx <= 590 && my >= 380 && my <= 430) {
                    SoundEngine.playTick();
                    currentStageIdx = 0; sandboxScore = 0; healthPoints = 3;
                    gameState = 'PLAY_SANDBOX';
                    startSandboxLevel();
                }
            }
        }

        // UNIFIED CLICKS MAP ADAPTER MOUSE EVENT TRIGGERS
        canvas.addEventListener('mousedown', (e) => {
            const r = canvas.getBoundingClientRect();
            let clickX = (e.clientX - r.left) * (canvas.width / r.width);
            let clickY = (e.clientY - r.top) * (canvas.height / r.height);
            processUserInteraction(clickX, clickY);
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) {
                const r = canvas.getBoundingClientRect();
                let touchX = (e.touches[0].clientX - r.left) * (canvas.width / r.width);
                let touchY = (e.touches[0].clientY - r.top) * (canvas.height / r.height);
                processUserInteraction(touchX, touchY);
            }
        }, {passive: false});

        // KICKSTART CORE ENGINE LOOP RUNNER
        drawGameLoop();
    </script>
</body>
</html>
