<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovine - Circuit Overdrive Arcade</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #020205;
            color: #f3f4f6;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvasFrame {
            position: relative;
            box-shadow: 0 0 60px #bc13fe;
            border-radius: 12px;
            overflow: hidden;
            border: 5px solid #ff007f;
            background-color: #05050a;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="canvasFrame">
        <canvas id="gameCanvas" width="960" height="640"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // BRANDING ASSET
        const logoImg = new Image();
        logoImg.src = 'assets/logo.png';

        // ARCADE STATE MACHINE
        let gameState = 'SPLASH'; // SPLASH -> ACTION_GAME -> WIN_SCREEN -> GAME_OVER
        let splashTimeStart = Date.now();
        const SPLASH_LIMIT = 5000; // Locked 5 Seconds Splash

        let currentLevelIdx = 0;
        let playerLives = 3;
        let arcadeScore = 0;
        let frameTicks = 0;

        // IN-GAME LEVEL BANNER ANIMATION TIMER
        let introBannerTicks = 80; 

        // MECHANICS AND SIMULATION ARRAYS
        let equippedTile = null;
        let powerGridActive = false;
        let fuseSnapped = false;
        let dialAngle = 0;
        let activeParticles = [];

        // RETRO RADICAL TOOLKIT DISPATCHER TILES
        const componentDeck = [
            { id: "switch_closed", tag: "SWITCH [ON]", icon: "🔑", hue: "#00f0ff", fx: "BRIDGES WIRE GAPS" },
            { id: "battery_series", tag: "BOOST BATTERY", icon: "🔋⚡", hue: "#ff007f", fx: "DOUBLES POWER VOLTAGE" },
            { id: "nichrome_wire", tag: "HEAT ELEMENT", icon: "🌀🔥", hue: "#bc13fe", fx: "TURNS JUICE TO GLOW HEAT" },
            { id: "thin_fuse", tag: "SAFETY FUSE", icon: "🛡️💥", hue: "#ffb700", fx: "MELTS ON SURGE OVERLOAD" },
            { id: "compass_needle", tag: "MAG-COMPASS", icon: "🧭✨", hue: "#00ff66", fx: "DETECTS WIRE FIELD RAYS" },
            { id: "nail_coiled", tag: "MAG-MAGNET", icon: "🧲⚙️", hue: "#38bdf8", fx: "POWERED HEAVY MAGNET" }
        ];

        const deckX = 25, deckY = 515, blockW = 146, blockH = 95;

        // VISUAL ACTION LEVEL OBJECTIVES (SHOWS IN-WORLD OBJECTS INSTEAD OF QUIZ QUESTIONS)
        const gameLevels = [
            {
                alertSign: "🚨 DAMAGE ALERT: POWER GRID IS CURRENTLY CUT IN HALF!",
                worldObject: "beacon_offline",
                objectLabel: "OFFLINE CORES SIGNAL BEACON",
                requiredPart: "switch_closed",
                neonTheme: "#00f0ff"
            },
            {
                alertSign: "⚠️ CURRENT LOW: MOTOR ENGINE POWER IS SAGGING BELOW 10%!",
                worldObject: "thruster_weak",
                objectLabel: "LOW-VOLTAGE TURBO FAN MOTOR",
                requiredPart: "battery_series",
                neonTheme: "#ff007f"
            },
            {
                alertSign: "❄️ FREEZE CRITICAL: ROOM TEMPERATURE IS DROPPING FAST!",
                worldObject: "heater_cold",
                objectLabel: "FROZEN CRYOPOD WARMING SYSTEM",
                requiredPart: "nichrome_wire",
                neonTheme: "#bc13fe"
            },
            {
                alertSign: "⚡ VOLTAGE SPIKE DETECTED! MAIN COMPUTER CHIPS WILL BURN!",
                worldObject: "surge_vulnerable",
                objectLabel: "UNPROTECTED COMPUTER MOTHERBOARD",
                requiredPart: "thin_fuse",
                neonTheme: "#ffb700"
            },
            {
                alertSign: "🔍 SCANNING LINES: FIND THE HIDDEN LEAKING CURRENT MATRIX!",
                worldObject: "conduit_invisible",
                objectLabel: "CONCEALED WALL CABLE INDUCTION",
                requiredPart: "compass_needle",
                neonTheme: "#00ff66"
            },
            {
                alertSign: "🏗️ CRANE DEPLOYED: PACK AND PICK UP THE SCRAP METALS!",
                worldObject: "crane_magnet",
                objectLabel: "AUTOMATED SCRAP YARD BELL CRANE",
                requiredPart: "nail_coiled",
                neonTheme: "#38bdf8"
            }
        ];

        // SYNTH SOUND EFFECTS ENGINE
        const SoundFX = {
            audioCtx: null,
            boot() { if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); },
            click() {
                this.boot(); let osc = this.audioCtx.createOscillator(); let g = this.audioCtx.createGain();
                osc.frequency.setValueAtTime(800, this.audioCtx.currentTime); g.gain.setValueAtTime(0.04, this.audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.05);
                osc.connect(g); g.connect(this.audioCtx.destination); osc.start(); osc.stop(this.audioCtx.currentTime + 0.05);
            },
            combo() {
                this.boot(); let osc = this.audioCtx.createOscillator(); let g = this.audioCtx.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(440, this.audioCtx.currentTime);
                osc.frequency.setValueAtTime(880, this.audioCtx.currentTime + 0.08);
                g.gain.setValueAtTime(0.06, this.audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.3);
                osc.connect(g); g.connect(this.audioCtx.destination); osc.start(); osc.stop(this.audioCtx.currentTime + 0.3);
            },
            explode() {
                this.boot(); let osc = this.audioCtx.createOscillator(); let g = this.audioCtx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(160, this.audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, this.audioCtx.currentTime + 0.4);
                g.gain.setValueAtTime(0.2, this.audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.4);
                osc.connect(g); g.connect(this.audioCtx.destination); osc.start(); osc.stop(this.audioCtx.currentTime + 0.4);
            }
        };

        function spawnSparkParticles(px, py, color) {
            for(let i=0; i<25; i++) {
                activeParticles.push({
                    x: px, y: py,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    size: Math.random() * 4 + 2,
                    alpha: 1,
                    color: color
                });
            }
        }

        function loadArcadeLevel() {
            equippedTile = null;
            powerGridActive = false;
            fuseSnapped = false;
            dialAngle = 0;
            introBannerTicks = 80; // Triggers the animated cinematic stage banner overlay
        }

        function renderEngineTick() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            frameTicks++;

            // ==========================================
            // STATE 1: REFINED BRANDING ENTRY SPLASH
            // ==========================================
            if (gameState === 'SPLASH') {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let cx = canvas.width / 2;
                let cy = canvas.height / 2;

                if (logoImg.complete && logoImg.naturalWidth !== 0) {
                    ctx.drawImage(logoImg, cx - 70, cy - 100, 140, 140);
                } else {
                    ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 5; ctx.beginPath();
                    ctx.arc(cx, cy - 30, 40, 0, Math.PI * 2); ctx.stroke();
                    ctx.fillStyle = '#2563eb'; ctx.beginPath();
                    ctx.arc(cx, cy - 30, 12, 0, Math.PI * 2); ctx.fill();
                }

                ctx.fillStyle = '#0f172a'; ctx.font = 'bold 44px sans-serif'; ctx.letterSpacing = "5px"; ctx.textAlign = 'center';
                ctx.fillText('INNOVINE', cx, cy + 80);
                ctx.letterSpacing = "0px"; ctx.fillStyle = '#64748b'; ctx.font = 'bold 11px sans-serif';
                ctx.fillText('LIVE CIRCUIT SANDBOX & SIMULATION INTERACTIVE', cx, cy + 115);

                ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 3; ctx.beginPath();
                ctx.arc(cx, cy + 160, 14, frameTicks * 0.06, (frameTicks * 0.06) + (Math.PI * 0.5)); ctx.stroke();

                if (Date.now() - splashTimeStart > SPLASH_LIMIT) {
                    gameState = 'ACTION_GAME';
                    loadArcadeLevel();
                }
            }

            // ==========================================
            // STATE 2: LIVE ACTION CIRCUIT GAMEPAD WORKBENCH
            // ==========================================
            else if (gameState === 'ACTION_GAME') {
                let lvl = gameLevels[currentLevelIdx];

                // Neon Cyber HUD Stats Header Bar
                ctx.fillStyle = '#050510'; ctx.fillRect(0, 0, canvas.width, 60);
                ctx.strokeStyle = '#ff007f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0,60); ctx.lineTo(canvas.width,60); ctx.stroke();

                ctx.textAlign = 'left'; ctx.fillStyle = '#ffffff'; ctx.font = 'bold 13px sans-serif';
                ctx.fillText("🕹️ INNOVINE ELECTRON OVERDRIVE", 25, 36);

                ctx.fillStyle = '#00f0ff'; ctx.fillText(`STAGE PORTAL: [0${currentLevelIdx+1}/06]`, 340, 36);
                ctx.fillStyle = '#ffb700'; ctx.fillText(`SCORE ACCUMULATED: ${arcadeScore} XP`, 540, 36);
                
                // Graphical Hearts Bar
                ctx.fillStyle = '#ff007f'; ctx.fillText("LIVES:", 760, 36);
                for(let h=0; h<3; h++) {
                    ctx.fillStyle = h < playerLives ? '#ff007f' : '#221e2b';
                    ctx.font = '16px sans-serif';
                    ctx.fillText("❤️", 820 + (h * 24), 38);
                }

                // In-World Environment Box Grid
                ctx.fillStyle = '#020208'; ctx.fillRect(20, 75, 920, 420);
                ctx.strokeStyle = '#1d1d35'; ctx.lineWidth = 2; ctx.strokeRect(20, 75, 920, 420);

                // Live Ticker Display Subtitle Alert
                ctx.fillStyle = '#100a1c'; ctx.fillRect(30, 85, 900, 36);
                ctx.strokeStyle = '#ff007f'; ctx.lineWidth = 1; ctx.strokeRect(30, 85, 900, 36);
                
                ctx.fillStyle = '#ff007f'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(lvl.alertSign, canvas.width/2, 107);

                // Render Background Blueprints Wire Routes
                ctx.strokeStyle = powerGridActive ? '#00f0ff' : '#1b1b3a';
                ctx.lineWidth = 5; ctx.beginPath();
                ctx.moveTo(140, 260); ctx.lineTo(140, 330); ctx.lineTo(360, 330);
                ctx.moveTo(600, 330); ctx.lineTo(820, 330); ctx.lineTo(820, 260);
                ctx.stroke();

                ctx.strokeStyle = powerGridActive && !fuseSnapped ? '#00ff66' : '#1b1b3a';
                ctx.beginPath(); ctx.moveTo(140, 260); ctx.lineTo(480, 155); ctx.lineTo(820, 260); ctx.stroke();

                // Electron Flow Particle Visual FX Stream
                if (powerGridActive && !fuseSnapped) {
                    ctx.fillStyle = '#ffffff';
                    let flowX = (frameTicks * 5) % 220;
                    ctx.beginPath(); ctx.arc(140 + flowX, 330, 4, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(820 - flowX, 240, 4, 0, Math.PI*2); ctx.fill();
                }

                // RENDERING THE IN-WORLD INTERACTIVE OBJECT INSTEAD OF TEXT QUIZ
                ctx.fillStyle = '#111126'; ctx.fillRect(400, 120, 160, 45);
                ctx.strokeStyle = powerGridActive && !fuseSnapped ? '#00ff66' : '#475569';
                ctx.lineWidth = 1.5; ctx.strokeRect(400, 120, 160, 45);

                ctx.fillStyle = powerGridActive && !fuseSnapped ? '#00ff66' : '#94a3b8';
                ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(lvl.objectLabel, 480, 146);

                // Render Main Machine Wire Connection Slot
                ctx.fillStyle = '#060614'; ctx.fillRect(360, 290, 240, 80);
                ctx.strokeStyle = '#ffb700'; ctx.lineWidth = 2.5; ctx.strokeRect(360, 290, 240, 80);

                if (!equippedTile) {
                    ctx.fillStyle = 'rgba(255, 183, 0, 0.05)'; ctx.fillRect(360, 290, 240, 80);
                    ctx.fillStyle = '#ffb700'; ctx.font = 'bold 11px sans-serif';
                    ctx.fillText("⚠️ [ SLAM OPERATIVE COMPONENT HERE ]", 480, 337);
                }

                // Render Slapped Component Inside Socket Matrix with Vector Arcade Animations
                if (equippedTile) {
                    ctx.fillStyle = equippedTile.hue; ctx.fillRect(365, 295, 230, 70);
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.strokeRect(365, 295, 230, 70);

                    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px sans-serif';
                    ctx.fillText(`${equippedTile.icon} ${equippedTile.tag}`, 480, 337);

                    // --- ACTION ARCADE MATH ANIMATIONS ---
                    if (powerGridActive) {
                        if (equippedTile.id === 'nichrome_wire') {
                            ctx.strokeStyle = `rgb(${220 + Math.sin(frameTicks*0.3)*35}, 30, 30)`;
                            ctx.lineWidth = 6; ctx.beginPath();
                            for(let xpos = 380; xpos <= 580; xpos += 15) {
                                ctx.lineTo(xpos, 350 + (xpos%2===0 ? 10 : -10));
                            }
                            ctx.stroke();
                        }
                        if (equippedTile.id === 'thin_fuse') {
                            ctx.strokeStyle = fuseSnapped ? '#22223b' : '#ffb700'; ctx.lineWidth = 4;
                            ctx.beginPath(); ctx.moveTo(385, 350);
                            if (fuseSnapped) {
                                ctx.lineTo(465, 344); ctx.moveTo(495, 356); ctx.lineTo(575, 350);
                                ctx.fillStyle = '#ff007f'; ctx.font = 'bold 10px sans-serif';
                                ctx.fillText("💥 FUSE BLOWN!", 480, 320);
                            } else { ctx.lineTo(575, 350); }
                            ctx.stroke();
                        }
                        if (equippedTile.id === 'compass_needle') {
                            dialAngle += (Math.PI * 0.4 - dialAngle) * 0.2;
                            ctx.save(); ctx.translate(480, 352); ctx.rotate(dialAngle);
                            ctx.strokeStyle = '#ff007f'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-20); ctx.stroke();
                            ctx.strokeStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,20); ctx.stroke();
                            ctx.restore();
                        }
                        if (equippedTile.id === 'nail_coiled') {
                            ctx.strokeStyle = '#00ff66'; ctx.lineWidth = 2;
                            ctx.beginPath(); ctx.ellipse(480, 350, 60 + Math.sin(frameTicks*0.5)*15, 12, 0, 0, Math.PI*2); ctx.stroke();
                        }
                    }
                }

                // Big Operational Arcade Activation Button Strip
                ctx.fillStyle = powerGridActive ? '#ff007f' : '#00f0ff';
                ctx.fillRect(290, 442, 380, 40);
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.strokeRect(290, 442, 380, 40);
                
                ctx.fillStyle = powerGridActive ? '#ffffff' : '#020208'; 
                ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(powerGridActive ? "⚡ RE-OPEN CURRENT CIRCUITS ⚡" : "⚡ SLAM THE MAIN CURRENT BREAKER SWITCH ⚡", 480, 467);

                // Inventory Shelf Label Splitter
                ctx.textAlign = 'left'; ctx.fillStyle = '#555577'; ctx.font = 'bold 11px sans-serif'; ctx.letterSpacing = "2px";
                ctx.fillText("EQUIPMENT DISPATCH INVENTORY DECK PANELS", 30, 502); ctx.letterSpacing = "0px";

                // Mapping Custom Dynamic Inventory Tiles
                componentDeck.forEach((tile, index) => {
                    let rx = deckX + (index * 154);
                    ctx.fillStyle = '#0a0a1a'; ctx.fillRect(rx, deckY, blockW, blockH);
                    ctx.strokeStyle = '#222244'; ctx.lineWidth = 2; ctx.strokeRect(rx, deckY, blockW, blockH);

                    ctx.fillStyle = tile.hue; ctx.fillRect(rx+8, deckY+8, 6, 16);
                    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 11px sans-serif';
                    ctx.fillText(tile.tag, rx + 20, deckY + 22);

                    ctx.fillStyle = '#68688e'; ctx.font = '10px sans-serif';
                    printWrappedLine(tile.fx, rx + 10, deckY + 45, blockW - 16, 14);
                });

                // Render Live Explosion Particle Loop
                for (let p = activeParticles.length - 1; p >= 0; p--) {
                    let pt = activeParticles[p];
                    pt.x += pt.vx; pt.y += pt.vy; pt.alpha -= 0.02;
                    if (pt.alpha <= 0) { activeParticles.splice(p, 1); }
                    else {
                        ctx.fillStyle = pt.color;
                        ctx.globalAlpha = pt.alpha;
                        ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
                        ctx.globalAlpha = 1.0;
                    }
                }

                // STAGE STARTING CINEMATIC FLYING OVERLAY BANNER
                if (introBannerTicks > 0) {
                    introBannerTicks--;
                    ctx.fillStyle = 'rgba(5, 5, 15, 0.85)'; ctx.fillRect(0, 240, canvas.width, 110);
                    ctx.strokeStyle = lvl.neonTheme; ctx.lineWidth = 3; 
                    ctx.beginPath(); ctx.moveTo(0,240); ctx.lineTo(canvas.width,240); ctx.moveTo(0,350); ctx.lineTo(canvas.width,350); ctx.stroke();

                    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
                    ctx.fillText(`⚡ INCOMING STAGE AREA 0${currentLevelIdx+1} ⚡`, canvas.width/2, 292);
                    ctx.fillStyle = lvl.neonTheme; ctx.font = 'bold 12px sans-serif';
                    ctx.fillText("DEPLOY INTELLECTUAL ELECTRICAL SYSTEMS TO FIX THE MACHINERY INBOUND", canvas.width/2, 325);
                }
            }

            // ==========================================
            // STATE 3: LEVEL CLEARED / ALL STAGES CLEAR REWARD CARD
            // ==========================================
            else if (gameState === 'WIN_SCREEN') {
                ctx.fillStyle = '#020205'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Laser star cluster visual matrix fx background
                ctx.fillStyle = '#00ff66';
                for(let s=0; s<40; s++) { ctx.fillRect((s*33+frameTicks)%canvas.width, (s*19)%canvas.height, 3, 3); }

                ctx.fillStyle = '#00ff66'; ctx.font = 'bold 42px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText("🏆 ALL CIRCUITS OVERDRIVE REPAIRED!", canvas.width/2, 240);

                ctx.fillStyle = '#ffffff'; ctx.font = '20px sans-serif';
                ctx.fillText(`FINAL GRADE ARCADE HIGH SCORE: ${arcadeScore} XP POINTS`, canvas.width/2, 310);

                // Re-link core block button box layout
                ctx.fillStyle = '#ff007f'; ctx.fillRect(360, 410, 240, 50);
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px sans-serif';
                ctx.fillText("RUN SIMULATOR AGAIN 🔄", canvas.width/2, 442);
            }

            // ==========================================
            // STATE 4: SYSTEM FAILURE GAME OVER
            // ==========================================
            else if (gameState === 'GAME_OVER') {
                ctx.fillStyle = '#0d0202'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff007f'; ctx.font = 'bold 44px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText("💥 TERMINAL FAILURE BURN OUT", canvas.width/2, 240);

                ctx.fillStyle = '#68688e'; ctx.font = '16px sans-serif';
                ctx.fillText("Incompatible component impedance loads crashed the breaker loop rails.", canvas.width/2, 300);

                ctx.fillStyle = '#00f0ff'; ctx.fillRect(360, 390, 240, 50);
                ctx.fillStyle = '#020208'; ctx.font = 'bold 14px sans-serif';
                ctx.fillText("INSERT COIN / RESTART 🔄", canvas.width/2, 422);
            }

            requestAnimationFrame(renderEngineTick);
        }

        // TEXT LINE BREAKING HELPER UTILITY
        function printWrappedLine(line, x, y, maxW, lineSpc) {
            let chopped = line.split(' '); let compile = ''; let trackY = y;
            for (let i = 0; i < chopped.length; i++) {
                let test = compile + chopped[i] + ' ';
                if (ctx.measureText(test).width > maxW && i > 0) {
                    ctx.fillText(compile, x, trackY); compile = chopped[i] + ' '; trackY += lineSpc;
                } else { compile = test; }
            }
            ctx.fillText(compile, x, trackY);
        }

        // UNIFIED CLICKS ADAPTER FOR ARCADE MANAGEMENT
        function receiveClickAtCoord(mx, my) {
            if (gameState === 'ACTION_GAME') {
                if (introBannerTicks > 0) return; // Ignore input while banner flashes down

                // Click Shelf Tiles to swap out inventory nodes
                componentDeck.forEach((tile, index) => {
                    let rx = deckX + (index * 154);
                    if (mx >= rx && mx <= rx + blockW && my >= deckY && my <= deckY + blockH) {
                        SoundFX.click();
                        equippedTile = tile;
                        powerGridActive = false;
                        fuseSnapped = false;
                    }
                });

                // Click Breaker Power Engagement Strip Switch
                if (mx >= 290 && mx <= 670 && my >= 442 && my <= 482) {
                    if (!equippedTile) {
                        SoundFX.explode();
                        return;
                    }

                    SoundFX.click();
                    powerGridActive = !powerGridActive;

                    if (powerGridActive) {
                        let currentLevel = gameLevels[currentLevelIdx];
                        if (equippedTile.id === currentLevel.requiredPart) {
                            if (equippedTile.id === 'thin_fuse') fuseSnapped = true;

                            SoundFX.combo();
                            spawnSparkParticles(480, 330, '#00ff66');
                            arcadeScore += 150;

                            setTimeout(() => {
                                currentLevelIdx++;
                                if (currentLevelIdx >= gameLevels.length) {
                                    gameState = 'WIN_SCREEN';
                                } else {
                                    loadArcadeLevel();
                                }
                            }, 2500);
                        } else {
                            SoundFX.explode();
                            spawnSparkParticles(480, 330, '#ff007f');
                            playerLives--;
                            powerGridActive = false;

                            if (playerLives <= 0) {
                                setTimeout(() => { gameState = 'GAME_OVER'; }, 1000);
                            }
                        }
                    }
                }
            }
            else if (gameState === 'WIN_SCREEN' || gameState === 'GAME_OVER') {
                let boundsMinX = 360, boundsMaxX = 600;
                let boundsMinY = (gameState === 'WIN_SCREEN') ? 410 : 390;
                let boundsMaxY = (gameState === 'WIN_SCREEN') ? 460 : 440;

                if (mx >= boundsMinX && mx <= boundsMaxX && my >= boundsMinY && my <= boundsMaxY) {
                    SoundFX.click();
                    currentLevelIdx = 0; arcadeScore = 0; playerLives = 3;
                    if (gameState === 'WIN_SCREEN') {
                        gameState = 'SPLASH';
                        splashTimeStart = Date.now();
                    } else {
                        gameState = 'ACTION_GAME';
                    }
                    loadArcadeLevel();
                }
            }
        }

        // BOUNDS CALCULATOR LISTENERS CAPTURING WINDOW POSITION MATRICES
        canvas.addEventListener('mousedown', (e) => {
            const area = canvas.getBoundingClientRect();
            let mouseX = (e.clientX - area.left) * (canvas.width / area.width);
            let mouseY = (e.clientY - area.top) * (canvas.height / area.height);
            receiveClickAtCoord(mouseX, mouseY);
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) {
                const area = canvas.getBoundingClientRect();
                let touchX = (e.touches[0].clientX - area.left) * (canvas.width / area.width);
                let touchY = (e.touches[0].clientY - area.top) * (canvas.height / area.height);
                receiveClickAtCoord(touchX, touchY);
            }
        }, {passive: false});

        // IGNITE GRAPHICS TICK RUNNER
        renderEngineTick();
    </script>
</body>
</html>
