<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovine - Grade 7 Cyber-Circuit Academy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #030712;
            color: #f3f4f6;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvasFrame {
            position: relative;
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.4);
            border-radius: 24px;
            overflow: hidden;
            border: 4px solid #3b82f6;
            background-color: #090d16;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="canvasFrame">
        <canvas id="gameCanvas" width="960" height="640"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // BRANDING ASSET
        const logoImg = new Image();
        logoImg.src = 'assets/logo.png';

        // ENGINE STATES
        let gameState = 'SPLASH'; // SPLASH -> MISSION_BRIEF -> SANDBOX -> SUCCESS -> GAMEOVER
        let splashTimeStart = Date.now();
        const SPLASH_LIMIT = 5000; // Locked 5 Seconds Splash

        let currentStageIdx = 0;
        let lives = 3;
        let highscore = 0;
        let ticks = 0;

        // SELECTION MECHANICS
        let chosenHardware = null;
        let energyFlowing = false;
        let systemAlertText = "🔋 CORE STATUS: WAITING FOR COMPONENT... SNAP A TILE ONTO THE GOLD SOCKET GRID!";
        let alertColor = "#38bdf8";
        let compassAngle = 0;
        let wireMelted = false;

        // INVENTORY COMPONENT DECK (GEARED TO G7 SYLLABUS WITH GAMIFIED ICONS)
        const componentInventory = [
            { id: "switch_closed", title: "Key Switch [ON]", note: "Locks down a clean, uninterrupted loop.", hue: "#2563eb", symbol: "🔑", volts: 0 },
            { id: "battery_series", title: "Twin Battery", note: "Links cells (+ to -) for max electric punch.", hue: "#ec4899", symbol: "⚡🔋", volts: 3 },
            { id: "nichrome_wire", title: "Nichrome Coil", note: "Super high resistance turns current into heat.", hue: "#a855f7", symbol: "🌀🔥", volts: 0 },
            { id: "thin_fuse", title: "Alloy Fuse Wire", note: "The grid bodyguard! Melts down to save lines.", hue: "#f43f5e", symbol: "🛡️💥", volts: 0 },
            { id: "compass_needle", title: "Field Compass", note: "Senses current magnetic force fields nearby.", hue: "#eab308", symbol: "🧭✨", volts: 0 },
            { id: "nail_coiled", title: "Iron Core Inductor", note: "Becomes a super-magnet only when juice flows.", hue: "#10b981", symbol: "🧲⚙️", volts: 0 }
        ];

        const deckStartX = 35, deckStartY = 510, tileW = 145, tileH = 100;

        // SCIENTIFIC NARRATIVE QUESTS
        const campaignStages = [
            {
                heading: "QUEST 1: BRIDGE THE BLACKOUT GAP",
                story: "Oh no! The backup computer power rail has an open circuit air gap, causing a total blackout. Drop the dynamic mechanical tool required to turn this into a standard closed circuit so the current can travel smoothly!",
                solutionKey: "switch_closed",
                targetTerminal: { x: 480, y: 300, name: "CENTRAL LINK GATE" }
            },
            {
                heading: "QUEST 2: SUPERCHARGE THE ENGINE DRIVERS",
                story: "The command ventilation thruster is struggling! A single chemical cell cannot generate enough voltage push to rotate the motor coils. Deploy a boosted electrical source combined in series (positive to negative terminals).",
                solutionKey: "battery_series",
                targetTerminal: { x: 480, y: 300, name: "SERIES VOLTAGE PORT" }
            },
            {
                heading: "QUEST 3: IGNITE THE RECOVERY RADIATOR",
                story: "The space greenhouse is freezing! You need to mount a core element block that uses high resistance atomic drag to convert moving currents directly into extreme heating effects.",
                solutionKey: "nichrome_wire",
                targetTerminal: { x: 480, y: 300, name: "HEATER MATRIX" }
            },
            {
                heading: "QUEST 4: DROP THE SURGE ACCIDENT BREAK",
                story: "Warning! Solar flares are spiking heavy electricity lines. To prevent the computers from catching fire, lock in a safety valve designed to automatically melt and snap if excessive current flows through it.",
                solutionKey: "thin_fuse",
                targetTerminal: { x: 480, y: 300, name: "SAFETY FUSE VALVE" }
            },
            {
                heading: "QUEST 5: TRACE THE UNSEEN MAGNETIC CURRENT",
                story: "A hidden power line is leaking an invisible field! Wire up a classic historical discovery device that uses a free-floating needle to visually swivel when an electric wire acts like a temporary magnet.",
                solutionKey: "compass_needle",
                targetTerminal: { x: 480, y: 300, name: "MAGNETIC EFFECT DETECTOR" }
            },
            {
                heading: "QUEST 6: ASSEMBLING THE MAGNETIC JUNK CARRIER",
                story: "Time to load heavy iron payload pods! Wire an electromagnet that generates immense magnetic pull forces when the line is powered up, but instantly drops the payload completely when the switch breaks open.",
                solutionKey: "nail_coiled",
                targetTerminal: { x: 480, y: 300, name: "CORE APPARATUS ENGINE" }
            }
        ];

        // AUDIO EFFECTS SYSTEM
        const SoundBox = {
            audioCtx: null,
            wake() { if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); },
            beep() {
                this.wake(); let osc = this.audioCtx.createOscillator(); let g = this.audioCtx.createGain();
                osc.frequency.setValueAtTime(600, this.audioCtx.currentTime); g.gain.setValueAtTime(0.03, this.audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.06);
                osc.connect(g); g.connect(this.audioCtx.destination); osc.start(); osc.stop(this.audioCtx.currentTime + 0.06);
            },
            cheer() {
                this.wake(); let osc1 = this.audioCtx.createOscillator(); let osc2 = this.audioCtx.createOscillator(); let g = this.audioCtx.createGain();
                osc1.frequency.setValueAtTime(523.25, this.audioCtx.currentTime); osc2.frequency.setValueAtTime(659.25, this.audioCtx.currentTime + 0.08);
                g.gain.setValueAtTime(0.07, this.audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.4);
                osc1.connect(g); osc2.connect(g); g.connect(this.audioCtx.destination); osc1.start(); osc2.start();
                osc1.stop(this.audioCtx.currentTime + 0.4); osc2.stop(this.audioCtx.currentTime + 0.4);
            },
            zap() {
                this.wake(); let osc = this.audioCtx.createOscillator(); let g = this.audioCtx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, this.audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(30, this.audioCtx.currentTime + 0.25);
                g.gain.setValueAtTime(0.15, this.audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.25);
                osc.connect(g); g.connect(this.audioCtx.destination); osc.start(); osc.stop(this.audioCtx.currentTime + 0.25);
            }
        };

        function initSandboxLevel() {
            chosenHardware = null;
            energyFlowing = false;
            wireMelted = false;
            compassAngle = 0;
            systemAlertText = "⚡ COIL MATRIX STATS: IDLE. DRAG OR CLICK A TECH PART TILE BELOW TO PATCH ENGINE CORE BOARD.";
            alertColor = "#64748b";
        }

        function engineFrameUpdate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ticks++;

            // ==========================================
            // STATE 1: CORPORATE MINIMAL BRANDING INTRO
            // ==========================================
            if (gameState === 'SPLASH') {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let cx = canvas.width / 2;
                let cy = canvas.height / 2;

                if (logoImg.complete && logoImg.naturalWidth !== 0) {
                    ctx.drawImage(logoImg, cx - 70, cy - 100, 140, 140);
                } else {
                    ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 5; ctx.beginPath();
                    ctx.arc(cx, cy - 30, 40, 0, Math.PI * 2); ctx.stroke();
                    ctx.fillStyle = '#2563eb'; ctx.beginPath();
                    ctx.arc(cx, cy - 30, 12, 0, Math.PI * 2); ctx.fill();
                }

                ctx.fillStyle = '#0f172a'; ctx.font = 'bold 44px sans-serif'; ctx.letterSpacing = "5px"; ctx.textAlign = 'center';
                ctx.fillText('INNOVINE', cx, cy + 80);
                ctx.letterSpacing = "0px"; ctx.fillStyle = '#64748b'; ctx.font = 'bold 11px sans-serif';
                ctx.fillText('LIVE CIRCUIT SANDBOX & SIMULATION INTERACTIVE', cx, cy + 115);

                ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 3; ctx.beginPath();
                ctx.arc(cx, cy + 160, 14, ticks * 0.06, (ticks * 0.06) + (Math.PI * 0.5)); ctx.stroke();

                if (Date.now() - splashTimeStart > SPLASH_LIMIT) {
                    gameState = 'MISSION_BRIEF';
                    initSandboxLevel();
                }
            }

            // ==========================================
            // STATE 2: SPACE ACADEMY MISSION BRIEFING
            // ==========================================
            else if (gameState === 'MISSION_BRIEF') {
                let stageData = campaignStages[currentStageIdx];
                
                // Deep starfield cosmic background
                ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = '#1e3a8a'; ctx.lineWidth = 1;
                for(let x=0; x<canvas.width; x+=50) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
                for(let y=0; y<canvas.height; y+=50) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

                // Futuristic Card Frame
                ctx.fillStyle = '#0b1329'; ctx.fillRect(80, 100, 800, 420);
                ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 3; ctx.strokeRect(80, 100, 800, 420);

                // Cosmic Title header block
                ctx.fillStyle = '#1d4ed8'; ctx.fillRect(80, 100, 800, 50);
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left';
                ctx.fillText(`📡 INCOMING SPACE MISSION BROADCAST — STEP ${currentStageIdx+1}/6`, 110, 132);

                ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 24px sans-serif';
                ctx.fillText(stageData.heading, 110, 195);

                ctx.fillStyle = '#e2e8f0'; ctx.font = '16px sans-serif';
                printWrappedText(stageData.story, 110, 240, 740, 26);

                // Neon Action Core Button
                let pulseSize = Math.sin(ticks * 0.05) * 4;
                ctx.fillStyle = '#10b981'; 
                ctx.fillRect(330 - pulseSize/2, 420 - pulseSize/2, 300 + pulseSize, 50 + pulseSize);
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.strokeRect(330 - pulseSize/2, 420 - pulseSize/2, 300 + pulseSize, 50 + pulseSize);
                
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText('INITIALIZE WORKBENCH GRID ⚙️', 480, 451);
            }

            // ==========================================
            // STATE 3: ARCADE COIL ENERGY SANDBOX
            // ==========================================
            else if (gameState === 'SANDBOX') {
                let stageData = campaignStages[currentStageIdx];

                // Neon Gaming Header Controls
                ctx.fillStyle = '#090d16'; ctx.fillRect(0, 0, canvas.width, 65);
                ctx.strokeStyle = '#1e3a8a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0,65); ctx.lineTo(canvas.width,65); ctx.stroke();

                ctx.textAlign = 'left'; ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px sans-serif';
                ctx.fillText("🚀 INNOVINE CYBER-CIRCUIT LAB", 30, 38);

                ctx.fillStyle = '#a855f7'; ctx.fillText(`GRID AREA: ${currentStageIdx+1}/6`, 350, 38);
                ctx.fillStyle = '#facc15'; ctx.fillText(`⭐ XP POINTS: ${highscore}`, 510, 38);
                ctx.fillStyle = '#ef4444'; ctx.fillText(`❤️ LIVES LEFT: ${lives}`, 690, 38);

                // Active Circuit Board Core Layout Frame
                ctx.fillStyle = '#050b18'; ctx.fillRect(20, 85, 920, 400);
                ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2; ctx.strokeRect(20, 85, 920, 400);

                // Animated Electrical Schematic rails
                ctx.strokeStyle = energyFlowing ? '#3b82f6' : '#1e293b';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(150, 240); ctx.lineTo(150, 310); ctx.lineTo(360, 310);
                ctx.moveTo(600, 310); ctx.lineTo(810, 310); ctx.lineTo(810, 240);
                ctx.stroke();

                ctx.strokeStyle = energyFlowing ? '#10b981' : '#1e293b';
                ctx.beginPath();
                ctx.moveTo(150, 240); ctx.lineTo(480, 145); ctx.lineTo(810, 240);
                ctx.stroke();

                // Draw Animated Electron Flow particles along paths
                if (energyFlowing && !wireMelted) {
                    ctx.fillStyle = '#facc15';
                    let particleOffset = (ticks * 4) % 180;
                    ctx.beginPath(); ctx.arc(150 + particleOffset * 1.1, 310, 5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(810 - particleOffset * 1.8, 200, 5, 0, Math.PI*2); ctx.fill();
                }

                // Lab Appliance Schematic Symbols Graphic
                ctx.fillStyle = energyFlowing && !wireMelted ? '#facc15' : '#475569';
                ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(energyFlowing && !wireMelted ? "💥 [⚡ BULB GLOWING! ⚡]" : "💡 [BULB APPLIANCE]", 480, 125);

                // Render Targeted Core Socket Gate Terminal
                let term = stageData.targetTerminal;
                ctx.fillStyle = '#0f172a'; ctx.fillRect(term.x - 125, term.y - 45, 250, 90);
                ctx.strokeStyle = '#eab308'; ctx.lineWidth = 3; ctx.strokeRect(term.x - 125, term.y - 45, 250, 90);

                if (!chosenHardware) {
                    ctx.fillStyle = 'rgba(234, 179, 8, 0.05)'; ctx.fillRect(term.x - 125, term.y - 45, 250, 90);
                    ctx.fillStyle = '#eab308'; ctx.font = 'bold 11px sans-serif';
                    ctx.fillText(`[ 🛰️ PLACE ${term.name} HERE ]`, term.x, term.y + 6);
                }

                // Render In-Slot Component Module with Physics System Vector Animations
                if (chosenHardware) {
                    ctx.fillStyle = chosenHardware.hue; ctx.fillRect(365, 265, 230, 70);
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5; ctx.strokeRect(365, 265, 230, 70);

                    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
                    ctx.fillText(`${chosenHardware.symbol} ${chosenHardware.title}`, 480, 295);

                    if (energyFlowing) {
                        // Animation 1: Nichrome High-resistance Loop overheating element glow
                        if (chosenHardware.id === 'nichrome_wire') {
                            ctx.strokeStyle = `rgb(${210 + Math.sin(ticks*0.25)*45}, 40, 40)`;
                            ctx.lineWidth = 5; ctx.beginPath();
                            for(let lx = 385; lx <= 575; lx += 12) {
                                ctx.lineTo(lx, 318 + (lx%2===0 ? 9 : -9));
                            }
                            ctx.stroke();
                        }
                        // Animation 2: Alloy low-melting wire breaking completely in half
                        if (chosenHardware.id === 'thin_fuse') {
                            ctx.strokeStyle = wireMelted ? '#64748b' : '#ef4444'; ctx.lineWidth = 4;
                            ctx.beginPath(); ctx.moveTo(390, 318);
                            if (wireMelted) {
                                ctx.lineTo(470, 312); ctx.moveTo(490, 324); ctx.lineTo(570, 318);
                                systemAlertText = "🛡️ SURGE DISCHARGED: Low melting-point alloy wire split completely to protect appliances!";
                                alertColor = "#f43f5e";
                            } else {
                                ctx.lineTo(570, 318);
                            }
                            ctx.stroke();
                        }
                        // Animation 3: Floating Dial Compass Deflection mechanics
                        if (chosenHardware.id === 'compass_needle') {
                            compassAngle += (Math.PI * 0.35 - compassAngle) * 0.15;
                            ctx.save(); ctx.translate(480, 320); ctx.rotate(compassAngle);
                            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-18); ctx.stroke();
                            ctx.strokeStyle = '#94a3b8'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,18); ctx.stroke();
                            ctx.restore();
                        }
                        // Animation 4: Coiled soft iron nail magnetic flux lines
                        if (chosenHardware.id === 'nail_coiled') {
                            ctx.strokeStyle = 'rgba(16, 185, 129, 0.5)'; ctx.lineWidth = 2;
                            ctx.beginPath(); ctx.ellipse(480, 318, 50 + Math.sin(ticks*0.4)*12, 14, 0, 0, Math.PI*2); ctx.stroke();
                        }
                    }
                }

                // Interactive Activity Terminal Dialogue Monitor Screen
                ctx.fillStyle = '#020617'; ctx.fillRect(20, 405, 920, 40);
                ctx.fillStyle = alertColor; ctx.font = 'bold 12.5px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(systemAlertText, canvas.width/2, 429);

                // Action Launch Ignition Command Button Box
                ctx.fillStyle = energyFlowing ? '#ef4444' : '#2563eb';
                ctx.fillRect(710, 452, 230, 33);
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(energyFlowing ? "💥 DISCONNECT POWER LOOP" : "ENGAGE POWER IGNITION ⚡", 825, 473);

                // Modular Asset Shelf Title
                ctx.textAlign = 'left'; ctx.fillStyle = '#4b5563'; ctx.font = 'bold 11px sans-serif'; ctx.letterSpacing = "2px";
                ctx.fillText("SPACE SHIP INVENTORY COMPONENT DOCK TILES", 35, 502); ctx.letterSpacing = "0px";

                // Generate Arcade Style Grid Tiles Selection Shelf
                componentInventory.forEach((tile, index) => {
                    let tx = deckStartX + (index * 152);
                    ctx.fillStyle = '#0f172a'; ctx.fillRect(tx, deckStartY, tileW, tileH);
                    ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2; ctx.strokeRect(tx, deckStartY, tileW, tileH);

                    ctx.fillStyle = tile.hue; ctx.fillRect(tx+8, deckStartY+8, 5, 15);
                    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px sans-serif';
                    ctx.fillText(tile.title, tx + 18, deckStartY + 20);

                    ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif';
                    printWrappedText(tile.note, tx + 10, deckStartY + 42, tileW - 16, 13);
                });
            }

            // ==========================================
            // STATE 4: SUCCESS LEVEL CLEARED REWARD CARD
            // ==========================================
            else if (gameState === 'SUCCESS') {
                let stageData = campaignStages[currentStageIdx];
                ctx.fillStyle = '#030712'; ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#10b981'; ctx.font = 'bold 36px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText("🚀 CIRCUIT LEVEL FULLY SECURED!", canvas.width/2, 190);

                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 15px sans-serif';
                ctx.fillText("Grade 7 Electric Core Concept Mastered:", canvas.width/2, 250);

                ctx.fillStyle = '#38bdf8'; ctx.font = 'italic 15px sans-serif';
                printWrappedText(`"${stageData.story}"`, canvas.width/2, 290, 760, 24);

                // Next Matrix Level Block Link
                ctx.fillStyle = '#2563eb'; ctx.fillRect(360, 460, 240, 50);
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px sans-serif';
                ctx.fillText("NEXT SCHEMATIC RADAR", canvas.width/2, 491);
            }

            // ==========================================
            // STATE 5: SHUTDOWN POWER OVERLOAD RESET
            // ==========================================
            else if (gameState === 'GAMEOVER') {
                ctx.fillStyle = '#110606'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ef4444'; ctx.font = 'bold 38px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText("⚡ SHIP POWER OVERLOAD BREAKDOWN ⚡", canvas.width/2, 230);

                ctx.fillStyle = '#94a3b8'; ctx.font = '16px sans-serif';
                ctx.fillText("Impedance mismatch or open circuit fault caused a systems meltdown.", canvas.width/2, 290);

                ctx.fillStyle = '#ef4444'; ctx.fillRect(360, 380, 240, 50);
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px sans-serif';
                ctx.fillText("REBOOT CENTRAL SHIP REACTOR", canvas.width/2, 411);
            }

            requestAnimationFrame(engineFrameUpdate);
        }

        // TEXT MULTILINE PARSER WRAPPER CHOPPER
        function printWrappedText(msg, x, y, maxW, lineSpc) {
            let broken = msg.split(' '); let rowStr = ''; let targetY = y;
            for (let i = 0; i < broken.length; i++) {
                let testRow = rowStr + broken[i] + ' ';
                if (ctx.measureText(testRow).width > maxW && i > 0) {
                    ctx.fillText(rowStr, x, targetY); rowStr = broken[i] + ' '; targetY += lineSpc;
                } else { rowStr = testRow; }
            }
            ctx.fillText(rowStr, x, targetY);
        }

        // UNIFIED CLICKS ENGINE MANAGEMENT MATH
        function dispatchTapCoordinates(mx, my) {
            if (gameState === 'MISSION_BRIEF') {
                if (mx >= 330 && mx <= 630 && my >= 420 && my <= 470) {
                    SoundBox.beep(); gameState = 'SANDBOX';
                }
            }
            else if (gameState === 'SANDBOX') {
                // Check shelf tile clicks to load parts
                componentInventory.forEach((tile, idx) => {
                    let tx = deckStartX + (idx * 152);
                    if (mx >= tx && mx <= tx + tileW && my >= deckStartY && my <= deckStartY + tileH) {
                        SoundBox.beep();
                        chosenHardware = tile;
                        energyFlowing = false;
                        wireMelted = false;
                        systemAlertText = `📡 MODULE SNAP-IN: ${tile.title} loaded into connection terminal block. Engage switch to evaluate current flow.`;
                        alertColor = "#c084fc";
                    }
                });

                // Check Action Button Click trigger matrix
                if (mx >= 710 && mx <= 940 && my >= 452 && my <= 485) {
                    SoundBox.beep();
                    if (!chosenHardware) {
                        systemAlertText = "⚠ SYSTEM WARNING: Unloaded grid node path. Drop a physics tool tile into the slot before turning on power!";
                        alertColor = "#eab308";
                        return;
                    }

                    energyFlowing = !energyFlowing;

                    if (energyFlowing) {
                        let levelDef = campaignStages[currentStageIdx];
                        if (chosenHardware.id === levelDef.solutionKey) {
                            if (chosenHardware.id === 'thin_fuse') wireMelted = true;
                            
                            SoundBox.cheer();
                            systemAlertText = "🟢 PATH CALIBRATION PASS: Complete loop verified. Electric current effects running within margins.";
                            alertColor = "#10b981";
                            highscore += 20;

                            setTimeout(() => { gameState = 'SUCCESS'; }, 3200);
                        } else {
                            SoundBox.zap();
                            systemAlertText = "🚨 IMPEDANCE FAULT CRASH: Incompatible electrical loop configuration or open circuit line! Restarting core node...";
                            alertColor = "#f43f5e";
                            lives--;
                            energyFlowing = false;

                            if (lives <= 0) {
                                setTimeout(() => { gameState = 'GAMEOVER'; }, 1200);
                            }
                        }
                    }
                }
            }
            else if (gameState === 'SUCCESS') {
                if (mx >= 360 && mx <= 600 && my >= 460 && my <= 510) {
                    SoundBox.beep();
                    currentStageIdx++;
                    if (currentStageIdx >= campaignStages.length) {
                        currentStageIdx = 0; highscore = 0; lives = 3;
                        gameState = 'SPLASH';
                        splashTimeStart = Date.now();
                    } else {
                        gameState = 'MISSION_BRIEF';
                    }
                    initSandboxLevel();
                }
            }
            else if (gameState === 'GAMEOVER') {
                if (mx >= 360 && mx <= 600 && my >= 380 && my <= 430) {
                    SoundBox.beep();
                    currentStageIdx = 0; highscore = 0; lives = 3;
                    gameState = 'SANDBOX';
                    initSandboxLevel();
                }
            }
        }

        // INPUT EVENT CAPTURE REGISTRATION
        canvas.addEventListener('mousedown', (e) => {
            const boundary = canvas.getBoundingClientRect();
            let mouseX = (e.clientX - boundary.left) * (canvas.width / boundary.width);
            let mouseY = (e.clientY - boundary.top) * (canvas.height / boundary.height);
            dispatchTapCoordinates(mouseX, mouseY);
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) {
                const boundary = canvas.getBoundingClientRect();
                let touchX = (e.touches[0].clientX - boundary.left) * (canvas.width / boundary.width);
                let touchY = (e.touches[0].clientY - boundary.top) * (canvas.height / boundary.height);
                dispatchTapCoordinates(touchX, touchY);
            }
        }, {passive: false});

        // RUN ENGINE TICK OVERLOOP
        engineFrameUpdate();
    </script>
</body>
</html>
