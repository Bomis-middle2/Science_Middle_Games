<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovine - Magic Toybox Arcade</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffeff5;
            color: #333333;
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvasFrame {
            position: relative;
            box-shadow: 0 15px 40px rgba(255, 105, 180, 0.4);
            border-radius: 30px;
            overflow: hidden;
            border: 8px solid #ff69b4;
            background-color: #ffffff;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="canvasFrame">
        <canvas id="gameCanvas" width="960" height="640"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // BRANDING ASSET
        const logoImg = new Image();
        logoImg.src = 'assets/logo.png';

        // ENGINE STATES
        let gameState = 'SPLASH'; // SPLASH -> TOY_GAME -> PARTY_WIN -> OOPS_OVER
        let splashTimeStart = Date.now();
        const SPLASH_LIMIT = 5000; // Exact 5-second branding lock

        let levelIdx = 0;
        let livesLeft = 3;
        let starsCollected = 0;
        let clockTicks = 0;
        let welcomeBannerTimer = 90;

        // SELECTION VARIABLES
        let activeToyItem = null;
        let wirePowerActive = false;
        let safetyPopTriggered = false;
        let compassSpin = 0;
        let magicSparks = [];

        // Animation helper variables for visual world objects
        let blenderAngle = 0;
        let craneY = 0;

        // TOYBOX TOOLBAR TILES (GAMIFIED ITEMS FOR GRADE 7 SCIENCE OUTCOMES)
        const magicToybox = [
            { id: "switch_closed", tag: "Loop Snapper", bubble: "🔑 Close the Gap", shade: "#4caf50", trick: "Snaps open wire paths back together!" },
            { id: "battery_series", tag: "Super Double Juice", bubble: "🔋⚡ Extra Power", shade: "#ff5722", trick: "Stacks two power cells for double speed!" },
            { id: "nichrome_wire", tag: "Toasty Glow Ribbon", bubble: "🌀🔥 Warm Coil", shade: "#9c27b0", trick: "Squeezes current to make cozy heat waves!" },
            { id: "thin_fuse", tag: "Safety Pop Ribbon", bubble: "🛡️💥 Pop Shield", shade: "#ffeb3b", trick: "Melts and breaks safely to stop big surges!" },
            { id: "compass_needle", tag: "Wiggle Dial Finder", bubble: "🧭✨ Magic Arrow", shade: "#2196f3", trick: "Spins and points whenever wire power is close!" },
            { id: "nail_coiled", tag: "Clicky Toy Magnet", bubble: "🧲⚙️ Heavy Lifter", shade: "#e91e63", trick: "Becomes a super strong metal lifter with power!" }
        ];

        const shelfX = 25, shelfY = 515, cardW = 146, cardH = 95;

        // RE-IMAGINED CHILD-FRIENDLY MISSIONS (NO TECH TEXT CORES)
        const happyQuests = [
            {
                cryAlert: "🐰 Barnaby Bunny's bedroom nightlight wire has an open gap! Help him fix the wire path!",
                targetZoneLabel: "BUNNY'S NIGHTLIGHT",
                neededKey: "switch_closed",
                brightTone: "#4caf50"
            },
            {
                cryAlert: "🐧 Penny Penguin's ice cream blender motor is spinning too slow! Give it double battery push!",
                targetZoneLabel: "ICE CREAM BLENDER",
                neededKey: "battery_series",
                brightTone: "#ff5722"
            },
            {
                cryAlert: "🐶 Pip the Puppy is freezing! Drop a high-resistance element ribbon to warm his blanket!",
                targetZoneLabel: "COZY DOGGY BLANKET",
                neededKey: "nichrome_wire",
                brightTone: "#9c27b0"
            },
            {
                cryAlert: "🐭 Mimi Mouse's dollhouse wire is getting too much electricity! Add a safety fuse wire to pop it!",
                targetZoneLabel: "DOLLHOUSE SHIELD VALVE",
                neededKey: "thin_fuse",
                brightTone: "#ffeb3b"
            },
            {
                cryAlert: "🦉 Olly the Owl lost his favorite metal toy key inside a hollow wall track! Use a detector dial!",
                targetZoneLabel: "SECRET WALL TRACK",
                neededKey: "compass_needle",
                brightTone: "#2196f3"
            },
            {
                cryAlert: "🐵 Max the Monkey wants to lift heavy metal blocks out of his sandbox! Make a powerful magnet!",
                targetZoneLabel: "MONKEY'S TOY CRANE",
                neededKey: "nail_coiled",
                brightTone: "#e91e63"
            }
        ];

        // FUN AUDIO SYSTEM
        const ToyAudio = {
            ctx: null,
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            clickPop() {
                this.init(); let osc = this.ctx.createOscillator(); let g = this.ctx.createGain();
                osc.frequency.setValueAtTime(700, this.ctx.currentTime); g.gain.setValueAtTime(0.04, this.ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);
                osc.connect(g); g.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.06);
            },
            happyDing() {
                this.init(); let o1 = this.ctx.createOscillator(); let o2 = this.ctx.createOscillator(); let g = this.ctx.createGain();
                o1.type = 'triangle'; o1.frequency.setValueAtTime(523.25, this.ctx.currentTime);
                o2.type = 'triangle'; o2.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.08);
                g.gain.setValueAtTime(0.08, this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
                o1.connect(g); o2.connect(g); g.connect(this.ctx.destination); o1.start(); o2.start();
                o1.stop(this.ctx.currentTime + 0.35); o2.stop(this.ctx.currentTime + 0.35);
            },
            sadBuzz() {
                this.init(); let osc = this.ctx.createOscillator(); let g = this.ctx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(60, this.ctx.currentTime + 0.3);
                g.gain.setValueAtTime(0.12, this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
                osc.connect(g); g.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.3);
            }
        };

        function createSparkleGroup(sx, sy, hue) {
            for(let i=0; i<30; i++) {
                magicSparks.push({
                    x: sx, y: sy,
                    dx: (Math.random() - 0.5) * 7,
                    dy: (Math.random() - 0.5) * 7,
                    r: Math.random() * 5 + 3,
                    opacity: 1,
                    hue: hue
                });
            }
        }

        function resetToyRound() {
            activeToyItem = null;
            wirePowerActive = false;
            safetyPopTriggered = false;
            compassSpin = 0;
            welcomeBannerTimer = 90;
            craneY = 0;
        }

        function runGameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            clockTicks++;

            // ==========================================
            // STATE 1: CORPORATE MINIMAL BRANDING INTRO
            // ==========================================
            if (gameState === 'SPLASH') {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let cx = canvas.width / 2;
                let cy = canvas.height / 2;

                if (logoImg.complete && logoImg.naturalWidth !== 0) {
                    ctx.drawImage(logoImg, cx - 70, cy - 100, 140, 140);
                } else {
                    ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 5; ctx.beginPath();
                    ctx.arc(cx, cy - 30, 40, 0, Math.PI * 2); ctx.stroke();
                    ctx.fillStyle = '#2563eb'; ctx.beginPath();
                    ctx.arc(cx, cy - 30, 12, 0, Math.PI * 2); ctx.fill();
                }

                ctx.fillStyle = '#0f172a'; ctx.font = 'bold 44px sans-serif'; ctx.letterSpacing = "5px"; ctx.textAlign = 'center';
                ctx.fillText('INNOVINE', cx, cy + 80);
                ctx.letterSpacing = "0px"; ctx.fillStyle = '#64748b'; ctx.font = 'bold 11px sans-serif';
                ctx.fillText('LIVE CIRCUIT SANDBOX & SIMULATION INTERACTIVE', cx, cy + 115);

                ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 3; ctx.beginPath();
                ctx.arc(cx, cy + 160, 14, clockTicks * 0.06, (clockTicks * 0.06) + (Math.PI * 0.5)); ctx.stroke();

                if (Date.now() - splashTimeStart > SPLASH_LIMIT) {
                    gameState = 'TOY_GAME';
                    resetToyRound();
                }
            }

            // ==========================================
            // STATE 2: ACTIVE PLAY TOYBOX ARCADE BOARD
            // ==========================================
            else if (gameState === 'TOY_GAME') {
                let round = happyQuests[levelIdx];

                // Cute Candy Header Top Dashboard
                ctx.fillStyle = '#fff0f5'; ctx.fillRect(0, 0, canvas.width, 65);
                ctx.strokeStyle = '#ff69b4'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0,65); ctx.lineTo(canvas.width,65); ctx.stroke();

                ctx.textAlign = 'left'; ctx.fillStyle = '#ff1493'; ctx.font = 'bold 16px sans-serif';
                ctx.fillText("🎈 CUTE TOYBOX ANIMAL RESCUE!", 25, 38);

                ctx.fillStyle = '#9c27b0'; ctx.fillText(`ROOM: ${levelIdx+1} / 6`, 360, 38);
                ctx.fillStyle = '#ff9800'; ctx.fillText(`⭐ GOLD STARS: ${starsCollected}`, 510, 38);
                
                // Kid-friendly heart score counters
                ctx.fillStyle = '#e91e63'; ctx.fillText("LIVES:", 740, 38);
                for(let k=0; k<3; k++) {
                    ctx.fillStyle = k < livesLeft ? '#e91e63' : '#e0e0e0';
                    ctx.font = '20px sans-serif';
                    ctx.fillText(k < livesLeft ? "❤️" : "🤍", 815 + (k * 26), 41);
                }

                // Toy Board Center Frame Workspace
                ctx.fillStyle = '#fffdf9'; ctx.fillRect(20, 80, 920, 415);
                ctx.strokeStyle = '#ffe4e1'; ctx.lineWidth = 3; ctx.strokeRect(20, 80, 920, 415);

                // Upper bubble containing the animal request ticker
                ctx.fillStyle = '#e0f7fa'; ctx.fillRect(35, 95, 890, 42);
                ctx.strokeStyle = '#00bcd4'; ctx.lineWidth = 1.5; ctx.strokeRect(35, 95, 890, 42);
                
                ctx.fillStyle = '#006064'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(round.cryAlert, canvas.width/2, 121);

                // Render Magical Colored Connecting Track Wire Tracks
                ctx.strokeStyle = wirePowerActive ? '#ffeb3b' : '#d7ccc8';
                ctx.lineWidth = 6; ctx.beginPath();
                ctx.moveTo(140, 260); ctx.lineTo(140, 330); ctx.lineTo(360, 330);
                ctx.moveTo(600, 330); ctx.lineTo(820, 330); ctx.lineTo(820, 260);
                ctx.stroke();

                ctx.strokeStyle = wirePowerActive && !safetyPopTriggered ? '#4caf50' : '#d7ccc8';
                ctx.beginPath(); ctx.moveTo(140, 260); ctx.lineTo(480, 190); ctx.lineTo(820, 260); ctx.stroke();

                // Cute Flow Dot Particles
                if (wirePowerActive && !safetyPopTriggered) {
                    ctx.fillStyle = '#ffeb3b';
                    let motionPos = (clockTicks * 6) % 220;
                    ctx.beginPath(); ctx.arc(140 + motionPos, 330, 6, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(820 - motionPos, 230, 6, 0, Math.PI*2); ctx.fill();
                }

                // --- DYNAMIC VISUAL WORLD OBJECTS ---
                ctx.save();
                ctx.translate(480, 150);
                let isWorking = wirePowerActive && !safetyPopTriggered;

                if (levelIdx === 0) { // Nightlight
                    ctx.fillStyle = isWorking ? '#ffeb3b' : '#b0bec5';
                    if (isWorking) {
                        ctx.shadowBlur = 20; ctx.shadowColor = '#ffeb3b';
                    }
                    ctx.beginPath(); ctx.arc(0, -10, 20, 0, Math.PI, true); ctx.lineTo(10, 10); ctx.lineTo(-10, 10); ctx.closePath(); ctx.fill();
                } 
                else if (levelIdx === 1) { // Blender
                    ctx.fillStyle = '#e0a899'; ctx.fillRect(-20, -10, 40, 30);
                    ctx.fillStyle = '#b0bec5'; ctx.fillRect(-15, -25, 30, 15);
                    if (isWorking) blenderAngle += 0.3;
                    ctx.save(); ctx.translate(0, -17); ctx.rotate(blenderAngle);
                    ctx.strokeStyle = '#555'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(20, 0); ctx.moveTo(0, -20); ctx.lineTo(0, 20); ctx.stroke();
                    ctx.restore();
                } 
                else if (levelIdx === 2) { // Blanket
                    ctx.fillStyle = isWorking ? '#ff4081' : '#b0bec5';
                    ctx.fillRect(-35, -15, 70, 25);
                    if (isWorking) {
                        ctx.strokeStyle = '#ff9800'; ctx.lineWidth = 2;
                        ctx.beginPath();
                        for (let wave = -25; wave <= 25; wave += 16) {
                            ctx.moveTo(wave, -20);
                            ctx.quadraticCurveTo(wave + 4, -25 + Math.sin(clockTicks * 0.1) * 3, wave + 8, -20);
                        }
                        ctx.stroke();
                    }
                } 
                else if (levelIdx === 3) { // Dollhouse Shield
                    ctx.fillStyle = '#cfd8dc'; ctx.fillRect(-25, -15, 50, 30);
                    ctx.beginPath(); ctx.moveTo(-30, -15); ctx.lineTo(0, -35); ctx.lineTo(30, -15); ctx.closePath(); ctx.fillStyle = '#ff7043'; ctx.fill();
                    if (isWorking) {
                        ctx.strokeStyle = 'rgba(0, 230, 118, 0.6)'; ctx.lineWidth = 4;
                        ctx.beginPath(); ctx.arc(0, -5, 45, 0, Math.PI * 2); ctx.stroke();
                    }
                } 
                else if (levelIdx === 4) { // Secret Track Key Detector
                    ctx.fillStyle = '#78909c'; ctx.fillRect(-40, -10, 80, 20);
                    if (isWorking) {
                        ctx.fillStyle = '#ffeb3b'; font = '16px sans-serif';
                        ctx.fillText("🔑 FOUND!", 0, -20);
                    }
                } 
                else if (levelIdx === 5) { // Crane Magnet
                    ctx.fillStyle = '#546e7a'; ctx.fillRect(-10, -35, 20, 15);
                    if (isWorking && craneY < 15) craneY += 1;
                    if (!isWorking && craneY > 0) craneY -= 1;
                    ctx.fillStyle = '#37474f'; ctx.fillRect(-15, -20 + craneY, 30, 10); // Magnet shoe
                    if (isWorking) {
                        ctx.fillStyle = '#cfd8dc'; ctx.fillRect(-10, -5 + craneY, 20, 10); // Lifted blocks
                    }
                }
                ctx.restore();

                // Object indicator tag text
                ctx.fillStyle = '#78909c'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(round.targetZoneLabel, 480, 195);

                // Main Drop Toy Block Socket Holder
                ctx.fillStyle = '#ffffff'; ctx.fillRect(360, 290, 240, 80);
                ctx.strokeStyle = '#ff9800'; ctx.lineWidth = 3; ctx.strokeRect(360, 290, 240, 80);

                if (!activeToyItem) {
                    ctx.fillStyle = 'rgba(255, 152, 0, 0.04)'; ctx.fillRect(360, 290, 240, 80);
                    ctx.fillStyle = '#ff9800'; ctx.font = 'bold 11px sans-serif';
                    ctx.fillText("🎁 [ CLAP A FUN MAGIC TILE HERE ]", 480, 336);
                }

                // Render Active Placed Toy Block with Interactive Simple Animations
                if (activeToyItem) {
                    ctx.fillStyle = activeToyItem.shade; ctx.fillRect(365, 295, 230, 70);
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.strokeRect(365, 295, 230, 70);

                    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px sans-serif';
                    ctx.fillText(`${activeToyItem.bubble}`, 480, 337);

                    // Child-friendly Physics Effect Graphics
                    if (wirePowerActive) {
                        if (activeToyItem.id === 'nichrome_wire') {
                            ctx.strokeStyle = '#ff1493'; ctx.lineWidth = 6; ctx.beginPath();
                            for(let jx = 380; jx <= 580; jx += 16) {
                                ctx.lineTo(jx, 350 + (jx%2===0 ? 8 : -8));
                            }
                            ctx.stroke();
                        }
                        if (activeToyItem.id === 'thin_fuse') {
                            ctx.strokeStyle = safetyPopTriggered ? '#90a4ae' : '#ffeb3b'; ctx.lineWidth = 5;
                            ctx.beginPath(); ctx.moveTo(380, 350);
                            if (safetyPopTriggered) {
                                ctx.lineTo(460, 345); ctx.moveTo(500, 355); ctx.lineTo(580, 350);
                                ctx.fillStyle = '#e91e63'; ctx.font = 'bold 11px sans-serif';
                                ctx.fillText("💥 POP! SHIELD BROKE SAFELY!", 480, 322);
                            } else { ctx.lineTo(580, 350); }
                            ctx.stroke();
                        }
                        if (activeToyItem.id === 'compass_needle') {
                            compassSpin += (Math.PI * 0.45 - compassSpin) * 0.15;
                            ctx.save(); ctx.translate(480, 350); ctx.rotate(compassSpin);
                            ctx.strokeStyle = '#ff1493'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-20); ctx.stroke();
                            ctx.strokeStyle = '#b0bec5'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,20); ctx.stroke();
                            ctx.restore();
                        }
                        if (activeToyItem.id === 'nail_coiled') {
                            ctx.strokeStyle = '#00bcd4'; ctx.lineWidth = 3;
                            ctx.beginPath(); ctx.ellipse(480, 350, 55 + Math.sin(clockTicks*0.4)*12, 10, 0, 0, Math.PI*2); ctx.stroke();
                        }
                    }
                }

                // Big Round Bouncing Switch Bar Button
                let bounceVal = Math.sin(clockTicks * 0.08) * 2;
                ctx.fillStyle = wirePowerActive ? '#ff4081' : '#00e676';
                ctx.fillRect(260 - bounceVal, 440, 440 + bounceVal*2, 40);
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.strokeRect(260 - bounceVal, 440, 440 + bounceVal*2, 40);
                
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(wirePowerActive ? "🎈 CLICK TO TURN POWER COILS OFF" : "⭐ FLIP THE MAGIC SWITCH POWER ON! ⭐", 480, 465);

                // Dynamic Ribbon Header Labels
                ctx.textAlign = 'left'; ctx.fillStyle = '#b0bec5'; ctx.font = 'bold 11px sans-serif'; ctx.letterSpacing = "2px";
                ctx.fillText("PICK A TOY ITEM TILE TO FIX THE ANIMAL ROOMS", 35, 501); ctx.letterSpacing = "0px";

                // Map Cute Toolbar Tiles Choice Shelf
                magicToybox.forEach((tile, ind) => {
                    let rx = shelfX + (ind * 154);
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(rx, shelfY, cardW, cardH);
                    ctx.strokeStyle = '#eceff1'; ctx.lineWidth = 2; ctx.strokeRect(rx, shelfY, cardW, cardH);

                    ctx.fillStyle = tile.shade; ctx.fillRect(rx+6, shelfY+6, cardW-12, 24);
                    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
                    ctx.fillText(tile.tag, rx + cardW/2, shelfY + 22);

                    ctx.fillStyle = '#78909c'; ctx.font = '10px sans-serif'; ctx.textAlign = 'left';
                    wrapChildText(tile.trick, rx + 10, shelfY + 46, cardW - 16, 14);
                });

                // Particle Spawner Loop
                for (let s = magicSparks.length - 1; s >= 0; s--) {
                    let sp = magicSparks[s];
                    sp.x += sp.dx; sp.y += sp.dy; sp.opacity -= 0.02;
                    if (sp.opacity <= 0) { magicSparks.splice(s, 1); }
                    else {
                        ctx.fillStyle = sp.hue; ctx.globalAlpha = sp.opacity;
                        ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI*2); ctx.fill();
                        ctx.globalAlpha = 1.0;
                    }
                }

                // STAGE WELCOME ANIMATED ALERT OVERLAY
                if (welcomeBannerTimer > 0) {
                    welcomeBannerTimer--;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; ctx.fillRect(0, 240, canvas.width, 110);
                    ctx.strokeStyle = round.brightTone; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(0,240); ctx.lineTo(canvas.width,240); ctx.moveTo(0,350); ctx.lineTo(canvas.width,350); ctx.stroke();

                    ctx.fillStyle = '#ff1493'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
                    ctx.fillText(`🐾 ROOM STEP 0${levelIdx+1} GO! 🐾`, canvas.width/2, 292);
                    ctx.fillStyle = '#555555'; ctx.font = 'bold 12px sans-serif';
                    ctx.fillText("CHOOSE THE BEST TOY OBJECT FROM THE BOTTOM SHELF TO CURE THE PROBLEM!", canvas.width/2, 324);
                }
            }

            // ==========================================
            // STATE 3: CELEBRATION WIN PARTY
            // ==========================================
            else if (gameState === 'PARTY_WIN') {
                ctx.fillStyle = '#e8f5e9'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Fun Confetti rain loop
                ctx.fillStyle = '#ffcf33';
                for(let c=0; c<50; c++) { ctx.fillRect((c*45+clockTicks*2)%canvas.width, (c*23)%canvas.height, 6, 6); }

                ctx.fillStyle = '#4caf50'; ctx.font = 'bold 36px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText("🏆 HURRAY! YOU SAVED ALL THE LITTLE ANIMALS!", canvas.width/2, 240);

                ctx.fillStyle = '#ff9800'; ctx.font = 'bold 20px sans-serif';
                ctx.fillText(`⭐ YOU EARNED A HIGHSCORE OF: ${starsCollected} STARS! ⭐`, canvas.width/2, 310);

                ctx.fillStyle = '#ff4081'; ctx.fillRect(360, 400, 240, 50);
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px sans-serif';
                ctx.fillText("PLAY AGAIN FOR FUN 🔄", canvas.width/2, 432);
            }

            // ==========================================
            // STATE 4: OOPSIE RESET SCREEN
            // ==========================================
            else if (gameState === 'OOPS_OVER') {
                ctx.fillStyle = '#fff5f5'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f44336'; ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText("😭 OOPS! SYSTEMS GOT POOPED OUT!", canvas.width/2, 240);

                ctx.fillStyle = '#757575'; ctx.font = '15px sans-serif';
                ctx.fillText("The toy elements mismatched or lines were broken. Let's reset and help them again!", canvas.width/2, 300);

                ctx.fillStyle = '#00bcd4'; ctx.fillRect(360, 380, 240, 50);
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px sans-serif';
                ctx.fillText("TRY THE TOYBOX AGAIN 🔄", canvas.width/2, 412);
            }

            requestAnimationFrame(runGameLoop);
        }

        // TEXT WORD WRAPPING CHOP MATRIX
        function wrapChildText(msg, x, y, maxW, lineSpc) {
            let spaceTokens = msg.split(' '); let buffer = ''; let currY = y;
            for (let i = 0; i < spaceTokens.length; i++) {
                let checkRow = buffer + spaceTokens[i] + ' ';
                if (ctx.measureText(checkRow).width > maxW && i > 0) {
                    ctx.fillText(buffer, x, currY); buffer = spaceTokens[i] + ' '; currY += lineSpc;
                } else { buffer = checkRow; }
            }
            ctx.fillText(buffer, x, currY);
        }

        // CLICK EVENT LISTENER ROUTER
        function executeClickActions(mx, my) {
            if (gameState === 'TOY_GAME') {
                if (welcomeBannerTimer > 0) return; // Disallow taps while the stage banner plays

                // Tap shelf cards to lock tools
                magicToybox.forEach((tile, index) => {
                    let rx = shelfX + (index * 154);
                    if (mx >= rx && mx <= rx + cardW && my >= shelfY && my <= shelfY + cardH) {
                        ToyAudio.clickPop();
                        activeToyItem = tile;
                        wirePowerActive = false;
                        safetyPopTriggered = false;
                    }
                });

                // Tap bottom switch launcher bars
                if (mx >= 260 && mx <= 700 && my >= 440 && my <= 480) {
                    if (!activeToyItem) {
                        ToyAudio.sadBuzz();
                        return;
                    }

                    ToyAudio.clickPop();
                    wirePowerActive = !wirePowerActive;

                    if (wirePowerActive) {
                        let activeQuest = happyQuests[levelIdx];
                        if (activeToyItem.id === activeQuest.neededKey) {
                            if (activeToyItem.id === 'thin_fuse') safetyPopTriggered = true;

                            ToyAudio.happyDing();
                            createSparkleGroup(480, 330, '#ffeb3b');
                            starsCollected += 100;

                            setTimeout(() => {
                                levelIdx++;
                                if (levelIdx >= happyQuests.length) {
                                    gameState = 'PARTY_WIN';
                                } else {
                                    resetToyRound();
                                }
                            }, 2500);
                        } else {
                            ToyAudio.sadBuzz();
                            createSparkleGroup(480, 330, '#f44336');
                            livesLeft--;
                            wirePowerActive = false;

                            if (livesLeft <= 0) {
                                setTimeout(() => { gameState = 'OOPS_OVER'; }, 1000);
                            }
                        }
                    }
                }
            }
            else if (gameState === 'PARTY_WIN' || gameState === 'OOPS_OVER') {
                let minX = 360, maxX = 600;
                let minY = (gameState === 'PARTY_WIN') ? 400 : 380;
                let maxY = (gameState === 'PARTY_WIN') ? 450 : 430;

                if (mx >= minX && mx <= maxX && my >= minY && my <= maxY) {
                    ToyAudio.clickPop();
                    levelIdx = 0; starsCollected = 0; livesLeft = 3;
                    if (gameState === 'PARTY_WIN') {
                        gameState = 'SPLASH';
                        splashTimeStart = Date.now();
                    } else {
                        gameState = 'TOY_GAME';
                    }
                    resetToyRound();
                }
            }
        }

        // BOUNDS EVENTS CAPTURER ADAPTERS
        canvas.addEventListener('mousedown', (e) => {
            const loc = canvas.getBoundingClientRect();
            let clickX = (e.clientX - loc.left) * (canvas.width / loc.width);
            let clickY = (e.clientY - loc.top) * (canvas.height / loc.height);
            executeClickActions(clickX, clickY);
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) {
                const loc = canvas.getBoundingClientRect();
                let touchX = (e.touches[0].clientX - loc.left) * (canvas.width / loc.width);
                let touchY = (e.touches[0].clientY - loc.top) * (canvas.height / loc.height);
                executeClickActions(touchX, touchY);
            }
        }, {passive: false});

        // ACTIVATE GRAPHICS RENDERING SYSTEM
        runGameLoop();
    </script>
</body>
</html>
