<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Optics Lab - Concept Quest</title>
<style>
:root {
    --bg: #0f172a;
    --panel-bg: #1e293b;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --cyan: #38bdf8;
    --amber: #fbbf24;
    --emerald: #34d399;
    --rose: #f87171;
}
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, sans-serif;
    user-select: none;
}
body {
    background-color: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
#game-container {
    width: 100%;
    max-width: 950px;
    background: var(--panel-bg);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    gap: 15px;
}
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #334155;
    padding-bottom: 12px;
}
.title {
    font-size: 1.4rem;
    color: var(--cyan);
    font-weight: bold;
}
.score {
    font-weight: bold;
    color: var(--amber);
}
.layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}
@media(max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
}
.canvas-container {
    background: #090d16;
    border: 1px solid #334155;
    border-radius: 8px;
    height: 280px;
    position: relative;
}
canvas {
    width: 100%;
    height: 100%;
}
.quiz-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.question-box {
    font-size: 1.05rem;
    font-weight: 600;
    line-height: 1.4;
    background: #111827;
    padding: 15px;
    border-radius: 6px;
    border-left: 4px solid var(--cyan);
}
.options-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.option-btn {
    background: #334155;
    border: 1px solid #475569;
    color: var(--text);
    padding: 12px;
    border-radius: 6px;
    text-align: left;
    cursor: pointer;
    font-size: 0.95rem;
    transition: background 0.2s;
}
.option-btn:hover {
    background: #475569;
}
.feedback {
    min-height: 40px;
    font-size: 0.9rem;
    line-height: 1.4;
    color: var(--text-muted);
    font-weight: 500;
}
#end-screen {
    text-align: center;
    padding: 40px 20px;
    display: none;
    flex-direction: column;
    gap: 15px;
}
#end-screen h2 { color: var(--emerald); font-size: 2rem; }
.reset-btn {
    background: var(--cyan);
    color: #0f172a;
    border: 0;
    padding: 12px 25px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    align-self: center;
}
</style>
</head>
<body>

<div id="game-container">
  <div class="header">
    <div class="title">🕵️‍♂️ Optics Lab: Secret Science Decoder</div>
    <div class="score">Progress: <span id="progress-idx">0</span>/5 Completed</div>
  </div>

  <div class="layout" id="main-layout">
    <div class="canvas-container">
      <canvas id="labCanvas"></canvas>
    </div>

    <div class="quiz-panel">
      <div class="question-box" id="q-text">Loading question data...</div>
      <div class="options-list" id="options-box"></div>
      <div class="feedback" id="feedback-text">Select an option to test your science knowledge.</div>
    </div>
  </div>

  <div id="end-screen">
    <h2>🏆 Lab Assistant Certification Complete!</h2>
    <p>You have correctly solved all five core science concept benchmarks for Light, Shadows, and Reflections.</p>
    <button class="reset-btn" onclick="location.reload()">Restart Lab Session</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let canvas, ctx, currentLevel = 0;

const levels = [
    {
        question: "What is the dark patch called that forms on a wall when an opaque object blocks the path of light?",
        options: ["A Reflection", "A Shadow", "A Spectrum"],
        correct: 1,
        type: "shadow",
        explanation: "Correct! A shadow forms because light cannot pass through an opaque object."
    },
    {
        question: "Which type of material allows ALL light to pass through it cleanly, letting you see objects on the other side perfectly?",
        options: ["Transparent material", "Translucent material", "Opaque material"],
        correct: 0,
        type: "materials",
        explanation: "Correct! Transparent materials like clear glass allow light to pass completely through."
    },
    {
        question: "What property of light is demonstrated when you look through a bent straw and can no longer see a burning candle flame?",
        options: ["Dispersion of light", "Lateral inversion", "Rectilinear propagation (Light travels in straight lines)"],
        correct: 2,
        type: "rectilinear",
        explanation: "Correct! Light only travels in straight lines, so it cannot curve around a bent straw."
    },
    {
        question: "When a shadow is cast by a large light source, what is the central, completely dark region of that shadow called?",
        options: ["The Penumbra", "The Umbra", "The Lateral Patch"],
        correct: 1,
        type: "regions",
        explanation: "Correct! The Umbra is the central darkest part, while the Penumbra is the outer partial shadow."
    },
    {
        question: "What is the phenomenon called when you lift your right hand in front of a plane mirror, but your reflection appears to lift its left hand?",
        options: ["Lateral inversion", "Regular reflection", "Bending of a beam"],
        correct: 0,
        type: "inversion",
        explanation: "Correct! Lateral inversion is the left-to-right sideways reversal caused by a flat plane mirror."
    }
];

window.onload = () => {
    canvas = $('labCanvas');
    ctx = canvas.getContext('2d');
    window.addEventListener('resize', drawDiagram);
    loadLevel();
};

function loadLevel() {
    if (currentLevel >= levels.length) {
        $('main-layout').style.display = 'none';
        $('end-screen').style.display = 'flex';
        $('progress-idx').innerText = currentLevel;
        return;
    }

    let data = levels[currentLevel];
    $('progress-idx').innerText = currentLevel;
    $('q-text').innerText = data.question;
    $('feedback-text').innerText = "Analyze the diagram and pick the correct option.";
    $('feedback-text').style.color = "#94a3b8";

    let optBox = $('options-box');
    optBox.innerHTML = '';
    data.options.forEach((opt, idx) => {
        let btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(idx, btn);
        optBox.appendChild(btn);
    });

    drawDiagram();
}

function checkAnswer(chosen, btn) {
    let data = levels[currentLevel];
    if (chosen === data.correct) {
        btn.style.background = "#059669";
        btn.style.borderColor = "#10b981";
        $('feedback-text').innerText = "🎯 " + data.explanation;
        $('feedback-text').style.color = "#34d399";
        
        // Block other buttons
        let buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.onclick = null);

        setTimeout(() => {
            currentLevel++;
            loadLevel();
        }, 3000);
    } else {
        btn.style.background = "#dc2626";
        btn.style.borderColor = "#f87171";
        $('feedback-text').innerText = "❌ Incorrect definition. Review the textbook chapter details and try another choice.";
        $('feedback-text').style.color = "#f87171";
    }
}

function drawDiagram() {
    let w = canvas.width = canvas.parentElement.clientWidth;
    let h = canvas.height = canvas.parentElement.clientHeight;
    ctx.clearRect(0, 0, w, h);
    
    let type = levels[currentLevel].type;
    ctx.lineWidth = 2;

    if (type === "shadow") {
        // Bulb
        ctx.fillStyle = "#fbbf24";
        ctx.beginPath(); ctx.arc(40, h/2, 15, 0, Math.PI*2); ctx.fill();
        ctx.fillText("Light Source", 15, h/2 - 25);
        
        // Light rays
        ctx.strokeStyle = "rgba(251, 191, 36, 0.3)";
        ctx.beginPath(); ctx.moveTo(40, h/2); ctx.lineTo(w-50, h/2 - 50); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(40, h/2); ctx.lineTo(w-50, h/2 + 50); ctx.stroke();

        // Opaque Block
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(w/2 - 20, h/2 - 25, 40, 50);
        ctx.fillStyle = "#fff";
        ctx.font = "11px sans-serif";
        ctx.fillText("Opaque Object", w/2 - 35, h/2 - 35);

        // Screen & Shadow Patch
        ctx.fillStyle = "#475569";
        ctx.fillRect(w - 40, 20, 15, h - 40);
        ctx.fillStyle = "#0f172a"; // Dark shadow patch
        ctx.fillRect(w - 40, h/2 - 25, 15, 50);
        ctx.fillStyle = "#fff";
        ctx.fillText("Dark Shadow", w - 110, h/2 + 5);

    } else if (type === "materials") {
        // Flashlight beam hitting a divider
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(20, h/2 - 10, w/3, 20);
        ctx.fillText("Incoming Light", 20, h/2 - 20);

        ctx.strokeStyle = "#fff";
        ctx.strokeRect(w/2 - 10, 40, 20, h - 80);
        ctx.fillStyle = "rgba(255,255,255,0.1)";
        ctx.fillRect(w/2 - 10, 40, 20, h - 80);
        ctx.fillStyle = "#fff";
        ctx.fillText("Test Material", w/2 - 35, 30);

        // Light exiting clean
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(w/2 + 10, h/2 - 10, w/3, 20);
        ctx.fillText("Passes Through Fully", w/2 + 20, h/2 - 20);

    } else if (type === "rectilinear") {
        // Draw straight line versus blocked path
        ctx.strokeStyle = "#34d399";
        ctx.beginPath(); ctx.moveTo(30, h/2); ctx.lineTo(w - 50, h/2); ctx.stroke();
        ctx.fillStyle = "#34d399";
        ctx.beginPath(); ctx.arc(30, h/2, 6, 0, Math.PI*2); ctx.fill();
        ctx.fillText("Light travel track (Straight Only)", 40, h/2 - 15);

        // Bent Straw Indicator Lines
        ctx.strokeStyle = "#ef4444";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(w/2 - 40, h/2 + 40);
        ctx.lineTo(w/2, h/2 + 40);
        ctx.lineTo(w/2 + 40, h/2 + 80);
        ctx.stroke();
        ctx.fillStyle = "#ef4444";
        ctx.fillText("Bent Pathway Blocks Ray", w/2 - 60, h/2 + 25);

    } else if (type === "regions") {
        // Extended light source showing Umbra and Penumbra
        ctx.fillStyle = "#fbbf24";
        ctx.beginPath(); ctx.arc(40, h/2 - 20, 10, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(40, h/2 + 20, 10, 0, Math.PI*2); ctx.fill();
        ctx.fillText("Large Light", 15, h/2 - 40);

        ctx.fillStyle = "#64748b";
        ctx.beginPath(); ctx.arc(w/2, h/2, 20, 0, Math.PI*2); ctx.fill();

        // Draw overlapping region shadows
        ctx.fillStyle = "rgba(255,255,255,0.05)";
        ctx.fillRect(w-60, 20, 20, h-40);
        
        ctx.fillStyle = "rgba(0,0,0,0.4)"; // Penumbra
        ctx.fillRect(w-60, h/2 - 40, 20, 80);
        
        ctx.fillStyle = "#000"; // Umbra
        ctx.fillRect(w-60, h/2 - 15, 20, 30);

        ctx.fillStyle = "#38bdf8";
        ctx.fillText("Umbra (Darkest)", w - 160, h/2 + 5);
        ctx.fillText("Penumbra (Partial)", w - 170, h/2 - 25);

    } else if (type === "inversion") {
        // Plane Mirror Left-Right Swap illustration
        ctx.strokeStyle = "#e2e8f0";
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(w/2, 30); ctx.lineTo(w/2, h - 30); ctx.stroke();
        ctx.fillStyle = "#fff";
        ctx.fillText("PLANE MIRROR", w/2 - 40, 20);

        // Object Letter F
        ctx.fillStyle = "#fbbf24";
        ctx.font = "bold 40px monospace";
        ctx.fillText("F", w/4, h/2 + 15);
        ctx.font = "12px sans-serif";
        ctx.fillText("Real Object", w/4 - 15, h/2 + 40);

        // Flipped Virtual Mirror Image
        ctx.save();
        ctx.translate(w * 0.75, h/2);
        ctx.scale(-1, 1); // Sideways lateral inversion flip
        ctx.fillStyle = "#34d399";
        ctx.font = "bold 40px monospace";
        ctx.fillText("F", 0, 15);
        ctx.restore();
        
        ctx.fillStyle = "#34d399";
        ctx.fillText("Laterally Inverted Image", w * 0.6, h/2 + 40);
    }
}
</script>
</body>
</html>
