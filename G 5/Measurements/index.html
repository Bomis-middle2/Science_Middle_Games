<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Measurement Lab Escape</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --text-color: #f8fafc;
      --success-color: #22c55e;
      --danger-color: #ef4444;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game-container {
      background-color: var(--card-bg);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 90%;
      max-width: 600px;
      text-align: center;
      border: 1px solid #334155;
    }

    h1 {
      margin-top: 0;
      color: var(--accent-color);
    }

    .hud {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding: 0.75rem 1rem;
      background: #0f172a;
      border-radius: 8px;
      font-weight: bold;
    }

    .question-box {
      font-size: 1.25rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .options-grid {
      display: grid;
      gap: 0.75rem;
    }

    button {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 0.85rem 1rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background-color: var(--accent-hover);
      color: #fff;
    }

    button:active {
      transform: scale(0.98);
    }

    .feedback {
      margin-top: 1rem;
      font-weight: bold;
      min-height: 24px;
    }

    .correct {
      color: var(--success-color);
    }

    .wrong {
      color: var(--danger-color);
    }

    .hidden {
      display: none;
    }

    .restart-btn {
      margin-top: 1.5rem;
      background-color: #64748b;
      color: #fff;
    }

    .restart-btn:hover {
      background-color: #475569;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div id="start-screen">
      <h1>Measurement Lab Escape</h1>
      <p>Answer 15 questions correctly on length, mass, capacity, time, and temperature to unlock all security doors and escape the laboratory!</p>
      <button onclick="startGame()">Start Challenge</button>
    </div>

    <div id="game-screen" class="hidden">
      <div class="hud">
        <div>Door: <span id="door-num">1</span> / 15</div>
        <div>Time: <span id="timer">03:00</span></div>
      </div>

      <div class="question-box" id="question-text">Question text goes here...</div>

      <div class="options-grid" id="options-container">
        <!-- Options generated by JS -->
      </div>

      <div id="feedback" class="feedback"></div>
    </div>

    <div id="end-screen" class="hidden">
      <h1 id="end-title">Game Over</h1>
      <p id="end-message">You ran out of time!</p>
      <button class="restart-btn" onclick="startGame()">Try Again</button>
    </div>
  </div>

  <script>
    const bank = [
      {
        q: "In ancient times, which of these was used as a non-standard unit of length?",
        o: ["Cubit", "Metre", "Litre"],
        a: "Cubit"
      },
      {
        q: "Which instrument is used to measure human body temperature?",
        o: ["Barometer", "Clinical thermometer", "Beam balance"],
        a: "Clinical thermometer"
      },
      {
        q: "What is the normal temperature of a human body?",
        o: ["37°C", "100°C", "0°C"],
        a: "37°C"
      },
      {
        q: "How many grams are there in 5 kilograms?",
        o: ["500 g", "5000 g", "50 g"],
        a: "5000 g"
      },
      {
        q: "What unit is best suited to measure the length of a cloth?",
        o: ["Metre", "Millimetre", "Kilometre"],
        a: "Metre"
      },
      {
        q: "Which tool is specifically used to measure time intervals in sports?",
        o: ["Calendar", "Stopwatch", "Barometer"],
        a: "Stopwatch"
      },
      {
        q: "How many millilitres are in 1 litre of liquid?",
        o: ["100 mL", "1000 mL", "10000 mL"],
        a: "1000 mL"
      },
      {
        q: "What is the boiling point of water on the Celsius scale?",
        o: ["100°C", "0°C", "37°C"],
        a: "100°C"
      },
      {
        q: "According to the text, what unit of measurement equals 1/60th of a second?",
        o: ["Jiffy", "Mickey", "Span"],
        a: "Jiffy"
      },
      {
        q: "What is the name of the liquid historically used inside clinical thermometers?",
        o: ["Water", "Mercury", "Alcohol"],
        a: "Mercury"
      },
      {
        q: "How many seconds are in 1 minute?",
        o: ["60 s", "100 s", "3600 s"],
        a: "60 s"
      },
      {
        q: "What tool would you use to measure the mass of an object?",
        o: ["Weighing scale", "Ruler", "Measuring jar"],
        a: "Weighing scale"
      },
      {
        q: "Which unit is used to measure larger liquid capacities?",
        o: ["Kilolitre", "Milligram", "Centimetre"],
        a: "Kilolitre"
      },
      {
        q: "Before taking a body reading with a mercury thermometer, it should be checked that the level is below:",
        o: ["35°C", "37°C", "100°C"],
        a: "35°C"
      },
      {
        q: "What is a 'mickey' defined as in the text?",
        o: ["Cursor movement", "1/60th of a second", "Top segment of thumb"],
        a: "Cursor movement"
      }
    ];

    let currentQuestionIndex = 0;
    let timeRemaining = 180; // 3 minutes
    let timerInterval = null;

    const startScreen = document.getElementById("start-screen");
    const gameScreen = document.getElementById("game-screen");
    const endScreen = document.getElementById("end-screen");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const doorNum = document.getElementById("door-num");
    const timerDisplay = document.getElementById("timer");
    const feedback = document.getElementById("feedback");
    const endTitle = document.getElementById("end-title");
    const endMessage = document.getElementById("end-message");

    function startGame() {
      currentQuestionIndex = 0;
      timeRemaining = 180;
      feedback.textContent = "";

      startScreen.classList.add("hidden");
      endScreen.classList.add("hidden");
      gameScreen.classList.remove("hidden");

      startTimer();
      loadQuestion();
    }

    function startTimer() {
      clearInterval(timerInterval);
      updateTimerDisplay();
      
      timerInterval = setInterval(() => {
        timeRemaining--;
        updateTimerDisplay();

        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          endGame(false, "Time ran out! You are locked inside the lab.");
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(timeRemaining / 60);
      const seconds = timeRemaining % 60;
      timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function loadQuestion() {
      feedback.textContent = "";
      doorNum.textContent = currentQuestionIndex + 1;

      const qData = bank[currentQuestionIndex];
      questionText.textContent = qData.q;
      optionsContainer.innerHTML = "";

      qData.o.forEach(option => {
        const btn = document.createElement("button");
        btn.textContent = option;
        btn.onclick = () => selectOption(option, qData.a);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedOption, correctAnswer) {
      if (selectedOption === correctAnswer) {
        feedback.className = "feedback correct";
        feedback.textContent = "Correct! Door unlocked.";

        setTimeout(() => {
          currentQuestionIndex++;
          if (currentQuestionIndex < bank.length) {
            loadQuestion();
          } else {
            clearInterval(timerInterval);
            endGame(true, "Congratulations! You successfully unlocked all 15 doors and escaped the Measurement Lab!");
          }
        }, 800);
      } else {
        feedback.className = "feedback wrong";
        feedback.textContent = "Incorrect choice! Time penalty (-10 seconds).";
        timeRemaining = Math.max(0, timeRemaining - 10);
        updateTimerDisplay();
      }
    }

    function endGame(victory, message) {
      gameScreen.classList.add("hidden");
      endScreen.classList.remove("hidden");

      if (victory) {
        endTitle.textContent = "Escape Successful!";
        endTitle.style.color = "var(--success-color)";
      } else {
        endTitle.textContent = "Lab Locked Down!";
        endTitle.style.color = "var(--danger-color)";
      }

      endMessage.textContent = message;
    }
  </script>
</body>
</html>
